<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxenboden 3D – Test</title>
<style>
  :root { --panel: 205px; }
  html, body { margin: 0; height: 100%; background: #f2efe9; overflow: hidden; font-family: system-ui, sans-serif; touch-action: none; color: #2b1d14; }
  canvas { display: block; width: 100%; height: calc(100% - var(--panel)); }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: var(--panel); box-sizing: border-box; padding: 8px max(12px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-bottom)); background: #fffc; border-top: 2px solid #2b1d14; overflow: auto; }
  .reihe { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .reihe > span { font-size: 13px; min-width: 84px; font-weight: 600; }
  button { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 10px; border: 2px solid #2b1d14; background: #fff; color: #2b1d14; }
  button.an { background: #2b1d14; color: #fff; }
  button:disabled { opacity: .35; }
  #info { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); font-size: 13px; background: #fffc; padding: 6px 10px; border-radius: 10px; max-width: 80vw; }
  @media (orientation: landscape) and (max-height: 520px) { :root { --panel: 120px; } .reihe { margin-bottom: 3px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">lädt …</div>
<div id="panel">
  <div class="reihe"><span>Einstreu</span><button data-mat="stroh">Stroh</button><button data-mat="hanf">Leinstroh / Hanf</button><button data-mat="spaene">Späne</button></div>
  <div class="reihe"><span>Boxgröße</span>
    <button data-gr="a">A 3×3</button><button data-gr="b">B 3×4</button><button data-gr="c">C 4×4</button><button data-gr="d">D 4×5</button><button data-gr="e">E 5×5</button></div>
  <div class="reihe"><span>Pferd in der Box</span><span id="pferde" style="display:contents"></span></div>
  <div class="reihe"><span>Mistigkeit</span>
    <button data-st="0">frisch</button><button data-st="1">1 · nach 1 Nacht</button><button data-st="2">2 · nach 2 Nächten</button><button data-st="3">3 · nach 3 Nächten</button>
    <button id="aepfel">Pferdeäpfel: an</button><button id="neu">Äpfel neu verteilen</button><button id="dreh">Drehen: aus</button></div>
</div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./lib/loaders/GLTFLoader.js";

const canvas = document.getElementById("c"), info = document.getElementById("info");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 5, 6000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a96, 1.9));
const sonne = new THREE.DirectionalLight(0xffffff, 1.3); sonne.position.set(-30, 60, 50); scene.add(sonne);

// ---- Zustand ----
const S = { mat: "stroh", gr: "a", pferd: "warm", st: 0, aepfel: true, dreh: false, seed: 1 };
const GROESSEN = { a: "3×3 m", b: "3×4 m", c: "4×4 m", d: "4×5 m", e: "5×5 m" };
const E_CM = 0.79;   // 1 Modelleinheit = 0,79 cm
const APFEL_JE_M2 = [0, 5.6, 10.9, 16.6];   // wie in Blender: Fläche A (9 m²) 50 / 98 / 149 Äpfel
const PLATT_CM = 5;
const NAME_MAT = { stroh: "Stroh", hanf: "Leinstroh/Hanf", spaene: "Späne" };
const STROH_ZIEL = new THREE.Color(138 / 255, 98 / 255, 34 / 255).convertSRGBToLinear();   // Stroh wird mit der Mistigkeit dunkel pissgelb-bräunlich (Dome)

const HANF_DUNKEL = [0, 0.22, 0.45, 0.68], HANF_ZIEL = new THREE.Color(110 / 255, 84 / 255, 62 / 255).convertSRGBToLinear();   // Leinstroh/Hanf wird mit der Mistigkeit dunkler (Foto 6, Dome): braun-grau wie feuchter, benutzter Hanf

// ---- Laden ----
const lader = new GLTFLoader();
const laden = (datei) => new Promise((ok, f) => lader.load(datei, (g) => ok(g.scene), undefined, f));
const cache = {};
function material(alt, hatNormalen) {
  const name = (alt.name || "").replace(/\.\d{3}$/, "");
  if (name === "tinte") { const m = new THREE.MeshBasicMaterial({ side: THREE.FrontSide }); m.color.set("#080809"); return m; }
  const m = hatNormalen ? new THREE.MeshLambertMaterial({ side: THREE.DoubleSide }) : new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
  m.color.copy(alt.color); m.userData.basis = alt.color.clone(); return m;

async function boden(mat, gr) {
  const key = mat + "-" + gr; if (cache[key]) return cache[key];

  const wurzel = await laden(`./boxenboden/${key}.glb`); let hoehe = null;
  try { const hj = await (await fetch(`./boxenboden/hoehe-${key}.json`)).json(); hoehe = { cell: hj.cell, m: new Map(hj.hg.map((q) => [q[0] + "," + q[1], q[2]])) }; } catch (e) { hoehe = null; }   // Höhe der Streu (Ebene 1) für die Äpfel
  const P = "box" + gr.toUpperCase(), haufen = [];

    o.material = Array.isArray(o.material) ? o.material.map((m) => material(m, true)) : material(o.material, true); });

    const nn = String(h.i).padStart(2, "0");
    const k = wurzel.getObjectByName(`${P}_haufen_${nn}_koerper`), l = wurzel.getObjectByName(`${P}_haufen_${nn}_halme`);
    haufen.push({ ...h, objs: [k, l].filter(Boolean), sy: [k, l].filter(Boolean).map((o) => o.scale.y), koerper: k });
  }

  let ober1 = null; try { ober1 = await (await fetch(`./boxenboden/oberflaeche1-${key}.json`)).json(); } catch (e) { ober1 = null; }   // gemessene Oberfläche nur der Bodenschicht (Ebene 1)
  return (cache[key] = { wurzel, daten, haufen, hoehe, ober, ober1 });
}
const aepfelVorlagen = [];
async function apfelLaden() {
  for (const [n, w] of [["rund", 5], ["weich", 3], ["hart", 2]]) {
    const g = await laden(`./pferdeapfel-${n}.glb`);
    g.traverse((o) => { if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map((m) => material(m, !!o.geometry.attributes.normal)) : material(o.material, !!o.geometry.attributes.normal); });
    const bb = new THREE.Box3().setFromObject(g);
    aepfelVorlagen.push({ name: n, g, w, gr: Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z), minY: bb.min.y });

let BIB = null; const EINSINK_CM = 2.0;   // so tief sinken die Äpfel in die Streu ein (Dome: 1–3 cm, nicht versinken)

// ---- Mistigkeit anwenden ----

  B.wurzel.traverse((o) => { if (!o.isMesh) return; for (const m of [].concat(o.material)) if (m.userData.basis) m.color.copy(m.userData.basis).lerp(zielFarbe, HANF_DUNKEL[S.st]); });
  for (const h of B.haufen) {

    if (B.wegAb && B.wegAb.has(h.i) && B.wegAb.get(h.i) <= S.st) sicht = false;   // Variante a (Dome): wo Äpfel liegen, ist der platt getretene Haufen der Ebene 2 weggeschoben
    h.objs.forEach((o, i) => { o.visible = sicht; o.scale.y = h.sy[i] * sk; });

// ---- Pferdeäpfel ----
const aepfelGruppe = new THREE.Group(); scene.add(aepfelGruppe);

const GROESSE = {   // Quellen: Kotmenge ≈ 5 % des Körpergewichts je Tag, 4–13 Haufen am Tag (Rutgers/Uni Florida); Größen einzelner Äpfel nicht veröffentlicht → Kubikwurzel des Gewichts (Warmblut 600 kg, Kaltblut ≈ 850, Pony ≈ 300, Fohlen ≈ 100–150 kg)
  kalt:    { name: "Kaltblut",              erz: [{ gs: 1.15, kf: 1.0, tw: [5, 3, 2] }] },
  warm:    { name: "Warmblut / Großpferd",  erz: [{ gs: 1.0, kf: 1.0, tw: [5, 3, 2] }] },
  pony:    { name: "Pony",                  erz: [{ gs: 0.8, kf: 1.0, tw: [5, 3, 2] }] },
  fohlen:  { name: "Fohlen",                erz: [{ gs: 0.6, kf: 1.0, tw: [2, 7, 1] }] },
  stute:   { name: "Stute + Fohlen",        erz: [{ gs: 1.0, kf: 1.0, tw: [5, 3, 2] }, { gs: 0.6, kf: 1.0, tw: [2, 7, 1] }] },
  kaltfo:  { name: "Kaltblutstute + Fohlen", erz: [{ gs: 1.15, kf: 1.0, tw: [5, 3, 2] }, { gs: 0.65, kf: 1.0, tw: [2, 7, 1] }] },
  ponyfo:  { name: "Ponystute + Fohlen",    erz: [{ gs: 0.8, kf: 1.0, tw: [5, 3, 2] }, { gs: 0.55, kf: 1.0, tw: [2, 7, 1] }] },
};
function aepfelStand(B) {
  const schl = S.seed + "|" + S.pferd;

  const { bx, by } = B.daten, R = mulberry(S.seed * 7919 + S.gr.charCodeAt(0) * 13 + S.pferd.charCodeAt(0)), alt = S.st, erz = GROESSE[S.pferd].erz;
  const gr = aepfelVorlagen[0].gr, LIM = 8.5, rc = new THREE.Raycaster(), ab = new THREE.Vector3(0, -1, 0);
  const grenze = (x, y) => Math.abs(x) < bx / 2 - 4 && Math.abs(y) < by / 2 - 4;
  let traeger = [];
  const LIMM = B.daten.mat === "stroh" ? 10.5 : 9.4;
  const KONTINGENT = () => 4 + S.st;   // Dome: die Ebene 2 darf nicht so stark verschwinden – je Nacht werden höchstens 5/6/7 platt getretene Haufen weggeschoben, je Apfelhaufen nur der nächste
  const anzahlWeg = () => { let n = 0; B.wegAb.forEach((v) => { if (v === S.st) n++; }); return n; };
  const deck = (x, y, r) => {   // Welche sichtbaren Haufen (Ebene 2) liegen unter der Stelle? hohe verhindern die Stelle, ein platt getretener darf weggeschoben werden (solange das Kontingent reicht)
    const platt = []; let ok = true;
    for (const hp of B.haufen) { if (!hp.sichtbar) continue; const f = hp.h === 18 ? 0.3 : 0.2, rr = hp.h === 18 ? 0.8 : 0.8;
      const dx = (x - hp.x) / (hp.rx * rr + r * f), dy = (y - hp.y) / (hp.ry * rr + r * f); if (dx * dx + dy * dy < 1) { if (hp.h === 18) platt.push(hp); else ok = false; } }
    if (platt.length && anzahlWeg() >= KONTINGENT()) ok = false;

  };

    if (!B.hoehe) return; const pl = deck(x, y, r).platt; if (!pl.length) return;
    let best = pl[0], bd = 1e9; for (const hp of pl) { const d = Math.hypot(hp.x - x, hp.y - y); if (d < bd) { bd = d; best = hp; } }

  };

        const ix = Math.floor((x - O1.x0) / O1.cell), iy = Math.floor((y - O1.y0) / O1.cell); let sum = 0, n = 0, mx = 0;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const jx = ix + dx, jy = iy + dy; if (jx >= 0 && jy >= 0 && jx < O1.nx && jy < O1.ny) { const z = O1.z[jy * O1.nx + jx]; sum += z; n++; mx = Math.max(mx, z); } }

      }

        let m = 0;

      }
      const c = B.hoehe.cell, ix = Math.floor(x / c), iy = Math.floor(y / c);
      return Math.max(2.0, (B.hoehe.m.get(ix + "," + iy) || 2.35) - 0.35);
    }
    const OB = B.ober && B.ober[S.st];
    if (OB) {
      const ix = Math.floor((x - OB.x0) / OB.cell), iy = Math.floor((y - OB.y0) / OB.cell); let sum = 0, n = 0;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const jx = ix + dx, jy = iy + dy; if (jx >= 0 && jy >= 0 && jx < OB.nx && jy < OB.ny) { sum += OB.z[jy * OB.nx + jx]; n++; } }

    }

  };

  const neu = (x, y, zb, pile, kipp, E, alt_) => {

          for (let ai = 0; ai < va.length; ai++) {
            const a = va[ai], mw = mws[ai], e = mw.elements, q ={ ti: aepfelVorlagen.findIndex((v) => v.name === a.typ), gs: E.gs, s: Math.hypot(e[0], e[1], e[2]), x: e[12], y: -e[14], zb: e[13], ry: 0, rx: 0, rz: 0, mw: e.slice(), pile: c, zc: 0 };
            c.r = Math.max(c.r, Math.hypot(q.x - cx, q.y - cy) + gr * E.gs * 0.5); recs.push(q); c.aepfel.push(q);
          }
          festlegen(cx, cy, c.r); piles.push(c); eigene.push(c); continue;
        }
        const k = Math.round((12 + Math.floor(R() * 9)) * E.kf), c = { x: cx, y: cy, r: gr * E.gs * (0.55 + 0.045 * k), aepfel: [], verteilt: false, E, rho }; piles.push(c); eigene.push(c);
        for (let i = 0; i < k; i++) for (let t = 0; t < 120; t++) {
          const rr = c.r * Math.pow(R(), 0.8), a = R() * 6.283, x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
          if (!grenze(x, y) || !c.aepfel.every((q) => Math.hypot(q.x - x, q.y - y) > gr * E.gs * 0.2)) continue; const z = versuch(x, y); if (z === null) continue; if (stapel(x, y, z, c)) break;
        }
      }
      for (let n = 0; n < nE && zu < 9000; ) {   // einzelne Äpfel, meist neben einem eigenen Haufen
        const c = eigene.length ? eigene[Math.floor(R() * eigene.length)] : null, a = R() * 6.283, d = c ? Math.max(c.r, gr * E.gs * 1.2) + gr * E.gs * (0.9 + 1.4 * R()) : 0;
        const x = c ? c.x + Math.cos(a) * d : (R() - .5) * (bx - 12), y = c ? c.y + Math.sin(a) * d : (R() - .5) * (by - 12); zu++;
        if (!grenze(x, y) || !frei(x, y, 0.9, E.gs)) continue; const z = versuch(x, y, gr * E.gs * 0.7, 0.75); if (z === null) continue; neu(x, y, z, null, 0.3, E); festlegen(x, y, gr * E.gs * 0.7); n++;
      }
    }
    stand[s] = recs.map((q) => ({ ti: q.ti, s: q.s, x: q.x, y: q.y, zb: q.zb, ry: q.ry, rx: q.rx, rz: q.rz, mw: q.mw }));
  }
  S.st = alt; stufeAnwenden(B); B.wurzel.updateMatrixWorld(true);
  B.stand = stand; B.standSchl = schl; return stand;
}
function aepfelStreuen(B) {
  aepfelGruppe.clear();
  if (!S.aepfel || S.st === 0 || !aepfelVorlagen.length) return 0;
  const liste = aepfelStand(B)[S.st];
  for (const q of liste) {
    const v = aepfelVorlagen[q.ti], o = v.g.clone(true); o.userData.typ = v.name;
    if (q.mw) { o.matrix.fromArray(q.mw); o.matrix.decompose(o.position, o.quaternion, o.scale); }
    else { o.scale.setScalar(q.s); o.rotation.set(q.rx, q.ry, q.rz); o.position.set(q.x, q.zb - v.minY * q.s - 0.3, -q.y); }
    aepfelGruppe.add(o);
  }
  return liste.length;
}

// ---- Kamera (Ziehen = drehen, Mausrad/Zwei Finger = zoomen) ----
let yaw = 0.6, pitch = 0.75, dist = 900, ziel = new THREE.Vector3();
function kamera() {
  camera.position.set(ziel.x + dist * Math.cos(pitch) * Math.sin(yaw), ziel.y + dist * Math.sin(pitch), ziel.z + dist * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt(ziel);
}
const zeiger = new Map(); let letztePinch = 0;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); zeiger.set(e.pointerId, [e.clientX, e.clientY]); });
canvas.addEventListener("pointerup", (e) => { zeiger.delete(e.pointerId); letztePinch = 0; });
canvas.addEventListener("pointermove", (e) => {
  if (!zeiger.has(e.pointerId)) return; const alt = zeiger.get(e.pointerId); zeiger.set(e.pointerId, [e.clientX, e.clientY]);
  if (zeiger.size === 1) { yaw -= (e.clientX - alt[0]) * 0.007; pitch = Math.max(0.12, Math.min(1.5, pitch + (e.clientY - alt[1]) * 0.006)); }
  else if (zeiger.size === 2) { const [a, b] = [...zeiger.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (letztePinch) dist = Math.max(120, Math.min(3000, dist * letztePinch / d)); letztePinch = d; }
});
canvas.addEventListener("wheel", (e) => { e.preventDefault(); dist = Math.max(120, Math.min(3000, dist * (e.deltaY > 0 ? 1.1 : 0.91))); }, { passive: false });

// ---- Anzeige ----
let aktuell = null, ladeNr = 0;
async function zeigen() {
  const nr = ++ladeNr; const key = S.mat + "-" + S.gr;
  info.textContent = "lädt …";
  let B;
  try { B = await boden(S.mat, S.gr); } catch (e) { if (nr === ladeNr) info.textContent = NAME_MAT[S.mat] + " " + S.gr.toUpperCase() + ": noch nicht fertig angepasst – kommt später."; return; }
  if (nr !== ladeNr) return;
  if (aktuell && aktuell !== B) scene.remove(aktuell.wurzel);
  if (!aepfelVorlagen.length) await apfelLaden();
  if (nr !== ladeNr) return;
  aktuell = B; scene.add(B.wurzel); stufeAnwenden(B); B.wurzel.updateMatrixWorld(true);
  const n = aepfelStreuen(B);
  ziel.set(0, 6, 0); dist = Math.max(B.daten.bx, B.daten.by) * 2.5;
  const sicht = B.haufen.filter((h) => h.sichtbar).length;
  info.textContent = `${NAME_MAT[S.mat]} · Box ${S.gr.toUpperCase()} (${GROESSEN[S.gr]}) · ` + (S.st ? `Mistigkeit ${S.st}` : "frisch eingestreut") + ` · ${sicht} von ${B.haufen.length} Haufen` + (S.st && S.aepfel ? ` · ${GROESSE[S.pferd].name} · ${n} Pferdeäpfel` : "");
}
function knoepfe() {
  document.querySelectorAll("[data-mat]").forEach((b) => b.classList.toggle("an", b.dataset.mat === S.mat));
  document.querySelectorAll("[data-gr]").forEach((b) => b.classList.toggle("an", b.dataset.gr === S.gr));
  document.querySelectorAll("[data-pf]").forEach((b) => b.classList.toggle("an", b.dataset.pf === S.pferd));
  document.querySelectorAll("[data-st]").forEach((b) => b.classList.toggle("an", +b.dataset.st === S.st));
  document.getElementById("aepfel").textContent = "Pferdeäpfel: " + (S.aepfel ? "an" : "aus");
  document.getElementById("aepfel").disabled = document.getElementById("neu").disabled = S.st === 0;
  document.getElementById("dreh").textContent = "Drehen: " + (S.dreh ? "an" : "aus");
  location.hash = `${S.mat}-${S.gr}-${S.st}`;
}
document.querySelectorAll("[data-mat]").forEach((b) => b.onclick = () => { S.mat = b.dataset.mat; knoepfe(); zeigen(); });
document.querySelectorAll("[data-gr]").forEach((b) => b.onclick = () => { S.gr = b.dataset.gr; knoepfe(); zeigen(); });
document.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => { S.st = +b.dataset.st; knoepfe(); zeigen(); });
document.getElementById("aepfel").onclick = () => { S.aepfel = !S.aepfel; knoepfe(); zeigen(); };
document.getElementById("neu").onclick = () => { S.seed++; zeigen(); };
document.getElementById("dreh").onclick = () => { S.dreh = !S.dreh; knoepfe(); };
const pf = document.getElementById("pferde");
for (const [k, v] of Object.entries(GROESSE)) { const b = document.createElement("button"); b.dataset.pf = k; b.textContent = v.name; b.onclick = () => { S.pferd = k; knoepfe(); zeigen(); }; pf.appendChild(b); }
const h = location.hash.slice(1).split("-"); if (h.length === 3 && GROESSEN[h[1]]) { S.mat = h[0] === "hanf" ? "hanf" : h[0] === "spaene" ? "spaene" : "stroh"; S.gr = h[1]; S.st = Math.max(0, Math.min(3, +h[2] || 0)); }
function groesse() { const w = innerWidth, hh = innerHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--panel")); renderer.setSize(w, hh, false); camera.aspect = w / hh; camera.updateProjectionMatrix(); }
window.__aepfel = { S, gaps: (nmax) => {   // Prüfung: Abstand der Apfel-Unterseite zur darunterliegenden Fläche (alles Sichtbare außer dem Apfel selbst)
    aepfelGruppe.updateMatrixWorld(true); const rc = new THREE.Raycaster(), alle = []; aktuell.wurzel.traverse((o) => { if (o.isMesh) { let v = o.visible; o.traverseAncestors((q) => { if (!q.visible) v = false; }); if (v && !/tinte/.test(o.material.name || "")) alle.push(o); } });
    return aepfelGruppe.children.slice(0, nmax || 999).map((o) => { const bb = new THREE.Box3().setFromObject(o), c = bb.getCenter(new THREE.Vector3()); const hid = []; o.traverse((q) => { if (q.isMesh) { hid.push(q); q.visible = false; } }); const ziele = alle.concat(aepfelGruppe.children.filter((q) => q !== o)); let best = 99; const rad = Math.min(bb.max.x - bb.min.x, bb.max.z - bb.min.z) * 0.3;   // Kontakt = kleinster Abstand unter der Standfläche (9 Strahlen)
      for (let k = 0; k < 9; k++) { const a = k * 0.785, rr = k ? rad : 0; rc.set(new THREE.Vector3(c.x + Math.cos(a) * rr, bb.min.y + 1.5, c.z + Math.sin(a) * rr), new THREE.Vector3(0, -1, 0)); const t = rc.intersectObjects(ziele, true); if (t.length) best = Math.min(best, bb.min.y + 1.5 - t[0].point.y - 1.5); }
      hid.forEach((q) => { q.visible = true; }); return +best.toFixed(2); });
  }, cam: (y, p, d, tx, ty, tz) => { yaw = y; pitch = p; dist = d; ziel.set(tx, ty, tz); }, zeigen: () => zeigen(), liste: () => { aepfelGruppe.updateMatrixWorld(true); return aepfelGruppe.children.map((o) => ({ typ: o.userData.typ, m: o.matrixWorld.elements })); } };   // für den Export nach Blender (Dome: Äpfel speichern)
addEventListener("resize", groesse); groesse(); knoepfe(); zeigen();
(function lauf() { if (S.dreh) yaw += 0.004; kamera(); renderer.render(scene, camera); requestAnimationFrame(lauf); })();
</script>
