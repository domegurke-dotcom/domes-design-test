<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a24">
<title>Pferdezucht</title>
<style>
  :root {
    --holz: #8b5a3c; --holz-dunkel: #5b3a24; --holz-hell: #b07a52;
    --stroh: #e8c874; --gras: #7cb356; --text: #2b1d12; --leise: #7a6552;
    --karte: #fffaf0; --akzent: #b5642f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(#bfe3f5, #e4f3fb); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: var(--holz-dunkel); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  .geld { background: rgba(255,255,255,.15); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; }
  #stall { width: 100%; max-width: 560px; display: block; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .karte { width: 100%; max-width: 520px; background: var(--karte); border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .karte h2 { margin: 0; font-size: 1.2rem; }
  .unter { color: var(--leise); margin: 2px 0 10px; font-size: .95rem; }
  .werte { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
  .werte dt { color: var(--leise); }
  .werte dd { margin: 0; font-weight: 600; }
  .text { font-size: .9rem; color: var(--leise); margin: 10px 0 0; line-height: 1.4; }
  .knopf { width: 100%; max-width: 520px; padding: 14px; border: 0; border-radius: 12px; background: var(--akzent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .knopf:active { transform: scale(.98); }
  .knopf.aus { background: var(--holz); opacity: .5; cursor: default; }

  /* Auswahl-Overlay */
  #auswahl { position: fixed; inset: 0; background: #f6efe3; z-index: 10; overflow-y: auto; display: none; }
  #auswahl.offen { display: block; }
  .leiste { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: var(--holz-dunkel); color: #fff; }
  .leiste h2 { margin: 0; font-size: 1.05rem; flex: 1; }
  .leiste button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 1rem; cursor: pointer; }
  .inhalt { max-width: 720px; margin: 0 auto; padding: 16px; }
  .rassen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .rasse { background: #fff; border: 2px solid transparent; border-radius: 12px; padding: 6px 6px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .rasse:hover { border-color: var(--holz-hell); }
  .rasse svg { width: 100%; display: block; }
  .rasse b { display: block; font-size: .92rem; padding: 0 4px; }
  .rasse span { display: block; font-size: .8rem; color: var(--leise); padding: 0 4px; }
  .hinweis { font-size: .85rem; color: var(--leise); margin: 0 0 12px; }
  .vorschau { background: linear-gradient(#dff1fa, #fff 70%); border-radius: 14px; overflow: hidden; }
  .vorschau svg { width: 100%; display: block; }
  .feld { margin-top: 16px; }
  .feld > label, .feld > .titel { display: block; font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid #e2d6c3; background: #fff; border-radius: 999px; padding: 5px 10px 5px 5px; font: inherit; font-size: .88rem; cursor: pointer; color: inherit; }
  .chip.an { border-color: var(--akzent); background: #fdf0e4; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); flex: none; }
  .segment { display: flex; background: #e9dfd0; border-radius: 10px; padding: 3px; }
  .segment button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font: inherit; cursor: pointer; color: inherit; }
  .segment button.an { background: #fff; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input[type=range] { width: 100%; accent-color: var(--akzent); }
  .zeile { display: flex; gap: 8px; }
  .zeile input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid #e2d6c3; background: #fff; min-width: 0; }
  .wuerfel { border: 2px solid #e2d6c3; background: #fff; border-radius: 10px; font-size: 1.2rem; padding: 0 12px; cursor: pointer; }
  .wert { float: right; font-weight: 600; color: var(--akzent); }
  .fuss { position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #f6efe3 30%); }
</style>
</head>

      <path d="M340.0,152.0 L342.5,144.4 L345.0,136.6 L347.5,129.0 L350.0,121.5 L352.5,114.4 L355.0,107.7 L357.5,101.7 L360.0,96.4 L362.5,92.0 L365.0,88.6 L367.5,86.2 L370.0,85.0 L372.5,85.0 L375.0,86.2 L377.5,88.7 L380.0,92.3 L382.5,97.2 L385.0,103.3 L387.5,110.4 L390.0,118.5 L392.5,127.4 L395.0,137.1 L397.5,147.4 L400.0,158.0" fill="none" stroke="#2f3a32" stroke-width="4" stroke-linecap="round"/>

  <section class="karte" id="info"></section>
  <button class="knopf" id="waehlen">Pferd auswählen</button>
  <button class="knopf aus" disabled>+ Neue Box bauen (bald)</button>
</main>

<div id="auswahl" role="dialog" aria-modal="true" aria-label="Pferd auswählen"></div>

<script src="pferd.js"></script>
<script>
  // ---------- Spielzustand ----------
  const SPEICHER = "zuchtstall-v2";
  const NAMEN = {
    Stute: ["Schneeflocke", "Luna", "Bella", "Stella", "Fee", "Amira", "Freya", "Nala", "Kira", "Zora", "Dana", "Leonie", "Paula", "Sina", "Aurora", "Jasmin", "Wilma", "Elfe"],
    Hengst: ["Donnerhall", "Sturmwind", "Apollo", "Merlin", "Farid", "Orkan", "Balou", "Rocky", "Picasso", "Zeus", "Blitz", "Gandalf", "Samir", "Titan", "Odin"],
    Wallach: ["Max", "Moritz", "Jonny", "Charly", "Fritz", "Sammy", "Benny", "Lucky", "Pepe", "Bruno", "Oskar", "Theo", "Emil"],
  };
  const zufallAus = a => a[Math.floor(Math.random() * a.length)];

  let spiel = {
    geld: 1000,
    boxen: [{ nr: 1, pferd: { id: "start", name: "Schneeflocke", rasse: "araber", farbe: "schimmel", geschlecht: "Stute", alter: 5, stockmass: 150 } }],
  };
  try { const s = JSON.parse(localStorage.getItem(SPEICHER)); if (s && s.boxen) spiel = s; } catch (e) {}
  const speichern = () => { try { localStorage.setItem(SPEICHER, JSON.stringify(spiel)); } catch (e) {} };

  const fmt = n => n.toLocaleString("de-DE") + " €";
  const $ = id => document.getElementById(id);

  // ---------- Stall ----------
  const STALL = { mitte: 205, boden: 278, cmZuEinheit: 0.74 };
  function zeigeStall() {
    const p = spiel.boxen[0].pferd;
    $("geld").textContent = fmt(spiel.geld);
    const z = zeichnePferd(p.rasse, p.farbe, { seed: p.id, geschlecht: p.geschlecht });
    const s = p.stockmass * STALL.cmZuEinheit / 100;
    const cx = (z.box.minX + z.box.maxX) / 2;
    $("pferdPlatz").innerHTML = `<g transform="translate(${(STALL.mitte - cx * s).toFixed(1)},${STALL.boden}) scale(${s.toFixed(4)})">${z.svg}</g>`;
    const r = rasseById(p.rasse);
    $("info").innerHTML = `
      <h2>${esc(p.name)}</h2>
      <p class="unter">${r.name} · ${FARBEN[p.farbe].name}</p>
      <dl class="werte">
        <dt>Geschlecht</dt><dd>${p.geschlecht}</dd>
        <dt>Alter</dt><dd>${p.alter} Jahre</dd>
        <dt>Stockmaß</dt><dd>${p.stockmass} cm</dd>
        <dt>Herkunft</dt><dd>${r.herkunft}</dd>
      </dl>
      <p class="text">${r.text}</p>`;
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- Auswahl ----------
  const VB = { b: 340, h: 300, boden: 290 };
  function pferdInRahmen(rasse, farbe, cm, opt = {}, mitteX = VB.b / 2) {
    const z = zeichnePferd(rasse, farbe, opt);
    const s = cm / 100, cx = (z.box.minX + z.box.maxX) / 2;
    return `<g transform="translate(${(mitteX - cx * s).toFixed(1)},${VB.boden}) scale(${s})">${z.svg}</g>`;
  }

  function zeigeRassen() {
    const a = $("auswahl");
    a.innerHTML = `
      <div class="leiste"><h2>Rasse wählen</h2><button id="zu" aria-label="Schließen">✕</button></div>
      <div class="inhalt">
        <p class="hinweis">Alle Pferde sind im gleichen Maßstab gezeichnet – so siehst du die echten Größenunterschiede.</p>
        <div class="rassen">
          ${RASSEN.map(r => `
            <button class="rasse" data-id="${r.id}">
              <svg viewBox="0 0 ${VB.b} ${VB.h}"><line x1="0" x2="${VB.b}" y1="${VB.boden}" y2="${VB.boden}" stroke="#d8cbb6" stroke-width="2"/>${pferdInRahmen(r.id, r.farben[0], (r.h[0] + r.h[1]) / 2)}</svg>
              <b>${r.name}</b><span>${r.h[0]}–${r.h[1]} cm · ${r.herkunft}</span>
            </button>`).join("")}
        </div>
      </div>`;
    a.classList.add("offen");
    a.scrollTop = 0;
    $("zu").onclick = schliessen;
    a.querySelectorAll(".rasse").forEach(b => b.onclick = () => zeigeDetail(b.dataset.id));
  }

  let wahl = null;
  function zeigeDetail(id) {
    const r = rasseById(id);
    const g = zufallAus(["Stute", "Hengst", "Wallach"]);
    wahl = {
      id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      rasse: id, farbe: r.farben[0], geschlecht: g, name: zufallAus(NAMEN[g]),
      alter: 3 + Math.floor(Math.random() * 10),
      stockmass: Math.round(r.h[0] + Math.random() * (r.h[1] - r.h[0])),
    };
    const a = $("auswahl");
    a.innerHTML = `
      <div class="leiste"><button id="zurueck">‹ Rassen</button><h2>${r.name}</h2><button id="zu" aria-label="Schließen">✕</button></div>
      <div class="inhalt">
        <div class="vorschau"><svg id="gross" viewBox="0 0 ${VB.b} ${VB.h}"></svg></div>
        <p class="text"><b>${r.herkunft}</b> · ${r.h[0]}–${r.h[1]} cm Stockmaß<br>${r.text}</p>

        <div class="feld"><span class="titel">Fellfarbe</span>
          <div class="chips" id="farben">${r.farben.map(fid => {
            const c = FARBEN[fid];
            return `<button class="chip" data-f="${fid}"><span class="swatch" style="background:linear-gradient(135deg, ${c.body} 55%, ${c.mane} 55%)"></span>${c.name}</button>`;
          }).join("")}</div>
        </div>

        <div class="feld"><span class="titel">Geschlecht</span>
          <div class="segment" id="geschlecht">${["Stute", "Hengst", "Wallach"].map(x => `<button data-g="${x}">${x}</button>`).join("")}</div>
        </div>

        <div class="feld"><label for="groesse">Stockmaß <span class="wert" id="groesseWert"></span></label>
          <input type="range" id="groesse" min="${r.h[0]}" max="${r.h[1]}" step="1">
        </div>

        <div class="feld"><label for="alter">Alter <span class="wert" id="alterWert"></span></label>
          <input type="range" id="alter" min="1" max="25" step="1">
        </div>

        <div class="feld"><label for="name">Name</label>
          <div class="zeile"><input type="text" id="name" maxlength="24" autocomplete="off"><button class="wuerfel" id="wuerfel" aria-label="Zufallsname">🎲</button></div>
        </div>

        <div class="fuss"><button class="knopf" id="einstellen">In Box 1 stellen</button></div>
      </div>`;
    a.scrollTop = 0;
    $("zu").onclick = schliessen;
    $("zurueck").onclick = zeigeRassen;
    a.querySelectorAll("#farben .chip").forEach(b => b.onclick = () => { wahl.farbe = b.dataset.f; aktualisiere(); });
    a.querySelectorAll("#geschlecht button").forEach(b => b.onclick = () => {
      const alt = wahl.geschlecht; wahl.geschlecht = b.dataset.g;
      if (NAMEN[alt].includes(wahl.name)) { wahl.name = zufallAus(NAMEN[wahl.geschlecht]); $("name").value = wahl.name; }
      aktualisiere();
    });
    $("groesse").value = wahl.stockmass;
    $("groesse").oninput = e => { wahl.stockmass = +e.target.value; aktualisiere(); };
    $("alter").value = wahl.alter;
    $("alter").oninput = e => { wahl.alter = +e.target.value; aktualisiere(); };
    $("name").value = wahl.name;
    $("name").oninput = e => { wahl.name = e.target.value; };
    $("wuerfel").onclick = () => { wahl.name = zufallAus(NAMEN[wahl.geschlecht]); $("name").value = wahl.name; };
    $("einstellen").onclick = () => {
      wahl.name = (wahl.name || "").trim() || zufallAus(NAMEN[wahl.geschlecht]);
      spiel.boxen[0].pferd = { ...wahl };
      speichern(); zeigeStall(); schliessen();
    };
    aktualisiere();
  }

  function aktualisiere() {
    const a = $("auswahl");
    a.querySelectorAll("#farben .chip").forEach(b => b.classList.toggle("an", b.dataset.f === wahl.farbe));
    a.querySelectorAll("#geschlecht button").forEach(b => b.classList.toggle("an", b.dataset.g === wahl.geschlecht));
    $("groesseWert").textContent = wahl.stockmass + " cm";
    $("alterWert").textContent = wahl.alter + (wahl.alter === 1 ? " Jahr" : " Jahre");
    // Maßband + Pferd
    let lineal = `<line x1="0" x2="${VB.b}" y1="${VB.boden}" y2="${VB.boden}" stroke="#c9b99f" stroke-width="2"/>`;
    for (let cm = 50; cm <= 250; cm += 50) {
      const y = VB.boden - cm;
      lineal += `<line x1="0" x2="${VB.b}" y1="${y}" y2="${y}" stroke="#b9cfd9" stroke-dasharray="3 5"/><text x="4" y="${y - 3}" font-size="10" fill="#7a8f99">${cm / 100} m</text>`;
    }
    const wy = VB.boden - wahl.stockmass;
    lineal += `<line x1="30" x2="${VB.b - 8}" y1="${wy}" y2="${wy}" stroke="var(--akzent)" stroke-width="1.5"/><text x="${VB.b - 8}" y="${wy - 4}" font-size="11" text-anchor="end" font-weight="700" fill="var(--akzent)">${wahl.stockmass} cm</text>`;
    // Breite anpassen, damit auch große Pferde ganz ins Bild passen
    const z = zeichnePferd(wahl.rasse, wahl.farbe, { seed: wahl.id, geschlecht: wahl.geschlecht });
    const sc = wahl.stockmass / 100, breite = (z.box.maxX - z.box.minX) * sc;
    const vb = Math.max(VB.b, breite + 70);
    $("gross").setAttribute("viewBox", `0 0 ${vb.toFixed(0)} ${VB.h}`);
    lineal = lineal.replaceAll(`x2="${VB.b}"`, `x2="${vb.toFixed(0)}"`).replaceAll(`x2="${VB.b - 8}"`, `x2="${(vb - 8).toFixed(0)}"`).replace(`x="${VB.b - 8}"`, `x="${(vb - 8).toFixed(0)}"`);
    const mx = 40 + breite / 2 + (vb - 50 - breite) / 2;
    $("gross").innerHTML = lineal + `<g transform="translate(${(mx - (z.box.minX + z.box.maxX) / 2 * sc).toFixed(1)},${VB.boden}) scale(${sc})">${z.svg}</g>`;
  }

  function schliessen() { $("auswahl").classList.remove("offen"); $("auswahl").innerHTML = ""; }

  $("waehlen").onclick = zeigeRassen;
  $("pferdPlatz").addEventListener("click", zeigeRassen);
  zeigeStall();
</script>
</body>
</html>
