<title>Pferdezucht</title>
<style>

  // ---------- Pferdeanhänger: EINE gemeinsame Liste für beide Anhänger ----------
  // Box/Ort → Pferdeanhänger (ein Pferd) und Hauptmenü → Pferdeanhänger (Mehrfachauswahl) bauen ihre Kacheln aus ANHAENGER + ANH_ZIEL.
  // Neue Ziele nur hier eintragen – dann erscheinen sie in beiden Anhängern.
  // Je Ziel: ico, name, info (Tooltip), wohin (für Texte), kurz(p, box) = Kurztext, wenn erlaubt, sperre(p, box, istFohlen) = Grund oder "",
  // aus(p, box, istFohlen) = ausführen (ohne Rückfrage), bald = noch nicht verfügbar, gruppe = führt zu einer Unterebene, einzeln = nur einzeln (Verkaufen)
  const ANHAENGER = { start: ["klinik", "aufzucht", "ausbildung", "turnier", "umzug", "abgeben"], klinik: ["stationaer", "kastration"], abgeben: ["verschenken", "verkaufen", "gnadenhof"] };
  const anhGrund = (p, b, mitAngebot = true) => b.tot ? "verstorben" : p.klinik ? "in der Klinik" : p.turnier ? "auf dem Turnier" : mitAngebot && angebotVon(p) ? "steht zum Verkauf" : "";

      aus: (p, b, f) => umziehen(p, b, umzugHof || andereHoefe()[0], f) },

    abgeben: { ico: "👋", name: "Abgeben", info: "Pferd abgeben", gruppe: true, kurz: () => "verkaufen, Gnadenhof" },
    turnier: { ico: "🏆", name: "Turnier", info: "Turnierkalender: Pferde für Turniere nennen", einzeln: true, hmKurz: "Kalender, Nennen",

    ausbildung: { ico: "🎓", name: "Ausbildungs\u00adstall", info: "Profis bilden das Pferd aus – es kommt schneller voran", wohin: "in den Ausbildungsstall", wo: "im Ausbildungsstall",
      beschreibung: "Pferde ab 3 Jahren", kosten: () => `${fmt(KOSTEN.ausbildung)} pro Tag und Pferd`,
      sperre: (p, b) => anhGrund(p, b) || (spiel.geld < 0 ? "Konto im Minus" : "") || (b.fohlen ? "mit Fohlen bei Fuß" : alterJZ(p) < AUSBILDUNGSALTER ? "ab 3 Jahren" : ""),
      kurz: () => `${fmt(KOSTEN.ausbildung)} / Tag`, aus: (p, b) => { fahrtStress(p, "ausbildung"); wegbringen(p, "ausbildung", b, false); } },
    stationaer: { ico: "🛏️", name: "Stationär behandeln", info: "Bleibt in der Klinik, bis die Gesundheit mindestens 75 % beträgt – erholt sich doppelt so schnell", wohin: "in die Klinik", wo: "in der Klinik",
      beschreibung: "Pferde unter 75 % Gesundheit – bleiben bis 75 %, Rechnung danach", kosten: () => `${fmt(KOSTEN.klinik)} pro Tag und Pferd`,

      kurz: () => `${fmt(KOSTEN.klinik)} / Tag`, aus: p => { fahrtStress(p, "klinik"); p.klinik = { seit: spiel.tag }; delete p.weide; spiel.angebote = (spiel.angebote || []).filter(a => a.id !== p.id); } },
    kastration: { ico: "✂️", name: "Hengst kastrieren", info: "Kastration: 2 Tage Klinik, danach ist er ein Wallach", wohin: "zur Kastration in die Klinik", wo: "in der Klinik",
      beschreibung: "Hengste ab 1 Jahr – 2 Tage Klinik, danach Wallach", kosten: () => `${fmt(KOSTEN.kastration)} je Hengst inklusive 2 Tage Klinik`,
      sperre: (p, b) => p.geschlecht !== "Hengst" ? "nur Hengste" : anhGrund(p, b) || (alterJZ(p) < KASTRATION_AB ? "ab 1 Jahr" : ""),
      kurz: () => fmt(KOSTEN.kastration), aus: p => { fahrtStress(p, "klinik"); p.klinik = { seit: spiel.tag, op: "kastration", bis: spiel.tag + 2 }; delete p.weide; spiel.angebote = (spiel.angebote || []).filter(a => a.id !== p.id); } },
    verkaufen: { ico: "💰", name: "Verkaufen", info: "Auf dem Pferdemarkt verkaufen", einzeln: true,
      sperre: (p, b) => angebotVon(p) ? "" : (anhGrund(p, b) || abgabeSperre(p, b, true)),
      kurz: (p, b) => { const a = angebotVon(p); return a ? (a.art === "auktion" ? "in der Auktion" : "wird angeboten") : b.fohlen ? "mit Fohlen bei Fuß" : "Festpreis oder Auktion"; } },
    gnadenhof: { ico: "🌳", name: "Gnaden\u00adhof", info: "Senioren verbringen ihren Lebensabend auf dem Gnadenhof", wohin: "auf den Gnadenhof", wo: "auf dem Gnadenhof",

      sperre: (p, b) => anhGrund(p, b) || abgabeSperre(p, b) || (istSenior(p) ? "" : "nur Senioren (ab 20 J.)"),
      kurz: p => `${fmt(Math.round(marktwert(p) / 2 / 50) * 50)} sofort`, aus: (p, b) => aufGnadenhof(p, b) } };
  // geeignete Pferde je Ziel (für die Mehrfachauswahl): { key, p, box, fohlen }
  function anhKandidaten(ziel) {
    const Z = ANH_ZIEL[ziel], out = []; if (!Z || !Z.sperre) return out;
    spiel.boxen.forEach(b => {
      if (b.pferd && !Z.sperre(b.pferd, b)) out.push({ key: "p:" + b.pferd.id, p: b.pferd, box: b });
      if (ziel === "aufzucht" && b.fohlen && !Z.sperre(b.fohlen, b, true)) out.push({ key: "f:" + b.fohlen.id, p: b.fohlen, box: b, fohlen: true });
    });
    return out;
  }
  // Kacheln einer Ebene – einzel = { p, box } (Box-Anhänger) oder null (Hauptmenü-Anhänger)
  function anhKacheln(ebene, einzel) {
    const zaehlen = id => { const Z = ANH_ZIEL[id]; return Z.bald ? 0 : Z.gruppe ? ANHAENGER[id].reduce((a, z) => a + zaehlen(z), 0) : anhKandidaten(id).length; };
    return ANHAENGER[ebene].map(id => {
      const Z = ANH_ZIEL[id]; let an, kurz;
      if (Z.bald) { an = false; kurz = Z.bald; }
      else if (einzel) { const sp = Z.gruppe ? "" : Z.sperre(einzel.p, einzel.box); an = !sp; kurz = sp || Z.kurz(einzel.p, einzel.box); }
      else { const n = zaehlen(id); an = n > 0;
        kurz = !n ? ((id === "aufzucht" || id === "ausbildung") && spiel.geld < 0 ? "Konto im Minus" : "kein Pferd passt") : Z.gruppe || Z.einzeln ? Z.kurz ? (Z.gruppe ? Z.kurz() : Z.hmKurz || "Festpreis oder Auktion") : "" : `${n} ${n === 1 ? "Pferd passt" : "Pferde passen"}`; }
      const attr = an ? `${einzel ? "data-ort" : "data-anhziel"}="${id}" role="button" tabindex="0"` : "";
      return `<div class="kachel ${an ? "klickbar" : "fehlt"}" ${attr} title="${Z.name.replace(/\u00ad/g, "")}: ${Z.info}"><span class="ico">${Z.ico}</span><b>${Z.name}</b><small>${kurz}</small></div>`;
    }).join("");

  // Hauptmenü-Anhänger: Zustand
  let anhZiel = null, anhAuswahl = new Set(), anhMeldung = "";
  // Verkaufen aus dem Anhänger: Pferd auswählen, Verkauf einstellen – danach zurück zum Anhänger („Abgeben“)

    const zurueck = () => { anhZiel = "abgeben"; zeigeAnhaenger(); };

    dialog(`<h3>💰 Welches Pferd verkaufen?</h3><div class="paar-liste">${liste.map(({ b, i }) => {
      const sp = angebotVon(b.pferd) ? "steht zum Verkauf" : abgabeSperre(b.pferd, b, true);

  // Posten eines Jahres nach Jahreszeit gruppiert (neueste zuerst); alte Buchungen ohne Jahreszeit landen unter „früher“
  function finanzSaisonGruppen(j, J) {
    const FS = (spiel.finanzSaison || {})[j] || {}, gruppen = [], rest = {};
    [3, 2, 1, 0].forEach(s => { const P = FS[s]; if (P && Object.keys(P).length) gruppen.push([`${JZ[s][1]} ${JZ[s][0]} ${j}`, P]); });
    Object.entries(J).forEach(([k, e]) => { let ein = e.ein, aus = e.aus, n = e.n;
      Object.values(FS).forEach(P => { if (P[k]) { ein -= P[k].ein; aus -= P[k].aus; n -= P[k].n; } });
      if (ein > 0.005 || aus > 0.005) rest[k] = { ein: Math.max(0, ein), aus: Math.max(0, aus), n: Math.max(1, n) }; });
    if (Object.keys(rest).length) gruppen.push([gruppen.length ? `📁 früher in ${j} (ohne Jahreszeit)` : `📁 ${j}`, rest]);
    return gruppen;
  }
  // ---------- Enzyklopädie (Adminmodus): Vererbung ----------

        ["Leopard Lp/Lp", "Nachtblindheit (CSNB) – nicht tödlich, Folgen kommen später.", RASSEN.filter(r => (RASSE_GENE[r.id] || {}).Lp).map(r => r.name).join(", ") || "– (noch keine Tiger-Rasse im Spiel)"]])}
      <p><b>Versteckte Overo-Träger:</b> Wie viel Weiß ein Overo zeigt, ist ein versteckter, vererbbarer Wert („Overo: Weißanteil“). Unter 20 % sieht man fast nichts – das Pferd wirkt einfarbig, trägt das Gen aber. Erkennen kann man es nur mit dem Fellfarben- oder Erbkrankheiten-Test; nur dann kommt beim Verpaaren die Warnung.</p>
      <h3>🐎 Gangpferde-Gen (DMRT3)</h3>
      <p>C/C: kein Tölt, kein Pass · A/C: Tölt (Viergänger) · A/A: Tölt und Pass (Fünfgänger). Die Noten für Tölt und Pass werden wie alle Gangnoten vererbt – vorhanden sind sie aber nur mit dem passenden Gen. Häufigkeit des A-Allels: ${Object.entries(DMRT3).map(([r, f]) => `${rasseById(r).name} ${Math.round(f * 100)} %`).join(", ")}, sonst 0 %. Testbar im Labor (Gangpferde-Test).</p>

      <p><b>Sommer- und Winterrappen:</b> Winterrappen sind nur im Winterfell tiefschwarz, im Sommer bleicht die Sonne das Fell rostbraun aus (Herbst: halb). Sommerrappen bleiben das ganze Jahr schwarz. Das ist ein versteckter, vererbbarer Wert („Rappe: bleicht im Sommer aus“); die Genetik dahinter ist in echt noch nicht geklärt, es gibt keinen Labortest. In den Daten steht „Rappe, Winterrappe“, im Abstammungsschein nur „Rappe“. Nach einem Gentest steht das sichere Ergebnis da.</p>
      <p><b>Fellwechsel-Hinweis:</b> Ändert sich das Fell eines Pferdes durch die Jahreszeit sichtbar (Sommerfell, Fellwechsel im Herbst, Winterfell), zeigt der Stall beim ersten Anblick eine kleine Sprechblase über dem Pferd (den Tag über) – aber nur beim ersten Fellwechsel, den du bei diesem Pferd erlebst, egal wie alt es ist. Danach nicht mehr. Sommerrappen und Schimmel wechseln nicht sichtbar – bei ihnen kommt kein Hinweis.</p>
      <h3>🛒 Herkunft der Pferde ohne Eltern im Spiel</h3>

      <p><b>Rotschimmel / Roan</b> ist etwas anderes: unveränderliche Schimmel, die schon mit weißen Stichelhaaren geboren werden und nicht aufhellen.</p>

      <p class="hinweis">Nur im Adminmodus sichtbar: Berechnungen zum Nachschlagen.</p>
      <h3>🌱 Wachstum</h3>
      ${verTab(["Alter", "Größe (vom Endmaß)"], [["Geburt", "60 %"], ["6 Monate", "76,8 %"], ["1 Jahr", "87,4 %"], ["2 Jahre", "94,7 %"], ["3 Jahre", "98,9 %"], ["ab 4 Jahren", "100 %"]])}
      <h3>🎓 Ausbildung</h3>
      <p>Unausgebildete Pferde stehen auf Klasse E mit 0 %. Ausbildung entsteht im Ausbildungsstall (ab 3 Jahren, ${fmt(KOSTEN.ausbildung)}/Tag) oder durch Training daheim. Takt → Losgelassenheit → Anlehnung → Schwung → Geraderichtung → Versammlung: jede Stufe wird einzeln gespeichert, steigt erst, wenn die vorige 20 % erreicht hat, und kann sie nicht überholen (Grenze = (Stufe davor − 20) / 80 × 100). <b>Schubkraft</b> = (Kraft + Gangwerk-Schnitt × 10) / 2 → Schwung höchstens Schubkraft + 10. <b>Tragkraft</b> = Kraft × (0,55 + 0,5 × Rassenfaktor Dressur) → Geraderichtung und Versammlung höchstens Tragkraft + 10. Alles höchstens 97 %. Phasen: Gewöhnung (Stufe 1–3), Schubkraft (2–5), Tragkraft (4–6).</p>
      <p><b>Ausbildungsstall</b> je Tag und Stufe i (0–5): 0,9 × Lernfaktor × Wohlbefinden-Faktor × (1,12 − 0,13·i) × Dressurfaktor^(i/4), tragend ×0,5; dazu Gehorsam +0,5, Konzentration +0,2, Kraft +0,25, Ausdauer/Koordination/Beweglichkeit +0,2 (× derselbe Faktor).</p>
      <h3>🏅 Disziplinen</h3>
      <p>Wert (0–100) = (0,65 × gewichtete Werte + 0,35 × Ausbildungsstand) × (1 + Charakter, höchstens ±10 %). Noten zählen × 10 (gezeigte Note inkl. Ausbildungsbonus), Gangwerk = Schnitt Schritt/Trab/Galopp. Bis 3 Jahre keine Klasse.</p>
      ${verTab(["Disziplin", "Anteile", "Ausbildungsstand", "Charakter"], Object.values(DISZ).map(D => [D.ico + " " + D.n, D.teile ? "Dressurteil 25 · Springteil 35 · Geländeteil 40 (Ausdauer, Zähigkeit, Koordination, Kraft je 25)" : Object.entries(D.w).map(([k, a]) => teilName(k) + " " + a).join(" · "),
        D.a === "dressur" ? "Schnitt Ausbildungsskala" : D.a === "vielseitigkeit" ? "0,25 Dressur + 0,35 Springen + 0,4 Gelände" : DISZ_NAME[D.a], D.chTxt + (D.nur ? " · nur mit " + (D.n === "Tölt" ? "Tölt" : "Pass") : "")]))}
      <p><b>Eigener Stand</b> (0–97, wie Skala: voll bis 60 %, dann langsamer): Springen ← Springgymnastik 1, Geländesprünge 0,4, Stangen 0,2 · Western ← Westernarbeit 1 · Gelände/Kondition ← Konditionstraining 0,6, Geländesprünge 0,8, Ausritt 0,3 (je × Lernfaktor, Wohlbefinden, Vorliebe … wie beim Training, aber ohne den Skala-Faktor 2,2 – Ziel bei täglichem Training: nach 1 Jahr E/A, 2 Jahren L, 3 Jahren M, etwa 5 Jahren S bzw. Open). Ausbildungsstall je Tag: Springen 0,4 × f, Gelände 0,15 × f. Alte und gekaufte Pferde starten mit Springen 0,4 × und Gelände 0,3 × Schnitt der Ausbildungsskala, Western 0.</p>
      <p><b>Stufen:</b> Dressur wie bisher (Klassen E–S aus der Ausbildungsskala). Springen und Vielseitigkeit E/A/L/M/S, Western (Reining, Pleasure, Trail) Einsteiger/Rookie/Novice/Intermediate/Open: Stufe braucht Ausbildungsstand ${STUFE_STAND.join("/")} % und Disziplin-Wert ${STUFE_WERT.join("/")}. Springhöhe ≈ 0,95 × Stockmaß, Klassen-Mindesthöhe ${SPRUNG_HOEHE.join("/")} cm. Rennsport, Tölt und Distanz: nach Leistung (${LEISTUNG.map(([a, n]) => n + " ab " + a).join(", ")}).</p>
      <p><b>Marktwert:</b> Leistungsanteil = 5.000 € × max(0, (beste Disziplin − 35) / 30) – unausgebildet ≈ 0, gut ausgebildet (65) = 1, Spitzenpferd (80) = 1,5. Ein Spezialist ist damit mehr wert als ein Allrounder.</p>
      <h3>🏘️ Hof-Ausbau (H1: Hofkauf und Kredit)</h3>
      <p><b>Neues Spiel:</b> Startmenü → Neues Spiel → Charakter (ohne Hofname) → Immobilien-Menü. Startkapital ${fmt(START_KAPITAL)}. Am Anfang nur kaufbar: Alter Pensionsstall ${fmt(20000)} (6 baufällige Boxen = Stufe 1, Reitplatz, Gelände, 2 ha: Hofstelle mit Reitplatz + 1 ha Weide). Eigenanteil ${fmt(10000)}, Kredit ${fmt(10000)} → ${fmt(5000)} bleiben. Hofname wird beim Kauf eingegeben. Start immer als Pensionsstall (<code>spiel.stallarten = ["pension"]</code>, <code>spiel.hof</code>). Alte Spielstände (ohne <code>spiel.hofAusbau</code>) lassen sich nicht weiterspielen.</p>
      <p><b>Weitere Immobilien</b> (ausgegraut, Kauf ab H2): ${IMMOBILIEN.filter(I => !I.start).map(I => `${I.n} ${fmt(I.preis)}`).join(" · ")}. Frei, wenn der erste Kredit zur Hälfte getilgt ist und die Hälfte des Kaufpreises auf dem Hofkonto liegt.</p>
      <p><b>Kredit</b> (Hausbank): ${prozent(KREDIT.zins)} Zinsen im Jahr, Rate jede Jahreszeit (Annuität): Rate = Summe × q ÷ (1 − (1 + q)<sup>−n</sup>) mit q = Zins ÷ 4, n = Anzahl Raten. Hofkredit ${fmt(10000)}, ${KREDIT.jz} Raten → ${fmt(kreditRate(10000, KREDIT.zins, KREDIT.jz))}. Je Rate: Zinsen = Restschuld × q, Rest tilgt. Abbuchung automatisch zu Beginn jeder Jahreszeit (erste Rate in der Jahreszeit nach der Aufnahme), offene Raten zuerst. Reicht das Geld nicht: Mahnung + Mahngebühr (10 %, mind. 20 €) je verpasster Rate, bezahlen im Brief oder Finanzen → Bank. ${KREDIT.verpasst} offene Raten → Zwangsversteigerung, Spiel verloren, Spielstand gelöscht.</p>
      <p><b>Weitere Kredite</b> (Finanzen → Bank): bis ${prozent(KREDIT.beleihung)} des Immobilienwerts minus Restschuld (Start: 16.000 € − 10.000 € = 6.000 €), in 1.000-€-Schritten, Laufzeit ${KREDIT.laufzeiten.map(n => n / 4).join(" / ")} Jahre, gleicher Zins. Nicht, solange eine Rate offen ist. Finanzen-Posten: Hofkauf, Kredit (Auszahlung), Kredit: Zinsen, Kredit: Tilgung, Kredit: Mahngebühr.</p>
      <h3>🏘️ Hof-Ausbau (H2: mehrere Höfe, Land, Hofplan)</h3>
      <p><b>Bis zu ${MAX_HOEFE} Höfe</b>, jeder mit eigener Kasse, eigenen Boxen, Anlagen, Mitarbeitern, Futterkammer, Lager, Rechnungen, Krediten und Verkaufsanzeigen (<code>HOF_FELDER</code>). Der aktive Hof liegt in <code>spiel</code>, die anderen in <code>spiel.hoefe</code>; Reihenfolge <code>spiel.hofReihe</code>. Jede Nacht laufen alle Höfe (<code>jedenHof</code>): Versorgung, Training, Hufe, Ansteckung, Befunde, Rechnungen, Kredit, Pacht, Geburten, Gehälter, Mitarbeiter, Turnierpferde. Nur einmal: Markt/Auktion, Labor, Blutbild, Tierschutz-Klinik, externer Gnadenhof, Turnierkalender. Wer einen Hof nicht versorgt (selbst oder Mitarbeiter), hat dort hungrige Pferde.</p>
      <p><b>Makler</b> (Immobilien-Menü, wechselt einmal im Jahr): 1 leeres Grundstück + 3 fertige Höfe mit zufälliger Stufe (50 % Stufe 1, 35 % Stufe 2, 15 % Stufe 3). Preis = Land ${fmt(LAND_PREIS)}/ha + Hofstelle ${fmt(MAKLER_PREIS.hofstelle)} + Boxen je ${MAKLER_PREIS.box.slice(1).map(fmt).join(" / ")} (Stufe 1/2/3) + Reitplatz ${MAKLER_PREIS.reitplatz.slice(1).map(fmt).join(" / ")} + Reithalle ${MAKLER_PREIS.reithalle.slice(1).map(fmt).join(" / ")}, ±10 %. Kaufbar, wenn der erste Kredit zur Hälfte getilgt ist und die Hälfte des Preises in der Kasse des aktiven Hofs liegt. Eigenanteil ½ aus dem aktiven Hof, Rest Kredit des neuen Hofs (${prozent(KREDIT.zins)}, ${KREDIT.jz / 4} Jahre). Startgeld für den neuen Hof frei wählbar (500-€-Schritte) – sonst fließt kein Geld zwischen den Höfen. Neue Höfe starten als Pensionsstall (Stallart wählbar ab H7).</p>
      <p><b>Land:</b> kaufen ${fmt(LAND_PREIS)}/ha (Hofwert steigt), pachten ${fmt(PACHT_PREIS)} je ha und Jahreszeit (Abbuchung zu Beginn der Jahreszeit, „Pacht“), Pacht jederzeit kündbar. Neues Land = freies Grünland (Weide erst durch Einzäunen, H3). Hofplan: 1 Kachel = 1 ha (Hofstelle, Weide, frei, Pacht).</p>
      <p><b>Umzug:</b> Pferdeanhänger → Eigener Hof (beide Anhänger), Fohlen bei Fuß ziehen mit, nicht in Quarantäne, Zielhof braucht freie Boxen. Stress wie beim Fremden („neuer Stall“). <b>Zwangsversteigerung</b> eines von mehreren Höfen: nur dieser Hof ist weg, das Spiel geht weiter; beim letzten Hof ist das Spiel verloren. <b>Sondertilgung</b> (Finanzen → Bank): ab 100 €, ohne Gebühr, Rate bleibt, Laufzeit wird kürzer; nicht bei offener Rate.</p>
      <h3>🏗️ Hof-Ausbau (H3: Bauen, Stufen, Verfall)</h3>
      <p><b>Bauen</b> (Hofverwaltung → Hof → Bauen, Stufe 1 / 2 / 3): ${BAU_REIHE.filter(k => !BAUTEN[k].nur).map(k => { const B = BAUTEN[k]; return `${B.n.replace(/\u00ad/g, "")} ${B.fest ? fmt(B.fest) : B.preis.map(fmt).join(" / ")}${B.jeHa ? " je ha" : ""}${B.anbau ? ` (Anbau ${B.anbauBoxen} Boxen ${B.anbau.map(fmt).join(" / ")}, je 2 Boxen mehr ${B.paar.map(fmt).join(" / ")})` : ""}`; }).join(" · ")}. Rennbahn und Aufzucht-Offenstall kommen mit den Stallarten (H7). + / − in der Boxenübersicht gibt es nicht mehr.</p>
      <p><b>Bauzeit</b> (Standardtempo, je nach Tempo anteilig): kurz 2–3 Tage (Roundpen, Trail, Weide einzäunen, Sandpaddock, Waschplatz), ½ Jahreszeit (Paddockboxen, Sattelkammer, Abfohlbox), 1 Jahreszeit (Stall und Anbau, Reitplatz, Lager, Quarantänestall), Reithalle 2–3 Jahreszeiten. Außenarbeiten (Reitplatz, Roundpen, Trail, Weide, Sandpaddock) ruhen im Winter. Bezahlt wird beim Auftrag; der Hofwert steigt um den Baupreis. Heudampfer nur mit Futterlager, sofort. Lager: Futterkammer ${LAGER_START.toLocaleString("de-DE")} kg + ${BAUTEN.lager.platz.map(x => x.toLocaleString("de-DE")).join(" / ")} kg.</p>
      <p><b>Umbau</b> eine Stufe höher: Preisunterschied + ${prozent(UMBAU_AUFSCHLAG)}, halbe Bauzeit, je Abschnitt (Erstbau und jeder Anbau einzeln); die Boxen müssen leer sein und sind gesperrt. <b>Unterhalt</b> ${prozent(UNTERHALT)} des Baupreises je Jahreszeit. <b>Verfall</b> je Jahreszeit Stufe 1/2/3: −${VERFALL.slice(1).join(" / −")} Zustand; Warnbrief unter 40 %. <b>Reparatur:</b> Handwerker sofort auf 100 %, je 10 Punkte 2 % des Baupreises; Hofhelfer (${fmt(MA_TYP.hofhelfer.gehalt)}/Jz) +${HOFHELFER_REPARATUR} Punkte je Arbeitstag am schlechtesten Gebäude.</p>
      <p><b>Wirkung der Stufe:</b> Wohlbefinden je Nacht in der Box: Stufe 1 −0,5, Stufe 3 +0,5, Zustand unter 40 % −0,5, Paddockbox +0,5. Verletzungsrisiko in der Box × 1,3 / 1 / 0,8, Zustand unter 70 % × 1,1, unter 40 % × 1,3. Mitarbeiter-Zufriedenheit je Jahreszeit: Ø Stufe unter 1,5 −3, ab 2,5 +3, Ø Zustand unter 50 % −3. Quarantänestall: Pferde dort stecken niemanden an und werden nicht angesteckt. Pensionspreis nach Stufe kommt mit H5.</p>
      <p><b>Zentrales Konto</b> (Immobilien → Verwaltung): Überweisungen von jedem Hof und an jeden Hof (Dome, v224), Eigenanteil neuer Höfe kommt von dort (neue Höfe starten mit 0 €). Briefe anderer Höfe: roter Umschlag links neben dem gelben, Post aller Höfe in der Verwaltung. Warnbrief, wenn auf einem anderen Hof Pferde nicht gefüttert oder gemistet wurden.</p>
      <h3>🌾 Fütterung (F1: Futterkammer)</h3>
      <p>Futterkammer: Hofverwaltung → Hof → Futterkammer und Futterhandel (Dome: Lieferung am nächsten Morgen; Warnbrief bei leerer Kammer nur, wenn ein Mitarbeiter oder das Turnier füttert – wer selbst füttert, sieht es sofort). Platz ${LAGER_START.toLocaleString("de-DE")} kg (Salzlecksteine zählen nicht), wird mit dem Hof-Ausbau größer. Startvorrat (neues Spiel und alte Spielstände): Heu für 14 Tage (10 kg je Pferd), 3 kg Mineralfutter, 1 Leckstein je Pferd. Gekauft wird sofort, bezahlt wird sofort (Finanzen: „Futter“).</p>
      ${verTab(["Sorte", "Energie MJ/kg", "Eiweiß %", "Rohfaser %", "Zucker/Stärke %", "Preis"], Object.values(FUTTER).map(Z => [Z.n, Z.e, Z.ei, Z.rf, Z.zs, Z.preis.toLocaleString("de-DE", { minimumFractionDigits: 2 }) + (Z.stueck ? " €/Stück" : " €/kg")]))}
      <p><b>Standardplan</b> (bis zu den eigenen Futterplänen in F2): Raufutter nach Energiebedarf (seit F3: 1,5–2,5 kg je 100 kg Körpergewicht) in dieser Reihenfolge: Heu, Heulage, staubiges Heu, Heucobs, Futterstroh; Mineralfutter 100 g (unter 300 kg 50 g); Fohlen bei Fuß + 1 kg Heu je 100 kg. Reicht das Raufutter nicht für die ganze Ration, bleibt die Krippe leer (Pferd hungrig) und es kommt ein Warnbrief; fehlt Mineralfutter, bekommt das Pferd keins. Weide: Gras statt Heu (außer Winter und letzter Herbsttag), dann kein Mineralfutter aus der Kammer. Stallbursche und Turniertag nehmen das Futter ebenfalls aus der Kammer. Salzleckstein: zu Beginn jeder Jahreszeit 1 je Box mit Pferd. Warnbrief, wenn Heu oder Mineralfutter nur noch 1–2 Tage reichen oder leer sind (einmal, bis nachgekauft).</p>
      <h3>📋 Fütterung (F2: Futterplan und Bedarf)</h3>
      <p><b>Futterplan</b> je Pferd (Box → Pferdepflege → Versorgung → Futterplan, oder Ausrüstung → Futter): Menge je Sorte am Tag, gleichmäßig auf 2 oder 3 Mahlzeiten verteilt (Schritte: Raufutter 0,5 kg, Kraftfutter 0,25 kg, Öl/Mineral 50 g). Ohne eigenen Plan: Standardplan (Heu nach Energiebedarf, 1,5–2,5 kg je 100 kg, Mineralfutter 100 g). Ein Klick auf die Krippe (bzw. der Stallbursche) füttert den ganzen Tagesplan aus der Futterkammer.</p>
      <p><b>Bedarf:</b> Energie Erhaltung = 0,52 MJ × Gewicht^0,75 (600 kg ≈ 63 MJ). Zuschläge: Arbeit leicht +25 % / mittel +50 % / schwer +100 % (Schnitt der Trainings- und Turnierenergie der letzten Tage: ab 10 / 35 / 60; Turniertag zählt 50), tragend in der letzten Jahreszeit +20 %, säugend +70 %, Jungpferd unter 3 J. +30 %, Winter auf der Weide +10 %; leichtfuttrig −15 % (${LEICHTFUTTRIG.map(r => rasseById(r).name).join(", ")}), schwerfuttrig +15 % (${SCHWERFUTTRIG.map(r => rasseById(r).name).join(", ")}). Eiweiß Ziel 10 % der Ration (Fohlen/Jungpferde unter 1 J. und säugende Stuten 14 %): zu wenig unter Ziel − 2, zu viel über Ziel + 4. Raufutter mindestens 1,5 kg je 100 kg. Stärke aus dem Kraftfutter höchstens 1 g je kg Gewicht pro Mahlzeit (Zucker im Heu zählt dabei nicht), Kraftfutter höchstens 0,3 kg je 100 kg pro Mahlzeit, Öl höchstens 1 g je kg am Tag. Mineralien gedeckt mit mind. 50 g Mineralfutter oder Salzleckstein + genug gutes Heu/Heulage. Energie: zu wenig unter 90 %, zu viel über 110 %. Weide (außer Winter/letzter Herbsttag): Gras ersetzt das Raufutter.</p>
      <p><b>Futterzustand (F3)</b>, versteckt 1–9 (1 abgemagert … 5 gut im Futter … 9 fettleibig), sichtbar über das Körperbild: 1–3 dünn, 4–6 normal (sportlich nach etwa 1 Jahr gutem, regelmäßigem Training: Muskel-Punkte je Trainingstag (mind. 15 Energie oder Turnier) +1, Ruhetage im Rhythmus (bis 2 Tage nach dem letzten Training) ±0, längere Pause −2 je Tag (Abbau doppelt so schnell); höchstens 4 × Tage je Jahreszeit, sichtbar ab ¾ davon), 7–9 dick. Täglich: gefütterte Energie &gt; 110 % des Bedarfs → +1 Tag, &lt; 90 % → −1 Tag, hungrig −2; eine Stufe nach ${fzSchwelle()} Tagen (je nach Spieltempo: 4 Tage/Jz → 4, 7 → 5, 10 → 6); Richtungswechsel zählt neu, passende Ration lässt den Zähler zurücklaufen. Weide deckt Frühling 115 % (junges Gras), Sommer 100 %, Herbst 90 %; im Winter und am letzten Herbsttag kein Gras – nur das zugefütterte Heu zählt. Gewicht ±3 % je Stufe von 5. Gewicht ist ein Zusammenspiel: Futter, Bewegung (Arbeit erhöht den Bedarf, Boxenruhe −10 %) und Veranlagung (versteckte Futterverwertung 0,85–1,15, vererbt als Mittel der Eltern ± 0,04 – der angezeigte Bedarf ist nur die Schätzung ohne diese Veranlagung). Standardplan: Heu nach Energiebedarf (6 MJ/kg), mind. 1,5 und höchstens 2,5 kg je 100 kg.<br>
      <b>Folgen:</b> Stufe 1–2: Gesundheit −1 und Wohlbefinden −2 je Nacht, Energie-Max ×0,8, Lernen ×0,85, Turnier ×0,9, Infekte (Erkältung, Husten, Influenza, Druse, Herpes, Hautpilz, Würmer) ×1,5. Stufe 8–9: Wohlbefinden −1, Energie-Max ×0,9, Lernen ×0,9, Turnier ×0,9, Arthrose ×1,5. Hufrehe ×1,5 (Stufe 7) bzw. ×2,5 (ab 8); Frühlingsweide bei leichtfuttrigen oder dicken Pferden ×2. Zu wenig Raufutter (&lt; 90 % des Minimums): Wohlbefinden −3 (Langeweile), Kolik ×2, Magengeschwür ×3 (sonst ×0,4). Zu viel Stärke/Kraftfutter je Mahlzeit: Kolik ×2, Hufrehe ×1,5, Magengeschwür ×2, „Hafer sticht“ am Folgetag (Lernen ×0,85, Turnier ×0,95). Eiweiß 3 Punkte unter Bedarf: Kraft −0,2 je Tag (über 5); 6 Punkte drüber: Gesundheit −0,5 (Leber/Nieren). Mineralien fehlen ab 5 Tagen: Wohlbefinden −1 (stumpfes Fell), Hornspalt ×1,5. Unter 3 Jahren (auch Fohlen bei Fuß über die Mutter): ab 10 Mangeltagen (Eiweiß/Mineralien) OCD-Risiko ×2.<br>
      <b>Magengeschwür:</b> Befund (Bereich Futter), Grundrisiko klein, Wohlbefinden unter 50 ×1,5; Behandlung Magenschutz (Omeprazol, Rezept, 35 €).</p>
      <p><b>Atemwege, Leckerli, Umstellung (F4):</b> Versteckte Veranlagung „Empfindliche Atemwege“ (0–1, vererbt wie die anderen Veranlagungen; empfindlich ab 0,2). Nur empfindliche Pferde reagieren auf staubiges Heu (ab 1 kg am Tag, nicht gewässert): Husten-Risiko ×4; Vorzeichen beim Besuch (ab 3 Staubtagen „prustet“, ab 1 Jahreszeit „hustet beim Heufressen“, ab 2 Jahreszeiten schwerer Atem); nach mehr als ${STAUB_ASTHMA_JZ} Jahreszeiten Staub (ohne Staub zählt der Zähler um ½ je Tag zurück) jeden Tag 5 % Chance auf <b>Pferdeasthma</b> (chronisch, mit weiterem Staub 5 % je Tag eine Stufe schlimmer bis „schwer“; Behandlung Kortison, Hustensaft). Heu wässern (Haken im Futterplan; kostet Zeit – zählt beim Stallburschen wie 1½ Boxen, mit Heudampfer aus dem Hof-Ausbau nicht) oder Heulage beseitigt den Staub.<br>
      <b>Anweiden:</b> Kommt ein Pferd nach mehr als einer Jahreszeit ohne Weide wieder raus (nicht im Winter), wird es ${anweidenTage()} Tage angeweidet: stundenweise draußen, dazu Heu (wie im Winter); Kolik und Hufrehe ×1,3 in dieser Zeit.<br>
      <b>Leckerli</b> (Box → Pferdepflege → Versorgung): Möhre/Apfel 100 g, Leckerli 10 g aus der Futterkammer; bis 3 am Tag je Vertrauen +0,3 und Wohlbefinden +0,5. An 5 Tagen mehr als 3 → „bettelt und schnappt“ (Brief), dann gibt es kein Vertrauen mehr dafür; nach 14 Tagen ohne zu viele Leckerli legt es sich. Zucker und Energie der Leckerli zählen im Futterzustand mit.<br>
      <b>Futterumstellung:</b> Ein geänderter Futterplan (ab 1 kg Raufutter oder 250 g Kraftfutter Unterschied) wird über 3 Tage eingeführt: Tag 1 ⅓, Tag 2 ⅔, Tag 3 ganz neu. „Sofort umstellen“ (mit Warnung) → Kolik ×2 für 2 Tage.</p>
      <p><b>Futterexperte (F5):</b> extern auf Termin (Hofverwaltung → Mitarbeiter → Futterberatung oder Futterplan → Futterexperte): kommt am nächsten Morgen, ${fmt(FUTTER_BERATUNG)} je Pferd plus ${fmt(FUTTER_ANFAHRT)} Anfahrt, Rechnung per Brief (gebucht unter „Futter“). Fest angestellt erst im großen Stall (ab 20 Boxen), Gehalt ${fmt(MA_TYP.futterexperte.gehalt)} je Jahreszeit: berät kostenlos sofort und prüft zu Beginn jeder Jahreszeit alle Pferde ohne eigenen Plan und alle mit Haken „berechnet den Plan jede Jahreszeit neu“ (wird bei eigener Änderung abgehakt, kann wieder gesetzt werden). Er rechnet: Ziel-Energie = Bedarf (Stufe 7–9 ×0,85, Stufe 1–3 ×1,15); Raufutter nach Energie 1,5–2 kg je 100 kg (Heulage bei Husten/Asthma); zum Abnehmen 1,5 kg je 100 kg Idealgewicht, davon 25 % Stroh; Rest über Hafer (bis 0,3 kg je 100 kg und Mahlzeit, sonst 3 Mahlzeiten) bzw. ohne Stärke über Öl und Luzerne (Rehe, PSSM, Magen, Schonkost, dick); Luzerne bei Eiweißmangel; Mineral 100 g (50 g unter 300 kg). Der neue Plan wird über 3 Tage eingeführt. Der Spieler lernt mit (Wissen Fütterung +0,5 je Pferd).<br>
      <b>Spezialfutter</b> (nur über den Experten; er bringt einen Vorrat für ${SPEZIAL_VORRAT} Tage mit, danach im Futterhandel): ${Object.values(SPEZIAL).map(S => `${S.n} (${S.e} MJ, ${S.ei} % Eiweiß, ${S.zs} % Zucker/Stärke, ${S.preis.toLocaleString("de-DE", { minimumFractionDigits: 2 })} €/kg)`).join(" · ")}. Wahl: Kolik in den letzten 7 Tagen → Schonkost; Hufrehe/Cushing → Strukturfutter; PSSM → Muskelfutter; Magengeschwür → Magenschonfutter; Stufe 1–2 oder ≥ 2 Befunde → Aufbaufutter; ab 20 Jahren → Seniorenfutter. Wirkung ab 250 g am Tag: Kolik ×0,6 (Schonkost) bzw. ×0,8 (Senior), Hufrehe/Cushing ×0,5, Magengeschwür ×0,4, Infekte ×0,7 (Aufbau); passende Befunde werden mit 10 % je Tag eine Stufe besser. Senioren ab 20 Jahren verwerten ohne Seniorenfutter oder Heucobs (ab 1 kg) nur 90 % der Energie.</p>
      <h3>🏆 Turniere</h3>
      <p><b>Ablauf:</b> Pferdeanhänger (Box oder Hauptmenü) → Turnier → Turnierkalender. Nennen bis spätestens am Tag vorher (Nenngeld sofort, beim Zurückziehen keine Erstattung). Am Turniertag morgens fährt das Pferd los (von der Weide wird es vorher geholt; krank/schwach → nicht gestartet, Nenngeld verfällt), ist den ganzen Tag weg (kein Training, Box sauber, unterwegs gefüttert). In der Nacht wird gerechnet, der Brief kommt am nächsten Tag. Ab 4 Jahren, nicht mit Fohlen bei Fuß, tragend keine Sprünge und in der letzten Jahreszeit vor der Geburt gar nicht; höchstens 2 Prüfungen je Turnier in benachbarten Klassen, nur ein Turnier pro Tag.</p>
      <p><b>Kalender</b> je Jahreszeit (im Winter Hallenturniere ohne Vielseitigkeit): Hofturnier (Wettbewerbe nach WBO: Dressur, Stilspringen, Westernreiter, Gelassenheitsprüfung – nur Schleifen) · Regionales Turnier (Dressur und Springen E–L, Vielseitigkeit E–A, Aufbauprüfung Kl. A 4–6 J.) · Westernturnier (Reining, Pleasure, Trail Einsteiger–Novice) · Großes Turnier (A–S, Vielseitigkeit A–M, Aufbauprüfung Kl. L 5–6 J.) · zu 50 % Großes Westernturnier (Novice–Open). 8–22 Starter je Prüfung.</p>
      <p><b>Geld:</b> Nenngeld WB 10, E 15, A 20, L 25, M 35, S 50 € (Großes Turnier ×1,5). Preisgeld gesamt E 0, A 120, L 250, M 500, S 1.200 € (Großes Turnier ×2, Aufbauprüfung ×0,8), verteilt auf die Platzierten (25/18/14/11/9/8/8/7 %). Platziert ist das beste Viertel (mind. 3).</p>
      <p><b>Ergebnis:</b> Leistung = Disziplin-Wert × Tagesform × Turnierstress × Reiter × Zufall (Streuung etwa ±8 %). Tagesform = (0,85 + 0,15 × Wohlbefinden) × (0,8 + 0,2 × Gesundheit/85) × 0,85, falls die Energie nicht reicht (Energie je Start: Dressur 30, Springen 35, Vielseitigkeit 45, Reining 32, Pleasure/Trail 25, Gelassenheit 12; dann auch Übertraining wie beim Training). Turnierstress = 1 − 0,08 × e(nervös oder scheu) × (1 − Erfahrung, voll nach 8 Starts) + 0,03 × Vorliebe „Turnier“. Reiter = 0,95 + 0,015 × (7 − LK). Start über dem eigenen Ausbildungsstand (Klasse in der Akte) in Dressur, Springen, Vielseitigkeit, Western: × 0,85 je fehlender Klasse (kennt die Lektionen noch nicht). Konkurrenz: Feldniveau = Stufen-Wert (${STUFE_WERT.join("/")}) + 3 regional / + 6 groß (Western zusätzlich + 8, weil Western-Werte fast nur aus trainierbaren Werten bestehen), Wettbewerbe 32, Gelassenheit 48, Streuung der Konkurrenz etwa ±7. Anzeige: Dressur Wertnote (ab L Prozent), Springen Fehler und Zeit, Vielseitigkeit Minuspunkte, Western Score (70 = Durchschnitt). Gelassenheitsprüfung = 0,35 × Vertrauen + 0,2 × Gehorsam + 0,45 × (50 + 40 × (e gelassen + e mutig − e nervös − e scheu)) + bis 5 Erfahrung.</p>
      <p><b>Rennen, Distanz, Gangpferde</b> (Dome: wie in echt): Renntag (nicht im Winter) – Galopprennen nur reinrassige Vollblüter ab 2 J. (Ausgleich IV–I, Listenrennen; Nenngeld 50/80/100/150/300 € + Jockey-Reitgeld ${fmt(REITGELD)}, Preisgeld 2.000/3.500/5.000/8.000/15.000 €, Feld 50/58/66/73/82), Araberrennen Kl. C–A für reinrassige Araber und Achal-Tekkiner ab 3 J. (40/60/90 € + Jockey, Preisgeld 800/1.500/3.000 €, Feld 46/55/64). Trabrennen erst mit der Rasse Traber. Distanzritt (nicht im Winter): Einführungsritt 30 km ab 5 J., Kurze 50 km ab 5 J., Mittlere 70 km ab 6 J., Lange 100 km ab 7 J. (Nenngeld 40/60/80/120 €, Preis nur Mittel 150, Lang 400 €, Feld 40/56/70/80, Energie 25 + 0,6 je km). Tierarzt: lahm (Lahmheit, Hufabszess, Hufrehe, Arthrose) → nicht zugelassen; Puls = 48 + 0,12 × (100 − Ausdauer) + 0,06 × (100 − Regeneration) + km/100 × (1 − Ausdauer/100) × 12 + 8 (müde) + 0–5, über 64 → ausgeschieden; danach 3 % (müde 12 %) × (1,5 − Zähigkeit/100) nicht taktrein → ausgeschieden und Lahmheit Grad 1. Gangpferdeturnier (im Winter „Tölt auf Eis“ ohne Pass): Tölt Einsteiger/D/C/B/A für alle mit Tölt ab 4 J. (Preis B 150, A 300 €), Passrennen 250 m für alle mit Pass ab 5 J. (200 €, Feld 56; deutlich zu schwache Pferde springen manchmal in den Galopp – ungültig). Keine LK für Rennen, Distanz und Gangpferde. Im Kalender erscheinen nur Turniere, bei denen das Pferd grundsätzlich starten kann.</p>
      <p><b>Championate und International</b> (nur mit Qualifikation = Erfolge dieses Pferdes im letzten Jahr, also 4 Jahreszeiten): Landesmeisterschaft im Sommer (Dressur/Springen/Vielseitigkeit L und M, je 2 Platzierungen ab dieser Klasse, Preisgeld 1.000/2.000 €, Feld + 9) · Bundeschampionat im Herbst (Dressur- und Springpferde 5–6 J., 1× Platz 1–3 in einer Aufbauprüfung, 3.000 €) · Deutsche Meisterschaft im Herbst (Dressur und Springen S: 3 Platzierungen in S, 10.000 €, Feld + 12; Western Open: 3 Platzierungen ab Intermediate, 5.000 €) · Internationales Turnier im Frühling und Herbst (CDI Grand Prix, CSI Großer Preis: 1 Sieg in S, 25.000 €, Feld + 15, 20–40 Starter). Startrechte nach LK gelten weiter (außer Bundeschampionat). Sieger bekommen einen Titel (Landesmeister, Bundeschampion, Deutscher Meister) in der Akte. Erfolge zählen im Marktwert: Championat ×2,5, International ×4 (höchstens 40.000 €).</p>
      <p><b>Fohlenschau</b> (Etappe 6c): im Sommer (Hauptschau) und Herbst (Nachschau) beim Zuchtverband. Anmelden über die Mutter (Pferdeanhänger → Turnier; eine Stute mit Fohlen bei Fuß sieht nur die Fohlenschau), Nenngeld ${fmt(FS_NENNGELD)}, bis zum Vortag. Nur Fohlen bei Fuß, am Schautag noch nicht abgesetzt (jünger als 2 Jahreszeiten) und mindestens etwa 1 Monat alt (in der Geburts-Jahreszeit erst nach einem Drittel der Tage); jedes Fohlen nur einmal. Klassen: Stutfohlen und Hengstfohlen (reinrassig nach Zuchtbuch: nur die eigene Rasse plus erlaubte Veredler – Hannoveraner: Vollblut, Araber · Haflinger: Araber · Quarter: Vollblut; alle anderen Rassen geschlossen), offene Klasse für Mischlinge. Mutter und Fohlen fahren hin (Fahrtstress), Ergebnis am nächsten Tag per Brief.
        Noten in halben Noten, alle rassetypisch (am Zuchtziel der eigenen Rasse gemessen): Typ = 8,6 − (Ø Abweichung der Körper-Anlagen vom Rassenprofil)/5 − (100 − Rasseanteil)/25 · Körperbau = 7 + (Ø Konstitution/Kraft − Rassenschnitt)/6 · Schritt/Trab = 7 + 1,1 × (Note − Rassenschnitt) · Gesamteindruck = Ø der vier + 0,3 × (e mutig + ½ e temperamentvoll) − 0,5 × e nervös/scheu; jede Note ± 0,4 Zufall. Gesamtnote = Schnitt der fünf (eine Kommastelle). Feld: Schnitt 7,0, Streuung etwa ± 0,6. Prämienfohlen ab ${String(FS_PRAEMIE).replace(".", ",")}; Fohlenchampion = Klassensieger mit Prämie, besser als die Sieger der anderen Klassen (Ehrenpreis ${fmt(FS_CHAMPION_GELD)}).
        Marktwert × (1 + 0,35 × (Gesamtnote − 6,8) + 0,15 Prämie + 0,3 Champion), ab 4 Jahren nur ein Drittel davon; Mütter × (1 + 0,05 je Prämienfohlen, höchstens 5). Pferdemarkt: Fohlen der Fohlenauktion und Händlerpferde bis 3 J. sind zu 45 % schon vorgestellt (Mischlinge seltener). Note steht in der Akte (Daten) und im Abstammungsschein.<br>
        <b>Fohlenchampionat</b> am letzten Tag von Sommer und Herbst (die Schau liegt mind. 2 Tage davor): nur Prämienfohlen, jedes einmal, Nenngeld ${fmt(FSC_NENNGELD)}, 10–20 Starter je Klasse (Feld Schnitt 7,9 ± 0,35), Preisgeld ${fmt(FSC_PREIS)} je Klasse für das beste Viertel (mind. 3). Marktwert Sieger +25 %, platziert +10 % (ab 4 Jahren ein Drittel).<br>
        <b>Stallplaketten</b> (neben dem Boxschild, mit dem Pferd verbunden – wandern bei Boxwechsel, Absetzen und Kauf mit): P = Prämienfohlen, ★ = Fohlenchampion, Championat Platz 1 (Gold, C), 2 (Silber), 3 (Bronze). Neugeborene liegen 1 Tag (4 Tage je Jahreszeit), 2 Tage (7) bzw. 2–3 Tage (10; Kraft-Anlage ab 50 → 2).</p>
      <p><b>Reiter-LK</b> je Disziplin (Dressur, Springen, Vielseitigkeit, Western), Start LK 7: LK 7 → E · 6 → E, A · 5 → A, L · 4 → A–M · 3 bis 1 → A–S. Aufstieg: 7→6 eine Platzierung ab E · 6→5 drei ab A · 5→4 drei ab L · 4→3 drei ab M · 3→2 drei Siege ab M · 2→1 drei Siege in S (danach zählt es neu). Wettbewerbe, Gelassenheit und Aufbauprüfungen sind für jede LK offen.</p>
      <p><b>Reiter-LK im Training:</b> Trainierst du selbst, lernt das Pferd je LK-Stufe über 7 um 4 % mehr (LK 1: +24 %) – Longieren, Doppellonge, Dressurarbeit → Dressur-LK · Stangen, Springgymnastik → Springen · Geländesprünge, Konditionstraining → Vielseitigkeit · Westernarbeit → Western. Bereiter zählen ihr eigenes Wissen. Reiterprofil: Hofverwaltung → Reiter.</p>
      <p><b>Marktpferde und Deckhengste</b> mit Ausbildung (ab 4 J., Training über 20) haben schon Turniere hinter sich: (Alter − 3) × 1–3,5 Starts (höchstens 20) in ihrer besten Disziplin (Dressur, Springen, Reining, Trail), Klasse nach Disziplin-Wert, platziert mit 25 % + 3 % je Punkt über dem Feld (5–85 %), davon 35 % Siege. Die Erfolge stehen in der Akte („beim Vorbesitzer“) und heben Preis und Decktaxe (10 % des Marktwerts).</p>
      <p><b>Erfolge</b> (Akte → Ausbildung) erhöhen den Marktwert: Sieg ${ERFOLG_WERT.join("/")} € (E–S), Platzierung die Hälfte, Großes Turnier ×1,3, höchstens 15.000 €.</p>
      <h3>🏋️ Training daheim</h3>
      <p><b>Orte:</b> Spieler: Reitplatz und Gelände (Bodenarbeit, Freiarbeit, Longieren, Stangen auch auf dem Reitplatz). Roundpen und Reithalle kommen mit dem Hof-Ausbau (🛠️ Admin: alle offen). Reitplatz/Roundpen bei Regen, Schnee oder im Winter ×0,7. Reithalle wetterunabhängig, bei Regen/Schnee wählt der Bereiter sie automatisch; scheue/nervöse Pferde mögen sie oft nicht (×0,85).</p>
      ${verTab(["Übung", "Ort", "ab", "⚡", "Ausbildungsskala", "Werte"], Object.values(UEBUNG).map(U => [U.ico + " " + U.n.replace(/\u00ad/g, ""), ({ boden: "Roundpen/Platz/Halle", platz: "Platz/Halle", gelaende: "Gelände" })[U.wo], jzAlterTxt(U.ab).replace("Monaten", "Mon.").replace("Jahren", "J.").replace("Jahr", "J."), U.e,
        Object.entries(U.sk || {}).map(([i, x]) => AUSBILDUNG[i] + " " + String(x).replace(".", ",")).join(", ") || "–", Object.entries(U.w).map(([k, x]) => ((WERTE_KOERPER.concat(WERTE_KOPF).find(w => w.key === k) || {}).titel || k) + " " + String(x).replace(".", ",")).join(", ") + (U.gang ? ", Gangwerk +0,02" : "")]))}
      <p><b>Tempo (v208):</b> Skala × 2,2 (vorher 2,5), Ausbildungsstall × 2,2, Werte × 1,5, eigener Disziplin-Stand × 1, alles × 7 / Tage pro Jahreszeit. <b>Töltarbeit</b> (ab 4 J., nur mit Tölt) und <b>Passtraining</b> (ab 5 J., nur mit Pass) heben die gezeigte Tölt- bzw. Passnote um bis zu +1 (0,02 × Faktor je Einheit, in halben Noten).</p>
      <p><b>Zuwachs</b> je Übung = Grundwert × Lernfaktor (0,6–1,2) × Wohlbefinden-Faktor (0,5–1,2) × Vorliebe (1 + 0,25 × Vorliebe, 0,75–1,25) × Befund-Bremse × Trainer (du 1 · Bereiter 0,8 + 0,4 × Wissen Rücken/100) × Ort/Wetter. Müde (Energie reicht nicht) ×0,6 · Winter ohne Aufwärmen (erste Übung des Tages ist Reiten) ×0,8 · Dressurarbeit × (1 + 0,2·e sensibel) · Gelände und Sprünge × (1 + 0,15·e mutig − 0,25·e scheu). Charakter: Gehorsam/Konzentration × (1 + 0,4·e leistungsbereit − 0,3·e eigensinnig), Vertrauen × (1 + 0,5·e verschmust), Reaktionsfähigkeit × (1 − 0,4·e nervös). Gewöhnungsphase (Takt, Losgelassenheit, Anlehnung) × (0,8 + 0,2 × Vertrauen/100 + 0,2 × Gehorsam/100 + 0,15·(e ruhig + e gelassen) − 0,15·(e temperamentvoll + e nervös)).</p>
      <p><b>Sättigung:</b> voller Zuwachs bis 60 % der Grenze, darüber linear weniger bis 0 an der Grenze (× 2,5 × (1 − Wert/Grenze)). Grenze: Anlage × Altersfaktor (Vertrauen/Gehorsam 100, Skala siehe oben).</p>
      <p><b>Energie</b> (0–100): über Nacht + (45 + 0,45 × Regeneration) bis zur Höchstgrenze = 100 × Gesundheit-Faktor (ab 85 % 1, darunter linear bis 0,4 bei 50 %) × (0,6 + 0,4 × Wohlbefinden/100) × Krankheit (−0,1 je Befund-Grad, auch unbemerkte – „wirkt matt“, mind. 0,4). Sinkt die Grenze, sinkt die Energie sofort mit. Kosten: Grundwert × 0,85 (mag) / 1,2 (mag nicht) × 1,2 (die ersten 3 Male) × 1,2 (tragend). <b>Übertraining</b> (Energie reicht nicht, nach Rückfrage): Wohlbefinden −8, Gesundheit −3, 15 % × (1,5 − Zähigkeit/100) Lahmheit Grad 1. Winter ohne Aufwärmen: 4 % × (1,5 − Zähigkeit/100) Lahmheit. Eigensinnig: mehr als 60 Energie am Tag → Wohlbefinden −3·e. Jeder Trainingstag: Wohlbefinden +3 (+2·e temperamentvoll), zählt nicht als Boxtag; leistungsbereite Pferde vermissen Arbeit nach 2 freien Tagen (−2·e).</p>
      <p><b>Sperren:</b> Weide, Boxenruhe, Klinik, Gesundheit unter 50 %, bekannter unbehandelter Befund ab Grad 3, bekannte Lahmheit/Hufabszess/Hufrehe. Tragend: keine Sprünge, in der letzten Jahreszeit vor der Geburt kein Reiten. Quarantäne: nicht ins Gelände. Unbemerkte Huf-/Rückenprobleme fallen beim Training mit 50 % + 10 % × Grad auf.</p>
      <p><b>Hufschuhe im Gelände</b> (barhuf): Verschleiß 2 % je Übung; zu klein → 30 % Scheuerstelle (Verletzung Grad 1); zu groß → 12 % Stolpern, davon 25 % Lahmheit Grad 1.</p>
      <p><b>Gangwerk:</b> gezeigte Note = Veranlagung + Bonus in halben Noten: min(0,5; Stangenbonus + Skala-Schnitt/120) + 0,5 ab Skala-Schnitt 85 %. Stangenbonus +0,02 × Faktor je Stangenarbeit, höchstens 0,5. Marktwert und Ausdruck (Klassen) nutzen die gezeigte Note, vererbt wird die Veranlagung.</p>
      <p><b>Alter:</b> Wer in einer Jahreszeit an mindestens der Hälfte der Tage trainiert wurde, bekommt Fitness: fit = ½ × fit_alt + ½ × min(1, Trainingstage / (Tage pro Jahreszeit / 2)). Altersabbau × (1 − 0,3 × fit).</p>
      <p><b>Bereiter</b> (3 Pferde ab 3 Jahren, morgens): nach deinem Plan (Häkchen an den Übungen) oder „entscheidet selbst“: unter 3 Jahren Longieren/Bodenarbeit/Spaziergang; sonst Aufwärmen (Winter immer, sonst 50 %), eine Hauptübung (60 % Dressurarbeit, sonst zufällig Springen/Western/Doppellonge/Stangen), Ausritt als Belohnung. Ab Wissen Verhalten 30 lässt er Ungeliebtes meist weg (70 %). Er übertrainiert nie. Bemerkt Huf-/Rückenbefunde +25 % häufiger.</p>
      <h3>❤️ Gesundheit</h3>
      <p><b>Kastration</b> (Pferdeanhänger → Klinik, nur Hengste ab 1 Jahr): ${fmt(KOSTEN.kastration)} inklusive 2 Tage Klinik; liegt die Gesundheit unter 75 %, bleibt er länger (${fmt(KOSTEN.klinik)} je zusätzlichem Tag). Danach ist er im Steckbrief ein Wallach und kann nicht mehr decken. Der Abstammungsschein bleibt unverändert (Hengst).</p>
      <p><b>Rechnungen:</b> Klinik (bei der Entlassung), Aufzuchtstation und Ausbildungsstall (zu Beginn jeder Jahreszeit für die vergangene, mit Zwischenbericht; bei der Rückkehr ein kompletter Bericht mit Kostenübersicht und Rechnung über den Rest) schicken Rechnungen per Brief. Bezahlen geht direkt im Brief oder unter Finanzen. Zahlungsziel 2 Tage. Danach: Mahnung mit allen offenen Beträgen des Absenders + Mahngebühr (10 %, mind. 20 €), Frist 5 Tage – bei Aufzucht/Ausbildung wird der Aufenthalt sofort abgebrochen und die Pferde kommen zurück (ist keine Box frei, sobald eine frei wird). Wird auch die Mahnung nicht bezahlt, wird der Betrag + Versäumnisgebühr (20 %, mind. 50 €) abgebucht – das Konto darf dadurch ins Minus. Eine neue Rechnung desselben Absenders übernimmt alle offenen; die alten werden ungültig. Der Tierschutz holt wegen offener Rechnungen keine Pferde mehr.</p>
      <p><b>Wohlbefinden</b> (Reiter „Versorgung“, 0–100): Grundwerte pro Tag – Weide +15, Aufzuchtstation +10, Putzen +5 (Bürste und Kamm je einmal am Tag); ab dem 3. Tag am Stück in der Box −6, hungrig −8, Box nicht gemistet −5. Angezeigt wird der Wert minus 0,4 × Schmutz. <b>Wirkung:</b> Ausbildungs-/Lerntempo im Ausbildungsstall ×(0,5 + 0,7 × Wohlbefinden) – bei 70 % normal, bei 100 % ×1,2, bei 0 % ×0,5. Fruchtbarkeit: Chance, beim Decken tragend zu werden = 40 % + 55 % × Wohlbefinden (Stute; mit eigenem Hengst Durchschnitt beider) – bei 100 % 95 %, bei 50 % 67,5 %.</p>
      <p><b>Charakter → Wohlbefinden</b> (nur ausgeprägte Werte: über 70 „hoch“, unter 30 „tief“, Stärke e = 0 … 1, voll bei 97 bzw. 3):
        Temperament – Box-Abzug beginnt nach 2 + 2·e(ruhig) − e(temperamentvoll) Tagen (mind. 1), Abzug −6 × (1 + e temperamentvoll) × (1 − 0,5·e ruhig) × (1 + 0,5·e eigenständig); Weide +3·e temperamentvoll.
        Neugier – neugierig: in der Box zusätzlich −3·e Langeweile; verträumt: jeder Ortswechsel −3·e (mag Routine).
        Menschenbezug – verschmust: Putzen × (1 + e), mehr als einen Tag nicht geputzt −3·e pro Nacht; eigenständig: Putzen × (1 − 0,6·e), Weide +5·e.
        Mut / Nervenstärke – Fahrt im Pferdeanhänger −(14·e nervös + 6·e scheu) × (1 − 0,5·e gelassen), dazu Klinik oder Aufzuchtstation (fremde Herde) −(6·e nervös + 12·e scheu) × (1 − 0,5·e gelassen); auf der Weide pro Nacht mit fremden Herdenmitgliedern −6·max(e scheu, e nervös) × (1 − 0,5·e gelassen).
        Sensibilität – sensibel: Mist −5 × (1 + 0,5·e), Schmutz zieht × (1 + 0,5·e) ab; robust: Schmutz × (1 − 0,5·e).
        Arbeitswille – leistungsbereit vermisst Arbeit (kommt mit dem Training daheim).</p>
      <p><b>Spieltempo</b> – Tage pro Jahreszeit: 4 schnell, 7 Standard, 10 langsam (alte Spielstände wurden auf 7 umgestellt, Datum bleibt, mit Hinweisbrief). Auf das Tempo umgerechnet wird nur das Sozialverhalten; alles andere (Futter, Mist, Gesundheit, Wohlbefinden, Schmutz …) gilt pro Tag bzw. Nacht. Was in Jahreszeiten zählt (Tragzeit, Alter, Aufzucht, Ausbildung, Rechnungen der Ställe), braucht bei mehr Tagen entsprechend länger. Vorsorge-Termine in Jahreszeiten: Wurmkur 1, Impfung 2, Zahnkontrolle 4 („bald fällig“ ab ¼ Jahreszeit vorher); Hufschmied je nach Hufwachstum (siehe Hufe).</p>
      <p><b>Weide und Herde (Etappe 2b)</b> – Sozialverhalten pro Tag × 7 ÷ Tage pro Jahreszeit (gleich viel pro Jahreszeit, egal ob 4, 7 oder 10 Tage); Bedeckung und Streit sind feste Chancen pro Nacht:
        Heu auf der Weide nötig im Winter und am letzten Herbsttag (Knopf in der Weide-Ansicht, Stallbursche erledigt es mit) – sonst hungrig: Gesundheit −19 statt Weide-Plus, Wohlbefinden −8.
        Wohlbefinden auf der Weide: +15, im Winter +8, allein +6 (eigenständig bekommt bis +9 zurück; verschmust/scheu/nervös zusätzlich bis −4).
        <b>Ungeplante Bedeckung:</b> Hengst (ab 2 J.) und zuchtfähige Stute (3–20 J., nicht tragend) zusammen auf der Weide: pro Nacht 25 % (jede Stute einzeln), tragend mit 40 % + 55 % × Wohlbefinden (Schnitt beider). Fällt nach einer Jahreszeit auf (Brief vom Tierarzt) oder beim nächsten geplanten Decken. Warnung nur beim allerersten Zusammenstellen.
        <b>Sozialverhalten</b> (versteckt, 0–100, Start 20; Stammpferde ab 3 J. 40): steigt bis 3 Jahre – Aufzuchtstation +2/Tag, Weide mit mind. 2 anderen Jungpferden +1,5, mit weniger +0,5, Fohlen bei der Mutter +0,3.
        <b>Hengstverhalten:</b> Hengst ab 3 J. voll; Wallach, der nach dem 2. Lebensjahr kastriert wurde, zur Hälfte; früh kastriert gar nicht.
        <b>Streit</b> pro Nacht und Paar: fester Paarwert 0–12 % + 8 % × (1 − Sozialverhalten-Schnitt) + 5 % × max(temperamentvoll, eigensinnig) + 35 % × Hengstverhalten beider × (1 − 0,5 × Sozialverhalten) bei zwei Hengsten, +20 % wenn Stuten (ab 2 J.) auf der Weide sind (Kampf um die Stuten). Hengst und Stute streiten nicht. Streit: beide −10 Wohlbefinden, 20 % Verletzung (Hengstkampf um Stuten 35 %) (eines der beiden, Gesundheit −10 bis −25, Befund heilt nach 2 Jahreszeiten). Brief „Streit auf der Weide“.
        <b>Befund</b> (Ankerpunkt für Krankheiten/Lahmheit): steht unter Versorgung; Folgen außer Gesundheit kommen später.</p>
      <p><b>Vorlieben und Reaktionen (Etappe 3):</b> Jedes Pferd hat zu jedem Ziel eine versteckte Vorliebe −1 … +1 = Charakter-Anteil + Zufall (±0,55, fest je Pferd). Ab +0,4 „mag“, ab −0,4 „mag nicht“, sonst „egal“ – im Schnitt etwa 18 % mag, 68 % egal, 14 % mag nicht (Vorlieben sind etwas Besonderes). Wohlbefinden je Aktion nur einmal am Tag. Bei der Aktion: kurzer Reaktionstext, Wohlbefinden ±4 × Vorliebe (nur bei mag/mag nicht), danach gilt die Vorliebe als entdeckt (Knopf „Vorlieben“ unter Charakter). Pfleger und Stallbursche lösen die Wirkung aus, entdecken aber nichts. Später: Training ×(1 + 0,25 × Vorliebe).
        Ziele und Charakter-Anteil: ${Object.values(VORLIEBEN).map(z => z.titel).join(", ")}. Putzen: verschmust +, eigenständig −, sensibel − · Kämmen: sensibel −, temperamentvoll − · Füttern: temperamentvoll +, sensibel − · Weide: temperamentvoll +, eigenständig +, neugierig +, scheu −, nervös − · Zurück in die Box: ruhig +, verschmust +, temperamentvoll −, neugierig − · Verladen: mutig +, gelassen +, nervös −−, scheu − · Medizin: meist unbeliebt, sensibel −, nervös −, verschmust + · Mähne schneiden: sensibel −, nervös −, gelassen +.</p>
      <p><b>Herde:</b> Alle eigenen Pferde auf der Weide sind eine Herde. Nach ${HERDE_KENNEN} gemeinsamen Weidetagen kennen sich zwei Pferde (gilt dauerhaft). Bis dahin Eingewöhnung (siehe oben).</p>
      <p><b>Weide</b> (Ort → Weide, antippen = hin und zurück): Box bleibt frei und leer, kein Füttern und Misten nötig (Stallbursche lässt die Box aus, der Pferdepfleger putzt weiter). Gesundheit pro Tag: Frühling +10, Sommer +12, Herbst +7, Winter +5 (Box +8); bei 30 % oder weniger keine Erholung. Fohlen bei Fuß kommt mit. Schmutz wie in der Box (ohne Mist-Zuschlag).</p>
      <p><b>Schmutz:</b> Jede Nacht in der Box wird das Fell um 9–15 Punkte schmutziger (in einer nicht gemisteten Box +5 extra), Mähne und Schweif um 5–9 (+2). Stufen Fell: unter 20 sauber · ab 20 staubig · ab 50 schmutzig · ab 80 sehr dreckig; Mähne/Schweif: gekämmt · ab 20 zerzaust · ab 50 verfilzt. Man sieht es im Bild (Flecken, dreckige Beine, Stroh im Schweif). Putzen in der Putzkiste: Bürste macht das Fell sauber, Kamm Mähne und Schweif. Der Pferdepfleger putzt seine Boxen jeden Morgen; nach Klinik, Aufzucht oder Ausbildung kommt das Pferd geputzt zurück. Folgen: bis zu 15 % weniger Marktwert (Wert = max(Fell, 0,7 × Mähne)); ist das Fell länger als eine Jahreszeit ununterbrochen schmutzig (ab 50), verliert das Pferd zusätzlich 3 % Gesundheit pro Tag.</p>
      <p>Gut versorgt +8 % pro Tag, hungrig −19, Box nicht gemistet −9,5. Unter 40 % kommt ein Brief vom Tierarzt, bei 30 % oder weniger erholt sich ein Pferd nur noch in der Klinik (+16 %/Tag, ${fmt(KOSTEN.klinik)}/Tag) und wird mit 75 % entlassen. Die Klinikkosten kommen als Rechnung (siehe „Rechnungen“). Ausnahme: Senioren mit altersbedingter Höchstgesundheit von 40 % oder weniger.</p>
      <p>Senioren ab 20 Jahren: höchstens 75 %, sinkt bis 35 Jahre auf 1 %. Sterbewahrscheinlichkeit je Jahreszeit steigt ab 20 Jahren und erreicht mit 35 Jahren 100 %.</p>
      <h3>💰 Geld und Marktwert</h3>
      <p><b>Alter</b> – erreichbar ist Anlage × Altersfaktor. Wachstum: unter 1 Jahr 40 %, 1 J. 55 %, 2 J. 70 %, 3 J. 80 %, 4 J. 90 %, ab 5 J. 100 % (dazwischen anteilig je Jahreszeit; Lernfähigkeit ohne Wachstumsgrenze). Abbau je Jahr (anteilig je Jahreszeit): die ersten 5 Jahre −3 %, danach −5 %, nie unter 20 %. Beginn: früh ab 12 Jahren (Geschwindigkeit, Beschleunigung, Regeneration), normal ab 13 (Kraft, Ausdauer, Wendigkeit, Beweglichkeit, Koordination, Zähigkeit, Konzentration, Reaktionsfähigkeit), spät ab 18 (Konstitution, Lernfähigkeit). Vertrauen und Gehorsam altern nicht. Zu Beginn jeder Jahreszeit sinken Werte, die über der Altersgrenze liegen, auf diese Grenze. Später (Training daheim) bremst regelmäßiges Training den Abbau.</p>
      <p><b>Startstand der trainierbaren Werte</b> (bis das Training daheim kommt): Altersgrenze × (60 % + ab 3 Jahren bis zu 30 % je nach Ausbildungsstand). Vertrauen: 30 ± Menschenbezug + 30 % des Ausbildungsstands. Gehorsam: 80 % des Ausbildungsstands (+5 ab 3 Jahren).</p>
      <p>Marktwert aus Gangwerk (Notenschnitt − 2,5) / 6, Ausbildungsstand, Alter und Gesundheit, plus die Kosten aller gemachten Gentests (getestete Pferde verkaufen sich besser). Stute mit Fohlen bei Fuß: beide Marktwerte zusammen, das Fohlen wird mitverkauft (allein nicht). Festpreis (Regler 50–160 % des Marktwerts, Chance wird angezeigt): bis 90 % des Marktwerts 98 % Verkaufschance, bis Marktwert 93 %, darüber sinkend (110 % ≈ 59 %, 120 % ≈ 38 %, 130 % ≈ 24 %, 150 % ≈ 10 %), aber nie unter 4 % (Liebhaber). Gerechnet mit dem Saisonpreis der Jahreszeit, in der du das Pferd einstellst. Während das Angebot läuft, schicken Interessenten manchmal Preisvorschläge per Brief (jede Nacht 15 %, bei deutlich überhöhtem Preis 35 %; 75–105 % des Marktwerts, immer unter deinem Preis) – annehmen verkauft sofort, ablehnen lässt das Angebot weiterlaufen. Auktion startet bei ½ des Marktwerts und läuft 2 Jahreszeiten; Abbruch nach dem ersten Gebot kostet die Hälfte des letzten Gebots. Gnadenhof: halber Marktwert.</p>

      <p><b>Saisonpreise:</b> Frühling ×1,1 · Sommer ×1,05 · Herbst ×1 · Winter ×0,9 – gilt für alle Marktpreise und für deine eigenen Verkäufe (Festpreis-Chance und Auktionsgebote).</p>
      <p><b>Pferdepfleger:</b> ${fmt(MA_TYP.pfleger.gehalt)} pro Jahreszeit, sonst wie der Stallbursche (3 Boxen nach Boxnummer). Er putzt jeden Morgen Fell, Mähne und Schweif und kürzt Mähne und Schopf auf die Wunschlänge (Häkchen beim Schneiden) – länger wachsen lassen geht nur von selbst.</p>
      <p><b>Befunde (Krankheiten und Verletzungen)</b> – Liste je Pferd mit Art, Grad 1–5 (${GRAD_TEXT.slice(1).join(", ")}), Ursache, Verlauf. Grundrisiko ${String(BEFUND_RISIKO).replace(".", ",")} pro Nacht × Anteil der Krankheit (bei guter Haltung etwa 1,5 Befunde pro Pferd und Jahr) × Konstitution (1,5 − Anlage ÷ 100) × Wohlbefinden (unter 50 ×1,5, unter 30 ×2,2) × Alter (ab 15 J. ×1,3, ab 20 ×1,6) × Art: Verletzung Weide ×1,5 · Lahmheit Zähigkeit (1,3 − Wert ÷ 100 × 0,6), ab 15 J. ×1,5, nach Verletzung ×1,5 · Kolik hungrig ×2, Winter ×1,3, Futter-Faktor (kommt mit der Fütterung) · Husten/Erkältung Mist ×1,5/1,3, Schmutz ×1,2, Winter ×2, Herbst ×1,5, Weide ×0,5/0,7 · Hufrehe Frühlingsweide ×3 · Mauke Schmutz ×1,5, Mist ×1,5, Herbst-/Winterweide ×2 · Arthrose erst ab 15 J. · Sommerekzem nur im Sommer (Isi, Tinker, Haflinger ×3, sonst ×0,3) · Cushing ab 18 J.</p>
      ${verTab(["Krankheit", "Anteil", "Bereich", "Gesundheit/Nacht je Grad", "ohne Behandlung", "Behandlung", "Heilung"], Object.values(KRANK).map(K => [`${K.ico} ${K.n}${K.chronisch ? " (chronisch)" : ""}`, String(K.gew).replace(".", ","), (WISSEN.find(w => w[0] === K.bereich) || [])[3], String(K.g).replace(".", ","), `${K.selbst ? `bis Grad 2: ${Math.round(K.selbst * 100)} % besser · ` : ""}${Math.round(K.schlimmer * 100)} % schlimmer${K.tod ? ` · Tod nach ${K.tod} ${K.tod === 1 ? "Nacht" : "Nächten"} auf Grad 5 (nur nach Warnung)` : ""}`, `${fmt(K.kosten)} (+25 % je Grad über 1)${K.op ? ` · ab Grad ${K.op} OP ${fmt(KOLIK_OP)}` : ""}`, K.chronisch ? "bleibt, behandelt Grad 1" : `${K.heil} × (0,6 + 0,4 × Grad) Tage`]))}
      <p>Unbehandelt: Gesundheit − Wert × Grad pro Nacht (nicht unter 1 %), Wohlbefinden −1,5 × Grad; behandelt nur 30 % davon. Heilung × (1,3 − Regeneration ÷ 100 × 0,6). Tödlich nur Kolik, Hufrehe und Druse auf Grad 5 ohne Behandlung – und nur, wenn vorher deutlich gewarnt wurde (Anzeichen beim Besuch gesehen, Meldung eines Mitarbeiters ab Grad 4 oder Tierarzt kannte den Fall). Kennt der Tierarzt den Fall, schreibt er ab Grad 4 einen Warnbrief. Bekannte Befunde sperren die Zucht (ab Grad 3 oder Kolik/Druse/Hufrehe) und senken den Marktwert (unbehandelt 6 % je Grad, behandelt 2 %, chronisch dauerhaft 10 %, höchstens −60 %). Für Training (Etappe 4) vorbereitet: <code>befundBremse</code>.</p>
      <p><b>Bemerken und Einschätzen:</b> Jeden Morgen kann bemerken, wer bei dem Pferd gearbeitet hat (Stallbursche/Azubi, Pfleger, Bereiter) sowie Pferdewirt und Stallmeister: Chance 25 % + 10 % je Grad + Erfahrung im Bereich ÷ 250 (+20 % aufmerksam) → Brief mit Einschätzung. Trefferquote 20 % + Erfahrung × 0,75 % (+5 % aufmerksam); Sicherheit aus Erfahrung ÷ 100 ± Zufall (ab 0,55 „sicher“, ab 0,2 „vermutet“, sonst „keine Ahnung“) – auch Unerfahrene sind manchmal fälschlich sicher. Falsche Tipps meist aus demselben Bereich. Spieler beim ersten Besuch am Tag: 35 % + 15 % je Grad + eigene Erfahrung ÷ 300, Anzeichen als Sprechblase. In Box → Pflege → Versorgung: Mitarbeiter vertrauen, anderen fragen, selbst einschätzen (Annahme – eigene Behandlungen ab Etappe D) oder Tierarzt. Erfahrung erst mit der Diagnose: richtige Einschätzung +3, falsche +1, wer es bemerkt hat +2; Spieler immer +1, eigene Einschätzung richtig +3, falsch +1,5.</p>
      <p><b>Tierarzt-Hausbesuch:</b> ${fmt(TIERARZT_BESUCH)} – sichere Diagnose aller Befunde (auch unbemerkter), Erstbehandlung (eine Stufe besser, chronisch auf Grad 1; zählt als voll behandelter Tag) und Behandlungsplan; Rezeptmittel bringt er mit (${REZEPT_DOSEN} Dosen, Preis je Dosis), Boxenruhe trägt er ein. Kolik ab Grad 4: OP in der Klinik ${fmt(KOLIK_OP)} inkl. ${KOLIK_OP_TAGE} Tage, danach ${fmt(KOSTEN.klinik)} pro Tag bis 75 %.</p>
      <p><b>Hufe (Etappe E):</b> Hufqualität 5–100 (nur Admin): Rasse (${Object.entries(HUF_RASSE).map(([r, q]) => `${rasseById(r) ? rasseById(r).name : r} ${q}`).join(", ")}) ± 20, vererbt wie eine Anlage; instabil unter 35, stabil ab 65. Hufwachstum (vererbt, 20 % langsam / 60 % normal / 20 % schnell, beim Fohlen 15 % anders als das Elternteil): Hufschmied alle ${Object.entries(HUF_WACHS).map(([k, v]) => `${k} ${String(v).replace(".", ",")}`).join(" / ")} Jahreszeiten. Preise: Barhuf ${fmt(HUF_PREIS.barhuf)}, Beschlag ${fmt(HUF_PREIS.beschlag)}, Anfahrt ${fmt(HUF_PREIS.anfahrt)} je Besuch. Dauerauftrag mit wählbarem Rhythmus je Pferd: wie der Hufschmied empfiehlt (eigenes Hufwachstum – kennt er erst nach ${HUF_KENNT_AB} Besuchen, vorher 1 Jahreszeit) oder alle ½ / 1 / 2 Jahreszeiten – seltener spart Geld, aber zu lange Hufe erhöhen das Risiko. Mit Stallmeister werden die Termine zusammengelegt (wer in ⅓ Jahreszeit fällig wäre, kommt mit, nur eine Anfahrt). Ohne Dauerauftrag ein Erinnerungsbrief. Zu lange Hufe (Länge = Tage seit Hufschmied ÷ eigener Rhythmus): Risiko-Faktor 1 + (Länge − 1) × 1,5 (höchstens 4) für Lahmheit, Hufabszess und Hornspalt; ab 1,3 Sprechblase „stolpert“. Eisen verlieren (beschlagen): 1 % pro Nacht × instabil 3 / stabil 0,5 × Weide 1,5 × Länge-Faktor; ohne Eisen Lahmheit ×1,5, Abszess ×2. Hufkrankheiten: Strahlfäule (nicht ausgekratzt ×1, ausgekratzt ×0,3; Mist ×2; Herbst-/Winterweide ×2), Hufabszess, Hornspalt (instabil ×3, stabil ×0,5, Beschlag ×0,5, barhuf auf der Weide ×1,3). Der Hufschmied findet und versorgt sie (eine Stufe besser) und gibt einen Plan. Hufe auskratzen: Putzkiste (Hufkratzer), Pfleger jeden Morgen oder als Behandlung. Hufgröße misst der Hufschmied nur auf Anfrage für ${fmt(HUF_MESSEN)} (nach Gewichtsklasse, hinten in 30 % eine Nummer kleiner; steht danach im Steckbrief). Anfahrt nur einmal am Tag. Hufschuhe (Ausrüstung → Hufschuhe): je Pferd ein Paar vorne und/oder hinten, ${fmt(HUFSCHUH_PREIS)} pro Paar, Zustand 100 %; falsche Größe scheuert – eingesetzt und abgenutzt werden sie mit dem Training im Gelände.</p>
      <p><b>Ansteckung (Etappe F):</b> ansteckend sind ${Object.keys(ANSTECKEND).map(k => KRANK[k].n).join(", ")}. Nach der Ansteckung erst Inkubation (Influenza 2, Druse/Herpes/Pilz 3, Würmer 4 Tage): schon ansteckend, aber ohne Anzeichen – nur das große Blutbild findet sie. Chance pro Nacht je krankem Pferd: ${Object.entries(ANSTECKEND).map(([k, A]) => `${KRANK[k].n} ${Object.entries(A).map(([w, x]) => `${w} ${String(x).replace(".", ",")}`).join("/")}`).join(" · ")}. Wege: Weide (beide auf der Weide), Luft (im Stall ÷ (1 + Boxabstand)), Kontakt (Nachbarbox), Tränke (alle im Stall), Putzzeug (vom selben geputzt, nicht beide mit eigenem Putzzeug), Träger (vom selben Mitarbeiter oder dir gestern versorgt; zuverlässige oder erfahrene ab 50 machen das bemerkte kranke Pferd zuletzt ×0,3). Quarantäne (1 Jahreszeit): kein Weidegang, eigenes Putzzeug, Luft ×0,5, Kontakt ×0,2, Träger ×0,3, keine Tränke. Ein Mitarbeiter „nur für dieses Pferd“ versorgt nur dieses und trägt nichts weiter. Geimpft (Influenza/Herpes, 2 Jahreszeiten) ×0,3 und Start eine Stufe leichter; Wurmkur in der letzten Jahreszeit: Würmer ×0,2. × Konstitution (1,5 − Anlage ÷ 100). Herpes bei tragenden Stuten: Verfohlen 5 % je Grad pro Nacht. Neuzugänge bringen etwas mit: ${Object.entries(NEUZUGANG_RISIKO).map(([q, x]) => `${q} ${Math.round(x * 100)} %`).join(", ")} (Influenza 30 %, Druse 15 %, Herpes 10 %, Pilz 20 %, Würmer 25 %).</p>
      <p><b>Ankaufsuntersuchung (Etappe G)</b> – in jedem Kauf-/Bieten-Fenster am Pferdemarkt: ${Object.values(AKU).map(S => `${S.n} ${fmt(S.preis)}`).join(", ")}; dazu Labortest Erbkrankheiten +${fmt(AKU_LABOR)}, Blutprobe einlagern +${fmt(AKU_PROBE)} (später prüfen ${fmt(PROBE_PRUEFEN)}). Ergebnis sofort und als Protokoll per Brief. Versteckte Befunde je Pferd nach Herkunft (Grundrisiko ${Object.entries(AKU_RISIKO).map(([q, x]) => `${q} ${Math.round(x * 100)} %`).join(", ")}): Lahmheit (Risiko × 0,7; Grad 2 sieht man im Gangbild, Grad 1 erst bei der Beugeprobe; beim Händler in 50 % mit Schmerzmittel verschleiert – nur das große Blutbild findet es, nach dem Kauf zeigt sich die Lahmheit nach 2 Tagen), Husten (× 0,35, Lunge), Herzgeräusch (× 0,15), Linsentrübung (× 0,12), Taktunreinheit an der Longe (× 0,15), Arthrose ab 10 Jahren (× 0,5, Beugeprobe oder Röntgen), Röntgenklasse I–IV (mit Arthrose III/IV), ansteckende Krankheit in der Inkubation wie bei Neuzugängen (kleines Blutbild: Entzündung, großes: welche). Jeder Befund mindert den Wert (z. B. Lahmheit 8/15 %, Arthrose 12 %, Röntgen III 15 %/IV 30 %, höchstens 50 %). Danach: kaufen, Preis um diesen Anteil verhandeln (einmal; Erfolg privat ${Math.round(AKU_VERHANDELN.Privat * 100)} %, Händler ${Math.round(AKU_VERHANDELN["Händler"] * 100)} %, Gestüt ${Math.round(AKU_VERHANDELN["Gestüt"] * 100)} %) oder ablehnen. Beim Kauf kommen alle versteckten Befunde mit (gefundene schon diagnostiziert). Eingelagerte Probe mit Schmerzmittel (Händler): der Händler erstattet die Hälfte des Kaufpreises. Eigener Verkauf ab ${fmt(1500)}: 40 % der Käufer machen eine AKU – jeder bekannte oder unbekannte Befund senkt den Preis (5 % je Grad, chronisch +10 %, frühere chronische 8 %, höchstens 40 %).</p>
      <p><b>Putzen durch Wischen</b> (Ausrüstung → Putzkiste): Werkzeug antippen, dann im Stallbild über das Pferd wischen (Finger oder gedrückte linke Maustaste). Bürste: überall auf dem Pferd; Kamm: nur oben (Mähne) und hinten/vorne (Schweif, Schopf). Nötige Wischstrecke 350 + 6 × Schmutz (Bildpunkte im Stall, 400 breit) – der Schmutz geht dabei anteilig weg, das Bild wird alle 25 % neu gezeichnet. Hufkratzer: 4 Hufunterseiten mit je 6 Dreckklumpen nacheinander wegwischen. Pfleger putzen weiter automatisch.</p>
      <p><b>Erbkrankheiten (Etappe H)</b> – versteckt je Pferd (<code>p.erb</code>: 0/1/2 Krankheits-Allele), von jedem Elternteil ein Allel; Mischlinge nach Rassenanteil. Träger-Anteil je Rasse: ${Object.values(ERBKRANK).map(K => `${K.kurz} ${Object.entries(K.rassen).map(([r, q]) => `${rasseById(r) ? rasseById(r).name : r} ${Math.round(q * 100)} %`).join("/")}${K.dominant ? " (dominant)" : ""}`).join(" · ")}. Rezessiv: Träger gesund, Träger × Träger → ¼ betroffen; dominant (HYPP, PSSM1): schon ein Allel macht krank. Folgen: WFFS Tod nach 1 Tag, SCID nach 2 Jahreszeiten, NFS nach 1 Jahreszeit, Wasserkopf Totgeburt (Stute −20 % Gesundheit), Friesen-Zwergwuchs und ACAN (halb Totgeburt, halb Zwerg) 78 % der Größe, CA/HERDA/HYPP/PSSM als chronischer Befund ab ¼/1½/1/2 Jahren (50 % je Jahreszeit). Labortest Erbkrankheiten prüft die Krankheiten aller Rassen ab 12,5 % Anteil: ${fmt(LABOR_TESTS.krank.preis)} + 30 € je weitere Rasse. Warnung beim Verpaaren nur, wenn ein Partner positiv getestet ist (dominant immer; rezessiv, wenn beide getestete Träger sind oder der Partner ungetestet und aus einer betroffenen Rasse ist). Getestete Träger sind für die Zucht 8 % weniger wert, Betroffene 25 %. Veranlagungen ohne Gentest (0–1, vererbt als Mittel der Eltern ± 10 %): ${Object.values(VERANLAGUNG).map(V => `${V.n} (${Object.entries(V.rassen).map(([r, q]) => `${rasseById(r) ? rasseById(r).name : r} ${Math.round(q * 100)} %`).join(", ")}, sonst ${Math.round(V.sonst * 100)} %)`).join(" · ")}. Sommerekzem: Risiko × Veranlagung × 5 im Sommer. Kehlkopfpfeifen ab 2 Jahren. OCD entsteht im Wachstum (unsichtbar, nur Röntgen bei der großen AKU, Lahmheit ×1,3, ab 3 Jahren manchmal als Befund). Melanome nur bei Schimmeln (Gen G) ab 6 Jahren, steigend mit dem Alter. Ekzemerdecke und Weidezeiten kommen mit Ausrüstung bzw. Fütterung.</p>
      <p><b>Lager (Hofverwaltung → Hof):</b> Verlässt ein Pferd den Hof (Verkauf, Rückgabe, Abgabe, Gnadenhof, Tod), kommen sein eigenes Putzzeug und seine Hufschuhe (mit Größe und Zustand) ins Lager. Von dort an ein anderes Pferd geben (Putzzeug desinfiziert und kostenlos; Putzzeug von einem Pferd mit Hautpilz in der letzten Jahreszeit: 30 % Ansteckung – besser wegwerfen), an Gnadenhof oder Tierschutzverein spenden (Sympathie +${SPENDE_RUF} je Teil, Dankesbrief) oder wegwerfen. Beim Verkauf (Festpreis/Auktion) kann man das Zubehör mitgeben: Preis + gebrauchtes Putzzeug 20 €, Hufschuhe 60 % vom Neupreis × Zustand je Paar.</p>
      <p><b>Vorsorge und Labor:</b> Impfung ${fmt(VORSORGE.impfung)}, Zahnkontrolle ${fmt(VORSORGE.zahn)} (über 1 Jahr überfällig: Kolik ×1,5), Wurmkur aus der Stallapotheke (überfällig über 2 Jahreszeiten: Würmer ×3), kleines Blutbild ${fmt(VORSORGE.blutKlein)} (Entzündung ja/nein), großes ${fmt(VORSORGE.blutGross)} (konkrete Krankheit, auch in der Inkubation) – Ergebnis nach 2 Tagen per Brief. Eigenes Putzzeug ${fmt(VORSORGE.putzzeug)} (Putzkiste). Ein Quarantänestall (kein Risiko) kommt mit dem Hof-Ausbau.</p>
      <p><b>Behandlung (Etappe D)</b> unter Pflege → Versorgung, jede Aktion einmal am Tag: ${Object.values(AKTION).map(A => `${A.ico} ${A.n}`).join(", ")}, Medikament mit Dosis. Wirkung in der Nacht danach: Behandlungswert = Summe der passenden Anteile (höchstens 1) × (0,5 + 0,5 × Mitwirkung). Besserung pro Nacht: Wert ÷ (Heilungszahl × 0,5) ÷ (1,3 − Regeneration ÷ 100 × 0,6), höchstens 80 % (chronisch nur bis Grad 1); Verschlechterung × (1 − Wert) + Schaden; Wirkung auf Gesundheit/Wohlbefinden × (1 − 0,6 × Wert). Heilt ein Befund unter Behandlung, gilt die Ursache als geklärt (Erfahrung). Tod und Warnbrief nur bei Wert unter 0,3.</p>
      ${verTab(["Befund", "hilft", "schadet", "Tierarzt-Plan"], Object.keys(HILFT).map(k => [`${KRANK[k].ico} ${KRANK[k].n}`, Object.entries(HILFT[k]).map(([a, x]) => `${behName(a)} ${String(x).replace(".", ",")}`).join(", "), Object.entries(SCHADET[k] || {}).map(([a, x]) => `${behName(a)} +${String(x).replace(".", ",")}`).join(", ") || "–", (PLAN[k] || []).map(behName).join(", ")]))}
      <p><b>Mitwirkung</b> = 0,4 + Vertrauen ÷ 100 × 0,6 − 0,2 × scheu − 0,2 × nervös (0,2–1); Chance, dass sich das Pferd wehrt und die Aktion misslingt: (1 − Mitwirkung) × 40 %. Boxenruhe: kein Weidegang, Bereiter lässt das Pferd stehen, Wohlbefinden −1 (temperamentvoll bis −4) pro Nacht; endet, wenn kein Befund mehr da ist. <b>Gewicht</b> = Körperbau × Stockmaß³ ÷ 10 000 (Körperbau: Robustpferde 1,55, Friese/Lipizzaner 1,4, Araber/Hannoveraner 1,3, Vollblut/Marwari 1,15, Achal-Tekkiner 1,1) ± 5 %; angezeigt als „ca.“ mit bis zu ±4 % Schätzfehler. <b>Dosis</b> in 5 Stufen: ${DOSIS.map(([, t], i) => `${i + 1} = ${t}`).join(", ")}. Zu niedrig: wirkt nicht. Zu hoch: Vergiftung (1 Stufe zu viel → leicht, 2 → deutlich, 3 → schwer, 4 → lebensbedrohlich). Falsches Mittel (hilft gegen keinen Befund): Wohlbefinden −5, Gesundheit −2; Kortison 10 % Hufrehe, Antibiotikum 10 % Kolik.</p>
      <p><b>Stallapotheke</b> (Ausrüstung → Medizin): ${Object.values(APO).map(M => `${M.ico} ${M.n} ${M.frei ? fmt(M.preis) : "nur Rezept"}`).join(" · ")}. <b>Behandlungsplan:</b> Pfleger oder Pferdewirt übernimmt die heutige Behandlung (sonst die letzte eigene, sonst den Tierarzt-Plan mit richtiger Dosis) jeden Morgen (nicht auf der Weide): vergisst eine Aktion mit 25 % × (1 − Erfahrung ÷ 100) (schusselig ×1,5, zuverlässig nie), unter 30 Erfahrung gibt er in 15 % der Fälle eine Dosisstufe zu wenig; +0,3 Erfahrung pro Tag. Plan endet, wenn kein Befund mehr da ist.</p>

      <p><b>Mitarbeiter (Hofverwaltung → Mitarbeiter):</b> Stallgröße klein bis 8 Boxen, mittel 9–19, groß ab 20. Gehalt pro Jahreszeit (am Ende gezahlt, im Adminmodus kostenlos), erfahrene Bewerber wollen bis +25 %: ${Object.values(MA_TYP).map(T => `${T.name} ${fmt(T.gehalt)}${T.boxen ? ` (${T.boxen} Boxen)` : ""}${T.ab !== "klein" ? ` – bewirbt sich ${abText(T.ab)}` : ""}`).join(" · ")}. Nachtzuschlag ${fmt(NACHTZUSCHLAG)} pro Nacht. Zu jeder Jahreszeit 2–3 neue Bewerber je Stelle (Erfahrung um die Startwerte ×0,6–1,5, 0–2 Eigenschaften ohne Gegensätze). Beginn immer zur nächsten Jahreszeit; gekündigt arbeiten sie bis Ende der Jahreszeit; reicht das Geld nicht, nehmen sie das Gehalt trotzdem und kündigen.</p>
      <p><b>Azubi und Ausbilder:</b> Einen Azubi gibt es nur mit freiem Ausbilderplatz: Pferdewirt (beide Fachrichtungen) und Stallmeister je 2 Azubis, Bereiter nur im Ausbildungsstall, der Spieler mit Ausbilderschein (einmalig ${fmt(AUSBILDERSCHEIN)}) 1 Azubi; Pferdepfleger nicht. Ausbilder krank/im Urlaub: Azubi arbeitet, lernt nichts, Fehler +10 %. Ausbilder weg: neuer wird automatisch gesucht, sonst Warnbrief und nach 1 Jahreszeit Abbruch. Ausbildung ${AUSBILDUNG_JZ / 4} Jahre, Gehalt ${AZUBI_GEHALT.map(fmt).join(" / ")} pro Jahreszeit. Lernt je Arbeitstag mit Ausbilder +0,4 in den ersten beiden und +0,25 in den anderen Bereichen der Fachrichtung (${Object.values(FACH).map(F => `${F.n}: ${F.lernt.map(k => (WISSEN.find(w => w[0] === k) || [])[3]).join(", ")}`).join(" · ")}). Abschlussprüfung: Chance (Schnitt der 4 Bereiche − 8) ÷ 22, zwischen 10 und 95 %; bestanden → Brief mit Übernehmen (Gehalt der Fachkraft, Erfahrung/Eigenschaften bleiben, fehlendes Grundwissen bis zur Hälfte der Startwerte) oder Gehen lassen (sonst geht er zum Ende der Jahreszeit); durchgefallen → ${VERLAENGERUNG_JZ} Jahreszeiten Verlängerung. Fachrichtung nach Stallart (Zuchtstall → Pferdezucht → Pferdewirt Zucht und Haltung; Ausbildungsstall → Klassische Reitausbildung → Bereiter; Pension/Gnadenhof → Haltung und Service; Rennstall → Pferderennen; Westernstall → Spezialreitweisen). Stallarten kommen mit dem Hof-Ausbau – bis dahin gilt der Hof als Zuchtstall (<code>spiel.stallarten</code>). Pferdewirt Haltung und Service ${fmt(MA_TYP.pferdewirtHS.gehalt)}: nur mit Pensionsstall/Gnadenhof.</p>
      <p><b>Arbeit jeden Morgen</b> (nach Boxnummer): Stallburschen und Azubis füttern und misten (Weide nur, wenn Heu nötig ist), mit Stallmeister schafft ein Stallbursche 5 statt 3 Boxen, fleißig +1 Box. Pfleger putzen (Bürste + Kamm) und schneiden Mähne/Schopf auf Wunschlänge. Bereiter trainieren Pferde ab 3 Jahren mit über 50 % Gesundheit (nicht auf der Weide, ohne Boxenruhe) – siehe „Training daheim“. Fehler (vergisst eine Box): Azubi 25 % × (1 − Erfahrung Fütterung/Stallklima ÷ 50), mindestens 3 %; schusselig +8 %; zuverlässig nie. Ruhige Hand: Vertrauen der versorgten Pferde +0,2 pro Tag; ungeduldig −0,1 (nicht unter 20).</p>
      <p><b>Erfahrung</b> (7 Bereiche, 0–100): ${WISSEN.map(w => w[1]).join(", ")}. Startwerte: ${Object.values(MA_TYP).map(T => `${T.name} ${WISSEN.map(([k]) => T.start[k]).join("/")}`).join(" · ")} (Reihenfolge wie oben). Pro Arbeitstag +0,25 in den Hauptbereichen (Bereiter Hufe +0,12) × (1 − Erfahrung ÷ 110), lernbegierig ×1,5; Azubis lernen nur, wenn ein Pferdewirt oder Stallmeister da ist. Pferdewirt: Zucht +0,25 (mit tragender Stute oder Fohlen, sonst +0,08), Pflegebereiche +0,05; Stallmeister überall +0,06. Spieler startet überall mit 10 und lernt einmal am Tag +0,3 beim Füttern (Fütterung), Misten (Stallklima) und Putzen (Haut).</p>
      <p><b>Zufriedenheit</b> (versteckt, 0–100, Start ${ZUFR_START}; Spieler sieht nur „wirkt zufrieden“ ab 65 / „ganz okay“ ab 40 / „unzufrieden“): normaler Arbeitstag +0,2 (bis 80), Überstunden −1, weniger Gehalt als heute üblich −0,2 pro Tag, Nachtdienst −5 (Nachteule +1), Urlaub genehmigt +5 (ohne Antwort +2), abgelehnt −15, im Urlaub +0,5 pro Tag. Unter ${KUENDIGEN_AB}: jeden Tag 10 % Chance auf Kündigung zum Ende der Jahreszeit (Brief). <b>Urlaub</b> (Dome: einmal im Jahr 1–3 Tage, da ein Spieljahr nur 4 Jahreszeiten hat): Chance ${Math.round(URLAUB_CHANCE * 100)} % pro Tag, bis es im Jahr einmal geklappt hat; Antrag per Brief 2 Tage vorher (Genehmigen/Ablehnen, ohne Antwort genehmigt). <b>Krank</b> 1–3 Tage: ${(KRANK_CHANCE * 100).toLocaleString("de-DE")} % pro Tag, ×2,5 bei Überstunden, ×2 unter 40 Zufriedenheit. Fehlt jemand, übernehmen Kollegen aus demselben Beruf je 1 Box mehr (Überstunden), der Rest bleibt liegen.</p>
      <p><b>Nachtdienst bei Geburten:</b> Pferdewirt (immer) oder Pferdepfleger (kleiner/mittlerer Stall), Nachteulen zuerst. Mit Aufsicht: Nachtzuschlag, Fohlen 100 % Gesundheit, Stute Wohlbefinden +5, Zucht-Erfahrung +1,5. Ohne Aufsicht: 15 % Chance, dass das Fohlen schwach ist (Gesundheit 70–85 %).</p>
      <p><b>Decksaison:</b> Die Hengste der Deckstation (Gestüte) decken nur im Frühling und Sommer, eigene Hengste jederzeit.</p>
      <p>Geburtszeit sonst: 65 % Frühling, 17 % Sommer, 10 % Winter, 8 % Herbst.</p>
      <p>Eigene Pferde: Auktion startet bei ½ des Marktwerts (wie im Auktionshaus) und läuft 2 Jahreszeiten; Zwischenstand und Ergebnis kommen per Brief mit Anzahl der Gebote, beim Verkauf auch mit dem Marktwert zu Beginn und am Ende. Bietet niemand das Startgebot, bleibt das Pferd.</p>
      <p><b>Ansehen (geheim, Spieler sieht es nie):</b> Jeder Absender startet bei 100 Punkten (Skala 0–200). Positiv +5: Rechnung pünktlich bezahlt, „Du“ angenommen, Verkauf über Pferdemarkt/Auktionshaus, Zuschlag im Auktionshaus, Pferd vom Tierschutz zurückgekauft, Pferd an den Gnadenhof gegeben. Negativ −5: Mahnung, Abbuchung, „Du“ abgelehnt, Preisvorschlag abgelehnt, eigene Auktion mit Strafe abgebrochen, Aufenthalt wegen Kontominus abgebrochen, Tierschutz: Strafe wegen Vernachlässigung, Notfallpferd verkauft oder zurückgegeben, Fohlen abgeholt. Das „Du“ wird erst ab ${DU_AB_RUF} Punkten angeboten (also frühestens nach 16 positiven Kontakten mehr als negativen); fällt ein Absender, mit dem man sich duzt, auf ${DU_WEG_RUF} oder darunter, zieht er das „Du“ beleidigt zurück.</p>
      <p><b>Briefe:</b> Absender schreiben zuerst mit „Sie“. Nach ${DU_ANGEBOT_NACH} Briefen (und ab ${DU_AB_RUF} Punkten Ansehen) bietet ein Absender in einem eigenen Brief das „Du“ an – annehmen oder beim „Sie“ bleiben. Pferdenamen in Briefen lassen sich antippen. Diagnosen kommen als eigener Brief (Ereignis „Tierarzt: Diagnose“).</p>
      <p><b>Schecken-Namen:</b> Overo und Tovero heißen ohne Gentest nach dem Aussehen (z. B. „Braunschecke“) – welches Scheckungs-Gen dahintersteckt, sieht man erst nach dem Fellfarben- oder Erbkrankheiten-Test („Braunschecke (Overo)“). Overo-Träger können auch einfarbig aussehen (kaum Weiß); in der Admin-Genauswahl lässt sich O/n deshalb auch bei einfarbigen Farben einstellen.</p>
      <p><b>Warnung bei Erbkrankheiten</b> (Overo × Overo, Leopard × Leopard): erscheint nur, wenn mindestens eins der beiden Pferde einen positiven Gentest hat und das andere ebenfalls positiv getestet ist oder das Muster sichtbar zeigt.</p>
      ${verTab(["Posten", "Kosten"], [["Aufzuchtstation", `${fmt(KOSTEN.aufzucht)} / Tag`], ["Ausbildungsstall", `${fmt(KOSTEN.ausbildung)} / Tag`], ["Klinik", `${fmt(KOSTEN.klinik)} / Tag`], ...Object.values(LABOR_TESTS).map(T => [`Labor: ${T.n}`, `${fmt(T.preis)} · Ergebnis nach ${T.tage} Tagen per Post`]), ["Tierschutz zurückkaufen", "½ Marktwert + offene Klinikkosten"], ["Strafe: Tod durch Vernachlässigung", fmt(STRAFE_VERNACHLAESSIGUNG)]])}
    </div>`;

      <h4 class="ma-titel">Bewerbungen ${ok ? `für ${jzName(jetzt).replace(/^\S+ /, "")}` : ""}</h4>

        : bw.length ? `<div class="ma-liste">${bw.map((x, i) => `<div class="ma-karte"><div class="ma-zeile"><span><b>${esc(x.name)}</b><small>${x.w ? T.w : T.name} · ${typ === "azubi" ? `${fmt(x.gehalt)} pro Jahreszeit im 1. Jahr` : `möchte <b>${fmt(x.gehalt)}</b> pro Jahreszeit`}</small></span>${typ === "azubi" && fachAngebot().length > 1 ? fachAngebot().map(f => `<button class="knopf" data-einst="${i}" data-fach="${f}">${FACH[f].n}</button>`).join("") : `<button class="knopf" data-einst="${i}">Einstellen</button>`}</div>${eigHTML(x)}${wissenHTML(x.wissen)}</div>`).join("")}</div>`
        : `<p>Diese Jahreszeit hat sich niemand mehr beworben. Zur nächsten Jahreszeit kommen neue Bewerbungen.</p>`}`,

    document.querySelectorAll("[data-kuend]").forEach(b => b.onclick = () => { const m = sb[+b.dataset.kuend];
      if (m.ab > jetzt) spiel.mitarbeiter = spiel.mitarbeiter.filter(x => x !== m); else m.bis = jetzt;

      const neu = { id: "ma" + Date.now().toString(36), typ, name: x.name, w: x.w, wissen: { ...x.wissen }, eig: [...x.eig], gehalt: x.gehalt, ab: jetzt + 1, bis: null };
      if (typ === "azubi") { const a = freierAusbilder(); if (!a) return; neu.ausbilder = a.id; neu.fach = b.dataset.fach || fachAngebot()[0] || "zucht"; neu.pruefung = neu.ab + AUSBILDUNG_JZ; }
      (spiel.mitarbeiter = spiel.mitarbeiter || []).push(neu);
      spiel.bewerber.liste[typ] = bw.filter(y => y !== x);
