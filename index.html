<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pferdezucht</title>
<style>
  :root {
    --holz: #8b5a3c; --holz-dunkel: #5b3a24; --holz-hell: #b07a52;
    --stroh: #e8c874; --gras: #7cb356; --text: #2b1d12; --leise: #7a6552;
    --karte: #fffaf0; --akzent: #b5642f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(#bfe3f5, #e4f3fb); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: var(--holz-dunkel); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tagknopf { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; border: 0; cursor: pointer; font: inherit;
    background: #f3c64d; color: #3a2610; border-radius: 10px; padding: 5px 10px; box-shadow: 0 2px 0 #b58a1f; }
  .tagknopf b { font-size: .98rem; white-space: nowrap; }
  .tagknopf small { font-size: .68rem; font-weight: 600; opacity: .8; white-space: nowrap; }
  @media (max-width: 430px) { header h1 { font-size: 1rem; } header h1 .emoji { display: none; } }
  .tagknopf:active { transform: translateY(2px); box-shadow: none; }
  .menue { position: relative; }
  .menueknopf { width: 42px; height: 38px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
  .menueknopf span { display: block; width: 22px; height: 3px; border-radius: 2px; background: #fff; }
  .menueknopf[aria-expanded="true"] { background: rgba(255,255,255,.28); }
  .menueliste { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; min-width: 190px; background: var(--karte); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28); overflow: hidden; }
  .menueliste[hidden] { display: none; }
  .menueliste button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 16px; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; }
  .menueliste button + button { border-top: 1px solid #efe4d2; }
  .menueliste button:active, .menueliste button:hover { background: #f6ecdc; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 0 16px; gap: 14px; }
  /* Wetter vor der Stalltür */
  #draussen .flocke { animation: flockeFallen 5s linear infinite; transform-box: fill-box; }
  @keyframes flockeFallen { from { transform: translate(0, 0); } 50% { transform: translate(4px, 66px); } to { transform: translate(-2px, 132px); } }
  #draussen .tropfen { animation: regenFallen .8s linear infinite; }
  @keyframes regenFallen { from { transform: translate(0, 0); } to { transform: translate(-3px, 128px); } }
  #draussen .blatt { animation: blattFallen 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blattFallen { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(-6px, 40px) rotate(160deg); } 90% { opacity: 1; } 100% { transform: translate(4px, 86px) rotate(320deg); opacity: 0; } }
  #draussen .nebelband { animation: nebelZiehen 9s ease-in-out infinite alternate; }
  @keyframes nebelZiehen { from { transform: translate(-8px, 0); } to { transform: translate(8px, 0); } }
  #draussen .wolken { animation: wolkenZiehen 14s ease-in-out infinite alternate; }
  @keyframes wolkenZiehen { from { transform: translate(-3px, 0); } to { transform: translate(4px, 0); } }
  #stall { width: 100%; height: min(75vw, calc(100dvh - 64px)); display: block; }
  .karte { width: 100%; max-width: 520px; background: var(--karte); border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .karte h2 { margin: 0; font-size: 1.2rem; }
  .unter { color: var(--leise); margin: 2px 0 10px; font-size: .95rem; }
  .werte { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
  .werte dt { color: var(--leise); }
  .werte dd { margin: 0; font-weight: 600; }
  .text { font-size: .9rem; color: var(--leise); margin: 10px 0 0; line-height: 1.4; }
  /* Tagesablauf */
  .tagesleiste { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; background: var(--karte);
    border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .tagesleiste .tag { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
  .tagesleiste .status { flex: 1; font-size: .88rem; color: var(--leise); line-height: 1.25; }
  .tagesleiste .status b { color: var(--text); }
  .tagesleiste button { border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 700; font-size: .9rem;
    background: #3b4a7a; color: #fff; cursor: pointer; white-space: nowrap; }
  .tagesleiste button:active { transform: scale(.97); }
  #krippe, #boden, #mist { cursor: pointer; }
  #stall.tot > :not(#totText) { filter: grayscale(1) brightness(.85); }
  #stall.tot #krippenHinweis, #stall.tot #mistHinweis, #stall.ohneHinweise #krippenHinweis, #stall.ohneHinweise #mistHinweis { display: none !important; }
  #stall.tot #krippe, #stall.tot #boden, #stall.tot #mist { cursor: default; }
  #mist { transition: opacity .6s; }
  #mist.weg { opacity: 0; pointer-events: none; }
  #mistHinweis { display: none; animation: hopsen 1.2s ease-in-out infinite; }
  #stall.mistig #mistHinweis { display: inline; }
  .funkeln { animation: funkeln .9s ease-out forwards; }
  @keyframes funkeln { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-14px) scale(1.2); } }
  #stall .heu { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .4s; }
  #stall.leer .heu { transform: scaleY(0); opacity: 0; }
  #krippenHinweis { display: none; animation: hopsen 1.2s ease-in-out infinite; }
  #stall.leer #krippenHinweis { display: inline; }
  @keyframes hopsen { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  #dlg { position: fixed; inset: 0; z-index: 50; background: rgba(30,20,12,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #dlg[hidden] { display: none; }
  .dlg-karte { background: #fffaf2; color: var(--text); border-radius: 16px; padding: 18px 18px 14px; max-width: 440px; width: 100%; max-height: 90dvh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .dlg-karte h3 { margin: 0 0 8px; font-size: 1.08rem; } .dlg-karte p { margin: 6px 0; line-height: 1.4; }
  .dlg-liste { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; line-height: 1.4; }
  .dlg-liste li { background: #f6ecdc; border-radius: 10px; padding: 8px 10px; }
  .dlg-knoepfe { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; } .dlg-knoepfe .knopf { flex: 1; width: auto; min-width: 120px; padding: 11px; }
  .knopf.zweit { background: #e9dcc8; color: var(--text); }
  .knopf.rot { background: #b4473a; }
  .entfernen { display: block; margin: 14px auto 0; background: none; border: 1.5px solid #c9a59a; color: #9b3d31; border-radius: 10px; padding: 7px 14px; font: inherit; font-size: .85rem; cursor: pointer; }
  .zucht-knopf { width: auto; padding: 6px 12px; margin-top: 2px; font-size: .85rem; }
  .ts-liste { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .ts-pferd { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 12px; padding: 8px; }
  .ts-pferd svg { width: 96px; height: 78px; flex: none; background: #eaf5fb; border-radius: 8px; }
  .ts-pferd .ts-info { flex: 1; line-height: 1.35; font-size: .9rem; } .ts-pferd .ts-info small { color: var(--leise); display: block; }
  .ts-pferd .knopf { width: auto; padding: 9px 12px; font-size: .88rem; }
  .paar-liste { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
  @media (max-width: 420px) { .paar-liste { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
  .paar { display: flex; flex-direction: column; padding: 0; border: 0; background: none; font: inherit; cursor: pointer; text-align: center; min-width: 0; }
  .paar-bild { display: block; aspect-ratio: 1; overflow: hidden; background: linear-gradient(#dff1fa, #f4fbff); border: 4px solid #6b4226; border-radius: 8px 8px 0 0;
    box-shadow: inset 0 0 0 1px #3d2414; }
  .paar-bild svg { display: block; width: 100%; height: 100%; }
  .paar-brett { display: flex; flex-direction: column; gap: 1px; padding: 5px 4px 6px; color: #fff; font-weight: 300; font-size: .68rem; line-height: 1.25; letter-spacing: .02em;
    border-radius: 0 0 8px 8px; text-shadow: 0 1px 1px rgba(0,0,0,.45); box-shadow: 0 3px 6px rgba(0,0,0,.25);
    background: repeating-linear-gradient(92deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,.07) 2px 5px, rgba(255,255,255,0) 5px 11px),
      repeating-linear-gradient(88deg, rgba(60,10,0,.18) 0 1px, transparent 1px 17px), linear-gradient(180deg, #a2482a, #8a3420 55%, #6f2716); }
  .paar-brett b { font-weight: 500; font-size: .76rem; overflow-wrap: anywhere; } .paar-brett span { overflow-wrap: anywhere; }
  .paar:not(.gesperrt):active { transform: translateY(1px); }
  .paar:not(.gesperrt):hover .paar-bild { border-color: var(--akzent); }
  .paar.gesperrt { cursor: default; filter: grayscale(1); opacity: .6; }
  .paar-titel { margin: 14px 0 0; font-size: .95rem; } .paar-titel small { font-weight: 400; color: var(--leise); font-size: .78rem; margin-left: 4px; }
  .dlg-karte.breit { max-width: 600px; }
  .dlg-karte .dlg-knoepfe { position: sticky; bottom: -14px; background: #fffaf2; margin: 14px -18px -14px; padding: 10px 18px 14px; box-shadow: 0 -6px 10px -8px rgba(0,0,0,.25); }
  .inzucht-warnung { background: #fdecea; border: 1.5px solid #e6a49b; color: #7a241a; border-radius: 10px; padding: 9px 11px; margin: 4px 0 12px; font-size: .9rem; line-height: 1.4; }
  .inzucht-warnung ul { margin: 4px 0 6px; padding-left: 18px; }
  .inzucht-mark { margin-top: 2px; font-weight: 600; color: #ffe08a; }
  .schein-tab .sf.inzucht { background: #fbe1dc; }
  .inzucht-tag { color: #a93226; font-weight: 700; font-size: .72rem; margin-top: 2px; }
  .schein-inzucht { margin-top: 8px; background: #fbe1dc; border: 1.5px solid #d98b80; border-radius: 6px; padding: 6px 8px; font-size: .8rem; color: #7a241a; }
  .ahn-link { all: unset; font-weight: 700; color: #8a3a12; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }
  .schein-tab .sf.gross .ahn-link { font-size: 1.05rem; }
  #mini { position: fixed; inset: 0; z-index: 55; background: rgba(30,20,12,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #mini[hidden] { display: none; }
  .mini-karte { background: #fffaf2; color: var(--text); border-radius: 14px; width: 100%; max-width: 300px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .mini-karte .paar-bild { border-radius: 0; border-width: 0 0 4px; }
  .mini-karte dl { margin: 10px 14px; } .mini-karte h3 { margin: 10px 14px 0; }
  .mini-karte .dlg-knoepfe { margin: 0; padding: 0 14px 14px; position: static; box-shadow: none; }
  .verkauf-art { background: #fff; border: 1.5px solid #e2d6c3; border-radius: 12px; padding: 10px 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .verkauf-art small { color: var(--leise); line-height: 1.35; }
  .fest-preis { display: flex; flex-direction: column; gap: 4px; font-size: .92rem; } .fest-preis input { width: 100%; accent-color: var(--akzent); }
  .gnade-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
  .gnade-pferd { background: #f6ecdc; color: var(--text); border-radius: 14px; overflow: hidden; }
  .gnade-weide { background: linear-gradient(#bfe3f5, #e8f6fc 55%, #9fd27a 55%, #86c160); padding: 8px; } .gnade-weide svg { width: 100%; height: 130px; display: block; }
  .gnade-info { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; } .gnade-info small { color: var(--leise); }
  .schein-zwischen { margin: 18px 0 8px; font-size: 1rem; }
  #postIcon { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 10px; z-index: 45; width: 40px; height: 40px; padding: 4px 2px; border: 0; background: none; cursor: pointer;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); animation: briefWackeln 2.4s ease-in-out infinite; }
  #postIcon[hidden] { display: none; }
  #postIcon svg { width: 100%; height: 100%; display: block; }
  #postIcon .anz { position: absolute; top: -2px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #c0392b; color: #fff; font-size: .68rem; font-weight: 700; line-height: 17px; text-align: center; }
  #postIcon .anz:empty { display: none; }
  @keyframes briefWackeln { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-10deg); } 90% { transform: rotate(9deg); } 95% { transform: rotate(-5deg); } }
  /* Hofverwaltung als Akte */
  .hof-akte { color: var(--text); grid-column: 1 / -1; width: 100%; max-width: none !important; }
  .hof-akte .karte { border-radius: 0 14px 14px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); min-height: 260px; }
  .hof-akte .reiter button { font-size: .85rem; padding: 10px 4px 9px; }
  .hof-akte .reiter .anz { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: #c0392b; color: #fff; font-size: .7rem; line-height: 18px; }
  .hof-akte .sknopf { box-shadow: 0 3px 0 #c9b597; margin-top: 10px; background: #fff; }
  .post-leer { text-align: center; color: var(--leise); padding: 30px 0; }
  .post-leiste { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .9rem; color: var(--leise); }
  .post-leiste button { border: 0; background: none; color: var(--akzent); font: inherit; font-weight: 600; cursor: pointer; padding: 4px; }
  .brief .haken { width: 22px; height: 22px; flex: none; border: 2px solid #c9b597; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; }
  .brief.markiert { border-color: var(--akzent); background: #fff3e8; } .brief.markiert .haken { background: var(--akzent); border-color: var(--akzent); }
  .briefe { display: flex; flex-direction: column; gap: 6px; }
  .brief { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1.5px solid #e2d6c3; border-radius: 10px; padding: 9px 10px; background: #fff; font: inherit; color: var(--text); cursor: pointer; }
  .brief .ico { width: 30px; flex: none; }
  .brief .ico svg { width: 100%; display: block; }
  .brief .txt { flex: 1; min-width: 0; line-height: 1.3; }
  .brief .txt b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brief .txt small { color: var(--leise); font-size: .78rem; }
  .brief.neu { border-color: #e8c34a; background: #fffbe8; } .brief.neu .txt b { font-weight: 800; }
  .brief-papier { background: #fffdf6; border: 1px solid #e6dcc6; border-radius: 4px; padding: 18px 18px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.12); font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
  .brief-papier .kopf { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; color: var(--leise); margin-bottom: 10px; font-family: system-ui, sans-serif; }
  .brief-papier h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .brief-knoepfe { display: flex; gap: 8px; margin-top: 12px; } .brief-knoepfe .knopf { flex: 1; width: auto; padding: 11px; }
  #nacht { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(circle at 50% 40%, #2c3b6e, #0e1430); color: #fff; opacity: 0; pointer-events: none; transition: opacity .7s; }
  #nacht.an { opacity: 1; pointer-events: auto; }
  #nacht .gross { font-size: 3rem; }
  #nacht .klein { font-size: 1.2rem; font-weight: 700; }
  /* Umschalter Steckbrief / Pferdepflege */
  .modus { display: flex; background: #e4d3b4; border-radius: 12px; padding: 3px; margin-bottom: 8px; }
  .modus button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 9px; font: inherit; font-weight: 700; font-size: .92rem; color: #6b5440; cursor: pointer; }
  .modus button.an { background: var(--karte); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .liste { list-style: none; margin: 0; padding: 0; }
  .liste li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #efe4d2; font-size: .92rem; }
  .liste li:last-child { border-bottom: 0; }
  .liste .ico { font-size: 1.3rem; width: 28px; text-align: center; flex: none; }
  .liste .txt { flex: 1; line-height: 1.3; }
  .liste .txt small { display: block; color: var(--leise); font-size: .8rem; }
  .stat { flex: none; font-size: .78rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  .stat.ok { background: #e3f1dc; color: #2f6b22; }
  .stat.warn { background: #fbecd0; color: #93600f; }
  .stat.bad { background: #f8dcd6; color: #9b2c1c; }
  /* Kacheln (Ausrüstung / Platz) */
  .kacheln { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
  .kacheln.quadrat > .kachel { justify-content: center; padding: 8px 4px; min-height: 100px; }
  @media (min-width: 600px) { .kacheln.quadrat > .kachel { aspect-ratio: 1; } }
  .kacheln.klein { grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .kacheln.klein .kachel { padding: 4px 2px; } .kacheln.klein .kachel b { font-size: .56rem; overflow-wrap: anywhere; } .kacheln.klein .kachel small { font-size: .5rem; overflow-wrap: anywhere; }
  .kacheln.quadrat { grid-template-columns: repeat(4, minmax(0, 140px)); grid-auto-rows: 1fr; justify-content: center; gap: 14px; }

  .kachel { background: #fff; border: 2px solid #e2d6c3; border-radius: 12px; padding: 8px 4px 7px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .kachel .ico { font-size: 1.9rem; line-height: 1.1; }
  .kachel b { font-size: .74rem; line-height: 1.15; word-break: normal; overflow-wrap: normal; hyphens: manual; }
  .kachel small { font-size: .66rem; color: var(--leise); line-height: 1.2; }
  .kachel.fehlt { background: #f4f0ea; border-style: dashed; }
  button.kachel { font: inherit; color: inherit; cursor: default; }
  .kachel.klickbar { cursor: pointer; border-color: var(--akzent); box-shadow: 0 2px 0 #e7c4a3; }
  .kachel.klickbar:active { transform: translateY(1px); box-shadow: none; }
  .kachel.aktuell { border-color: #7aa95c; background: #f1f8ec; }
  .kachel .mini { width: 100%; height: auto; border-radius: 8px; background: #eaf5fb; }
  .kachel.fehlt .mini { filter: grayscale(1); opacity: .45; }
  .zurueck { margin-top: 10px; border: 0; background: none; color: var(--akzent); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 0; }
  .kachel.fehlt .ico { filter: grayscale(1); opacity: .35; }
  .kachel.fehlt b, .kachel.fehlt small { color: #a99a8a; }
  /* Genetik */
  .ahn { background: #fff; border: 2px solid #e2d6c3; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.25; }
  .ahn small { color: var(--leise); font-size: .74rem; }
  .ahn b { font-size: .95rem; }
  .ahn span { font-size: .8rem; color: var(--leise); }
  .ahn.ich { border-color: var(--akzent); background: #fdf0e4; margin-bottom: 10px; }

<script>
  // ---------- Spielzustand ----------
  const SPEICHER = "zuchtstall-v2";
  const NAMEN = {
    Stute: ["Schneeflocke", "Luna", "Bella", "Stella", "Fee", "Amira", "Freya", "Nala", "Kira", "Zora", "Dana", "Leonie", "Paula", "Sina", "Aurora", "Jasmin", "Wilma", "Elfe"],
    Hengst: ["Donnerhall", "Sturmwind", "Apollo", "Merlin", "Farid", "Orkan", "Balou", "Rocky", "Picasso", "Zeus", "Blitz", "Gandalf", "Samir", "Titan", "Odin"],
    Wallach: ["Max", "Moritz", "Jonny", "Charly", "Fritz", "Sammy", "Benny", "Lucky", "Pepe", "Bruno", "Oskar", "Theo", "Emil"],
  };
  const zufallAus = a => a[Math.floor(Math.random() * a.length)];

  let spiel = {
    geld: 1000,
    boxen: [{ nr: 1, pferd: { id: "start", name: "Schneeflocke", rasse: "araber", farbe: "schimmel", geschlecht: "Stute", alter: 5, stockmass: 150 } }],
  };
  let hatSpielstand = false;
  try { const s = JSON.parse(localStorage.getItem(SPEICHER)); if (s && s.boxen) { spiel = s; hatSpielstand = true; } } catch (e) {}
  if (!spiel.anlage) spiel.anlage = { stall: true, paddock: true, weide: false, waschplatz: false, roundpen: false, reitplatz: false, reithalle: false, gelaende: true, anhaenger: true };
  spiel.anlage.anhaenger = true;
  if (!spiel.ausruestung) spiel.ausruestung = { halfter: true, strick: true, putzkiste: true, sattel: false, trense: false, schabracke: false, decke: false, gamaschen: false, schere: true, medizin: true };
  if (spiel.ausruestung.medizin == null) spiel.ausruestung.medizin = true;
  if (spiel.ausruestung.schere == null) spiel.ausruestung.schere = true;
  if (spiel.ausruestung.futter == null) spiel.ausruestung.futter = true;
  spiel.boxen.forEach(b => { if (b.pferd && !b.pferd.werte) b.pferd.werte = erzeugeWerte(b.pferd); if (b.pferd && !b.pferd.pflege) b.pferd.pflege = erzeugePflege(b.pferd); if (b.pferd && b.pferd.maehneSeit == null) b.pferd.maehneSeit = spiel.tag || 1; if (b.pferd && b.pferd.schopfSeit == null) b.pferd.schopfSeit = b.pferd.maehneSeit; if (b.krippeVoll == null) b.krippeVoll = false; if (b.mistig == null) b.mistig = true; });
  if (!spiel.tag) spiel.tag = 1;
  // zweite Box (leer, sauber, Krippe voll)
  while (spiel.boxen.length < 1) spiel.boxen.push({ nr: spiel.boxen.length + 1, pferd: null, krippeVoll: false, mistig: false, mistStufe: 0 });
  spiel.boxen.forEach(b => { if (!b.pferd) { b.mistig = false; b.krippeVoll = false; b.tot = false; } });
  let aktBox = Math.min(spiel.aktBox || 0, spiel.boxen.length - 1);
  // ---------- Kalender: Jahreszeiten statt Tage (Start: Frühling 2000) ----------
  const JZ = [["Frühling", "🌱"], ["Sommer", "☀️"], ["Herbst", "🍂"], ["Winter", "❄️"]];
  const tpj = () => spiel.tempo || 4;                      // Tage pro Jahreszeit: 3 schnell, 4 standard, 5 langsam
  function datum(tag = spiel.tag || 1) { const i = Math.floor((tag - 1) / tpj()); return { s: i % 4, j: 2000 + Math.floor(i / 4), t: (tag - 1) % tpj() + 1 }; }
  const jj = j => String(((j % 100) + 100) % 100).padStart(2, "0");
  const datumText = (d = datum()) => `${JZ[d.s][0]} ${jj(d.j)}`;
  function sichereGeburt(p) {
    if (!p || p.geb) return;
    const d = datum(), s = Math.floor(zufall("geb-" + p.id)() * 4), a = p.alter != null ? p.alter : 5;
    p.geb = { s, j: d.j - a - (s > d.s ? 1 : 0) };        // so passt das gewählte Alter genau
  }
  function alterJZ(p) { sichereGeburt(p); const d = datum(); return (d.j * 4 + d.s) - (p.geb.j * 4 + p.geb.s); }
  const alterJahre = p => Math.floor(alterJZ(p) / 4);
  function alterText(p) { const z = alterJZ(p); if (z < 4) return `${z * 3} Monate`; const y = Math.floor(z / 4); return `${y} ${y === 1 ? "Jahr" : "Jahre"}`; }
  const ALTERSSTUFEN = [[6, "🍼 Fohlen", "wächst bei der Mutter auf"], [12, "🐴 Fohlen / Absetzer", "wird langsam selbstständiger"], [24, "🌱 Jährling", "Wachstum, noch kein Reitpferd"],
    [36, "🌱 Jungpferd", "körperliche Entwicklung, Ausbildung beginnt langsam"], [60, "🐎 Jungpferd", "Ausbildung und Einreiten"], [180, "🐎 Erwachsenes Pferd", "volle Leistungsphase"],
    [240, "🐎 Reifes Pferd", "weiterhin leistungsfähig, aber etwas älter"], [Infinity, "👴 Senior", "Alterserscheinungen nehmen langsam zu"]];
  const altersstufe = p => ALTERSSTUFEN.find(([m]) => alterJZ(p) * 3 < m);
  // Schlüssel für Körper/Kopf je Alter
  const stufeAusMonaten = m => m < 12 ? "fohlen" : m < 24 ? "jaehrling" : m < 60 ? "jungpferd" : m < 180 ? undefined : m < 240 ? "reif" : "senior";
  const stufeKey = p => stufeAusMonaten(alterJZ(p) * 3);
  // ---------- Schimmel: dunkel geboren, werden mit dem Alter heller ----------
  const GRAU = { schimmel: 1, apfelschimmel: 1, fliegenschimmel: 1 };
  function grundfarbe(p) {
    if (p.grundfarbe) return p.grundfarbe;

  function aktualisiere() {

    $("alterWert").innerHTML = wahl.alter + " <br>" + (wahl.alter === 1 ? "Jahr" : "Jahre");

    let lineal = `<line x1="0" x2="${VB.b}" y1="${VB.boden}" y2="${VB.boden}" stroke="#c9b99f" stroke-width="2"/>`;

      (wahl.stockmass !== wahl.zielStockmass ? `<text x="${VB.b - 8}" y="${wy - 18}" font-size="9" text-anchor="end" font-weight="600" fill="var(--akzent)" stroke="#fff" stroke-width="3" paint-order="stroke">erwachsen ${wahl.zielStockmass} cm</text>` : "");

    const z = zeichnePferd(wahl.rasse, fb(wahl, wahl.alter), { seed: wahl.id, geschlecht: wahl.geschlecht, alterStufe: stufeAusMonaten(wahl.alter * 12) });

    const z = zeichnePferd(p.rasse, fb(p), { seed: p.id, geschlecht: p.geschlecht, alterStufe: p.geb ? stufeKey(p) : undefined, maehne: p.maehne, schopf: p.schopf, statisch: 1 });
    const w = z.box.maxX - z.box.minX, h = -z.box.minY, m = Math.max(w, h) * 0.08;
    return `<svg viewBox="${(z.box.minX - m).toFixed(1)} ${(z.box.minY - m).toFixed(1)} ${(w + 2 * m).toFixed(1)} ${(h + 2 * m).toFixed(1)}" preserveAspectRatio="xMidYMid meet">${ohneAnim(z.svg)}</svg>`;
  }
  function zeigeGnadenhof() {
    const g = spiel.gnadenhof || [];
    zeigeNeben("🌳 Gnadenhof", g.length ? `<div class="panel"><p style="margin:0">Hier verbringen deine Pferde ihren Lebensabend auf der Weide. Du kannst sie besuchen, aber nichts mehr mit ihnen machen.</p></div>
      <div class="gnade-liste">${g.map(e => { const p = e.pferd; return `<div class="gnade-pferd"><div class="gnade-weide">${ganzBild(p)}</div>
        <div class="gnade-info"><b>${esc(p.name)}</b><small>${rasseById(p.rasse).name} · ${p.geschlecht} · ${alterText(p)}</small><small>auf dem Gnadenhof seit ${jzName(e.seit).replace(/^\S+ /, "")}</small></div></div>`; }).join("")}</div>`
      : `<div class="panel"><p style="margin:0">Auf dem Gnadenhof ist noch kein Pferd. Ein Pferd kannst du in der Pferdeakte unter Pflege → Ort → Pferdeanhänger → Abgeben → Gnadenhof hierher geben. Du bekommst dafür den halben Marktwert.</p></div>`);
  }
  function zeigeMarkt() {
    const jetzt = jzJetzt(), ts = (spiel.tierschutz || []).filter(t => jetzt < t.frist);
    const liste = ts.length ? `<div class="ts-liste">${ts.map((t, i) => {
      const p = t.pferd;
      return `<div class="ts-pferd">${ganzBild(p)}
        <div class="ts-info"><b>${esc(p.name)}</b><small>${p.geschlecht === "Stute" ? "Stutfohlen" : "Hengstfohlen"} · ${rasseById(p.rasse).name} · ${alterText(p)} · Mutter: ${esc(p.mutter || "–")}</small>
          <small>noch bis Ende ${jzName(t.frist - 1).replace(/^\S+ /, "")} zurückzukaufen</small></div>
        <button class="knopf" data-ts="${i}">Zurückkaufen<br>${fmt(t.preis)}</button></div>`;
    }).join("")}</div>` : `<p style="margin:6px 0 0">Zurzeit sind keine Pferde beim Tierschutz.</p>`;
    const eigene = (spiel.angebote || []).map(a => ({ a, x: spiel.boxen.findIndex(b => b.pferd && b.pferd.id === a.id) })).filter(e => e.x >= 0);
    const angebotListe = eigene.length ? `<div class="ts-liste">${eigene.map(({ a, x }) => { const p = spiel.boxen[x].pferd;
      return `<div class="ts-pferd">${ganzBild(p)}<div class="ts-info"><b>${esc(p.name)}</b><small>${rasseById(p.rasse).name} · ${alterText(p)} · Box ${x + 1}</small>
        <small>${a.art === "auktion" ? `🔨 Auktion · Höchstgebot ${fmt(a.gebot)}` : `🏷️ Festpreis ${fmt(a.preis)}`} · bis Ende ${jzName(a.ende - 1).replace(/^\S+ /, "")}</small></div></div>`; }).join("")}</div>`
      : `<p style="margin:6px 0 0">Du bietest gerade kein Pferd an. Verkaufen kannst du in der Pferdeakte unter Pflege → Ort → Pferdeanhänger → Abgeben.</p>`;
    zeigeNeben("🏷️ Pferdemarkt", `<div class="panel"><p style="margin:0">Hier kannst du bald Pferde kaufen. Deine eigenen Pferde verkaufst du über den Pferdeanhänger.</p></div>
      <div class="panel" style="margin-top:14px"><b>💰 Deine Angebote</b>${angebotListe}</div>
      <div class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>🐾 Tierschutzpferde</b><span>Dein Geld: ${fmt(spiel.geld || 0)}</span></div>${liste}</div>`);
    document.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => {
      const t = ts[+b.dataset.ts], frei = freieBox();
      if (frei < 0) { dialog(`<h3>Keine Box frei</h3><p>Für ${esc(t.pferd.name)} brauchst du eine freie Box. In der Hofverwaltung kannst du mit + eine neue bauen.</p>`); return; }
      if ((spiel.geld || 0) < t.preis) { dialog(`<h3>Nicht genug Geld</h3><p>Du brauchst ${fmt(t.preis)}, hast aber nur ${fmt(spiel.geld || 0)}.</p>`); return; }
      dialog(`<h3>🐾 Zurückkaufen</h3><p><b>${esc(t.pferd.name)}</b> für ${fmt(t.preis)} vom Tierschutz zurückkaufen? Es kommt in Box ${frei + 1}.</p>`, [["Zurückkaufen", () => {
        spiel.geld -= t.preis;
        spiel.tierschutz = spiel.tierschutz.filter(x => x !== t);
        const nb = spiel.boxen[frei];
        nb.pferd = { ...t.pferd, pflege: t.pferd.pflege || erzeugePflege(t.pferd), maehneSeit: spiel.tag, schopfSeit: spiel.tag };
        nb.krippeVoll = false; nb.mistig = false; nb.mistStufe = 0; nb.tot = false;
        alterAktualisieren(); speichern(); zeigeMarkt();
        dialog(`<h3>🏠 Willkommen zurück!</h3><p>${esc(t.pferd.name)} steht jetzt in Box ${frei + 1}.</p>`);
      }], ["Abbrechen", null, "zweit"]]);
    });
  }
  function zeigeNeben(titel, inhalt) {
    $("nebenSchirm").innerHTML = `<div class="schirm-innen"><button class="zurueck-s" id="nbZurueck">‹ Hauptmenü</button><h1>${titel}</h1>${inhalt}</div>`;
    zeigeSchirm("nebenSchirm");
    $("nbZurueck").onclick = zeigeHaupt;
  }
  let hofReiter = "hof", offenerBrief = null, postAuswahl = null;   // postAuswahl: Set der markierten Briefe (Mehrfachauswahl) oder null
  const BRIEF_SVG = (offen) => offen
    ? `<svg viewBox="0 0 40 34"><path d="M2,14 L20,2 L38,14 V32 H2 Z" fill="#f3ead6" stroke="#8a7a66" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="7" width="24" height="16" fill="#fff" stroke="#c9bba3"/><path d="M2,14 L20,26 L38,14" fill="none" stroke="#8a7a66" stroke-width="2"/></svg>`
    : `<svg viewBox="0 0 40 30"><rect x="1.5" y="3" width="37" height="25" rx="3" fill="#ffd84a" stroke="#8a6512" stroke-width="2"/><path d="M2.5,5 L20,18 L37.5,5" fill="none" stroke="#8a6512" stroke-width="2" stroke-linejoin="round"/></svg>`;
  const briefDatum = b => `${jzName(b.jz).replace(/^\S+ /, "")} · Tag ${((b.tag - 1) % tpj()) + 1}`;
  function zeigeHof(reiter) {
    if (reiter) hofReiter = reiter;
    if (hofReiter !== "post") { offenerBrief = null; postAuswahl = null; }
    const sp = spiel.spieler || {}, post = spiel.post || (spiel.post = []), n = ungelesen();
    const reiterListe = [["hof", "Hof"], ["boxen", "Boxen"], ["post", "Postfach"], ["einst", "Einstellungen"]];
    let inhalt = "";
    if (hofReiter === "hof") {
      inhalt = `<dl class="werte">
        <dt>Hof</dt><dd class="hf-edit" id="hfHof" title="antippen zum Ändern">${esc(hofName())} <span class="stift">✏️</span></dd>
        <dt>Besitzer</dt><dd class="hf-edit" id="hfSpieler" title="antippen zum Ändern">${sp.avatar || ""} ${esc(sp.name || "–")} <span class="stift">✏️</span></dd>
        <dt>Datum</dt><dd>${JZ[datum().s][1]} ${datumLang()} · Tag ${datum().t}/${tpj()}</dd>
        <dt>Spieltempo</dt><dd>${({ 3: "schnell", 4: "standard", 5: "langsam" })[tpj()]} (${tpj()} Tage pro Jahreszeit)</dd>
        <dt>Pferde</dt><dd>${spiel.boxen.filter(b => b.pferd).length} in ${spiel.boxen.length} ${spiel.boxen.length === 1 ? "Box" : "Boxen"}${spiel.boxen.some(b => b.fohlen) ? ` · ${spiel.boxen.filter(b => b.fohlen).length} Fohlen bei der Mutter` : ""}</dd>
        <dt>Geld</dt><dd>${fmt(spiel.geld || 0)}</dd></dl>`;
    } else if (hofReiter === "boxen") {
      inhalt = `<div class="hf-kopf"><b>Boxen (${spiel.boxen.length})</b><button class="hf-plus" id="hfPlus" aria-label="Box hinzufügen">+</button></div>` +
        spiel.boxen.map((b, i) => `<div class="hf-box"><span>Box ${i + 1}: <b>${b.pferd ? esc(b.pferd.name) : "leer"}</b>${b.fohlen ? ` <small>+ Fohlen ${esc(b.fohlen.name)}</small>` : ""}</span>${i > 0 ? `<button class="hf-minus" data-weg="${i}" ${b.pferd ? "disabled title=\"Box ist belegt\"" : ""} aria-label="Box ${i + 1} entfernen">−</button>` : ""}</div>`).join("");
    } else if (hofReiter === "einst") {
      inhalt = `<button class="sknopf" id="hfSpar" style="margin-top:0"><span class="i">🔋</span><span>Sparmodus ist ${spiel.sparmodus ? "an" : "aus"}<small>keine Animationen – schont den Akku</small></span></button>
        <button class="sknopf" id="hfVoll"><span class="i">⛶</span><span>Vollbildmodus ist ${istVoll() ? "an" : "aus"}<small>antippen zum Umschalten</small></span></button>`;
    } else {
      const br = offenerBrief && post.find(b => b.id === offenerBrief);
      if (br) {
        const spName = (spiel.spieler && spiel.spieler.name) || "Pferdefreund";
        const anrede = br.von === "Tierschutzverein" ? `Guten Tag ${esc(spName)},` : `Hallo ${esc(spName)},`;
        const text = br.von === "Tierschutzverein" || br.betreff === "Neuigkeit" ? br.text : br.text + `<br><br>Viele Grüße<br>${({ Gnadenhof: "Dein Gnadenhof", Pferdemarkt: "Dein Pferdemarkt", Auktionshaus: "Dein Auktionshaus" })[br.von] || "Deine " + br.von}`;
        inhalt = `<div class="brief-papier"><div class="kopf"><span>Von: <b>${esc(br.von)}</b><br>An: <b>${esc(spName)}</b>, ${esc(hofName())}</span><span>${briefDatum(br)}</span></div>
          <h3>${esc(br.betreff)}</h3><p>${anrede}</p><div>${text}</div></div>
          <div class="brief-knoepfe"><button class="knopf zweit" id="briefZurueck">‹ Postfach</button><button class="knopf rot" id="briefWeg">🗑️ Löschen</button></div>`;
      } else if (!post.length) inhalt = `<div class="post-leer">${BRIEF_SVG(true).replace("<svg", '<svg width="60"')}<br>Dein Postfach ist leer.</div>`;
      else if (postAuswahl) inhalt = `<div class="post-leiste"><span>${postAuswahl.size} von ${post.length} markiert</span><span><button id="postAlle">${postAuswahl.size === post.length ? "Keine" : "Alle"} markieren</button></span></div>
        <div class="briefe">${post.map(b => `<button class="brief auswahl ${postAuswahl.has(b.id) ? "markiert" : ""} ${b.gelesen ? "" : "neu"}" data-mark="${b.id}"><span class="haken">${postAuswahl.has(b.id) ? "✓" : ""}</span><span class="ico">${BRIEF_SVG(b.gelesen)}</span>
          <span class="txt"><b>${esc(b.betreff)}</b><small>${esc(b.von)} · ${briefDatum(b)}</small></span></button>`).join("")}</div>
        <div class="brief-knoepfe"><button class="knopf zweit" id="postFertig">Fertig</button><button class="knopf rot ${postAuswahl.size ? "" : "aus"}" id="postWeg">🗑️ ${postAuswahl.size || ""} Löschen</button></div>`;
      else inhalt = `<div class="post-leiste"><span>${post.length} ${post.length === 1 ? "Brief" : "Briefe"}${n ? ` · ${n} ungelesen` : ""}</span><span>${n ? `<button id="alleGelesen">Alle gelesen</button>` : ""}<button id="postWaehlen">Auswählen</button></span></div>
        <div class="briefe">${post.map(b => `<button class="brief ${b.gelesen ? "" : "neu"}" data-brief="${b.id}"><span class="ico">${BRIEF_SVG(b.gelesen)}</span>
          <span class="txt"><b>${esc(b.betreff)}</b><small>${esc(b.von)} · ${briefDatum(b)}</small></span></button>`).join("")}</div>`;
    }
    zeigeNeben("📋 Hofverwaltung", `<div class="akte hof-akte">
      <div class="reiter" role="tablist">${reiterListe.map(([id, t]) => `<button role="tab" data-hr="${id}" class="${hofReiter === id ? "an" : ""}" aria-selected="${hofReiter === id}">${t}${id === "post" && n ? `<span class="anz">${n}</span>` : ""}</button>`).join("")}</div>
      <div class="karte" role="tabpanel">${inhalt}</div></div>`);
    const nb = $("nebenSchirm");
    nb.querySelectorAll("[data-hr]").forEach(b => b.onclick = () => { offenerBrief = null; zeigeHof(b.dataset.hr); });
    const bearbeite = (id, wert, setzen) => {
      const dd = $(id); dd.onclick = null;
      dd.innerHTML = `<input maxlength="30" value="${esc(wert)}">`;
      const inp = dd.querySelector("input"); inp.focus(); inp.select();
      const fertig = () => { const v = inp.value.trim(); if (v) setzen(v); speichern(); titelSetzen(); zeigeHof(); };
      inp.onblur = fertig; inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.value = wert; inp.blur(); } };
    };
    const sp2 = () => (spiel.spieler = spiel.spieler || { name: "", avatar: "🧑‍🌾" });
    if ($("hfHof")) $("hfHof").onclick = () => bearbeite("hfHof", hofName(), v => sp2().hof = v);
    if ($("hfSpieler")) $("hfSpieler").onclick = () => bearbeite("hfSpieler", sp.name || "", v => sp2().name = v);
    if ($("hfPlus")) $("hfPlus").onclick = () => { spiel.boxen.push({ nr: spiel.boxen.length + 1, pferd: null, krippeVoll: false, mistig: false, mistStufe: 0, tot: false }); speichern(); zeigeHof(); };
    nb.querySelectorAll("[data-weg]").forEach(b => b.onclick = () => {
      const i = +b.dataset.weg; if (i === 0 || spiel.boxen[i].pferd) return;
      spiel.boxen.splice(i, 1); spiel.boxen.forEach((x, k) => x.nr = k + 1);
      if (aktBox >= spiel.boxen.length) aktBox = spiel.boxen.length - 1; spiel.aktBox = aktBox;
      speichern(); zeigeHof();
    });
    if ($("hfSpar")) $("hfSpar").onclick = () => { $("mSpar").click(); zeigeHof(); };
    if ($("hfVoll")) $("hfVoll").onclick = () => { vollbildUmschalten(); setTimeout(zeigeHof, 300); };
    nb.querySelectorAll("[data-brief]").forEach(b => b.onclick = () => {
      const br = post.find(x => x.id === b.dataset.brief); if (!br) return;
      br.gelesen = true; offenerBrief = br.id; speichern(); postIconSetzen(); zeigeHof(); nb.scrollTop = 0;
    });
    if ($("postWaehlen")) $("postWaehlen").onclick = () => { postAuswahl = new Set(); zeigeHof(); };
    if ($("postFertig")) $("postFertig").onclick = () => { postAuswahl = null; zeigeHof(); };
    if ($("postAlle")) $("postAlle").onclick = () => { postAuswahl = postAuswahl.size === post.length ? new Set() : new Set(post.map(b => b.id)); zeigeHof(); };
    nb.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => { const id = b.dataset.mark; postAuswahl.has(id) ? postAuswahl.delete(id) : postAuswahl.add(id); zeigeHof(); });
    if ($("postWeg")) $("postWeg").onclick = () => {
      if (!postAuswahl.size) return;
      const anz = postAuswahl.size;
      dialog(`<h3>🗑️ Briefe löschen</h3><p>${anz === 1 ? "Den markierten Brief" : `Die ${anz} markierten Briefe`} wirklich löschen?</p>`, [["Löschen", () => {
        spiel.post = spiel.post.filter(x => !postAuswahl.has(x.id)); postAuswahl = null; speichern(); postIconSetzen(); zeigeHof();
      }, "rot"], ["Abbrechen", null, "zweit"]]);
    };
    if ($("alleGelesen")) $("alleGelesen").onclick = () => { post.forEach(b => b.gelesen = true); speichern(); postIconSetzen(); zeigeHof(); };
    if ($("briefZurueck")) $("briefZurueck").onclick = () => { offenerBrief = null; zeigeHof(); };
    if ($("briefWeg")) $("briefWeg").onclick = () => { spiel.post = post.filter(x => x.id !== offenerBrief); offenerBrief = null; speichern(); postIconSetzen(); zeigeHof(); };
  }
  // gelber Brief oben rechts: öffnet das Postfach
  $("postIcon").onclick = () => {
    if ($("auswahl").classList.contains("offen")) schliessen();
    $("dlg").hidden = true; menueZu();
    zeigeHof("post");
  };
  // alte Neuigkeiten-Meldungen in Briefe umwandeln
  if (spiel.meldungen && spiel.meldungen.length) { spiel.meldungen.reverse().forEach(m => brief("Hofverwaltung", "Neuigkeit", m)); delete spiel.meldungen; speichern(); }
  setInterval(postIconSetzen, 600);
  window.addEventListener("resize", postIconSetzen);
  $("mHaupt").onclick = () => { menueZu(); zeigeHaupt(); };
  $("mPost").onclick = () => { menueZu(); zeigeHof("post"); };
  titelSetzen();
  zeigeStart();
</script>
</body>
</html>
