        spiel.post = spiel.post.filter(x => !postAuswahl.has(x.id)); postAuswahl = null; speichern(); postIconSetzen(); zeigeHof();
      }, "rot"], ["Abbrechen", null, "zweit"]]);
    };
    if ($("alleGelesen")) $("alleGelesen").onclick = () => { post.forEach(b => b.gelesen = true); speichern(); postIconSetzen(); zeigeHof(); };
    if ($("briefZurueck")) $("briefZurueck").onclick = () => { offenerBrief = null; zeigeHof(); };
    const hbGehe = d => { const i = post.findIndex(b => b.id === offenerBrief), n = post[i + d]; if (!n) return; n.gelesen = true; offenerBrief = n.id; speichern(); postIconSetzen(); zeigeHof(); nb.scrollTop = 0; };
    if ($("hbVor")) $("hbVor").onclick = () => hbGehe(-1);
    if ($("hbNach")) $("hbNach").onclick = () => hbGehe(1);
    briefAktionenBinden(() => zeigeHof());
    sternBinden(nb, () => zeigeHof());
    nb.querySelectorAll("[data-ordner]").forEach(b => b.onclick = () => { postOrdner = b.dataset.ordner; postAuswahl = null; zeigeHof(); });
    if ($("istSpam")) $("istSpam").onclick = () => { const br = allePost.find(x => x.id === offenerBrief), [, typ, label] = briefTyp(br.betreff);
      dialog(`<h3>🚫 Als Spam markieren?</h3><p>Alle Briefe zum Ereignis <b>„${label}“</b> kommen dann in den Spamordner – auch künftige. Sie lösen keine Benachrichtigung mehr aus und werden nach einem Jahr gelöscht.</p>`,
        [["Als Spam markieren", () => { spamSetzen(typ, true); offenerBrief = null; zeigeHof(); }], ["Abbrechen", null, "zweit"]]); };
    if ($("keinSpam")) $("keinSpam").onclick = () => { const br = allePost.find(x => x.id === offenerBrief); spamSetzen(briefTyp(br.betreff)[1], false); offenerBrief = null; postOrdner = "eingang"; zeigeHof(); };
    if ($("briefWeg")) $("briefWeg").onclick = () => { spiel.post = allePost.filter(x => x.id !== offenerBrief); offenerBrief = null; speichern(); postIconSetzen(); zeigeHof(); };
  }
  // Knöpfe im Brief: „Du“ annehmen, erneut bieten …
  function briefAktionHTML(br) {
    const A = br.aktion;
    if (A.typ === "duzen") return A.antwort ? `<p class="brief-aktion-info">${A.antwort === "ja" ? "🤝 Du hast das „Du“ angenommen." : "Sie bleiben beim „Sie“."}</p>`
      : `<div class="brief-aktion"><button class="knopf" data-baktion="du-ja" data-bid="${br.id}">🤝 Gerne, Du</button><button class="knopf zweit" data-baktion="du-nein" data-bid="${br.id}">Lieber beim „Sie“ bleiben</button></div>`;
    if (A.typ === "kaufangebot") { const a = (spiel.angebote || []).find(y => y.id === A.pferd && y.vorschlag && y.vorschlag.id === A.vid);
      if (A.antwort) return `<p class="brief-aktion-info">${A.antwort === "ja" ? "✅ Angenommen – verkauft." : "Abgelehnt."}</p>`;
      return a ? `<div class="brief-aktion"><button class="knopf" data-baktion="kauf-ja" data-bid="${br.id}">✅ Annehmen · ${fmt(A.betrag)}</button><button class="knopf zweit" data-baktion="kauf-nein" data-bid="${br.id}">Ablehnen</button></div>` : `<p class="brief-aktion-info">Dieser Vorschlag gilt nicht mehr.</p>`; }
    if (A.typ === "rechnung") { const r = (spiel.rechnungen || []).find(x => x.id === A.rid), st = (spiel.rechnungStatus || {})[A.rid];
      if (r) return `<div class="brief-aktion"><button class="knopf" data-baktion="zahlen" data-bid="${br.id}">💶 Jetzt bezahlen · ${fmt(r.betrag)}</button></div>`;
      return `<p class="brief-aktion-info">${st === "bezahlt" ? "✅ Bezahlt." : st === "abgebucht" ? "🏦 Wurde vom Konto abgebucht." : "⚠️ Diese Rechnung ist ungültig – sie wurde durch eine neuere Rechnung ersetzt."}</p>`; }
    if (A.typ === "kredit") { const k = kredite().find(x => x.id === A.kid);
      return k && (k.offen || []).length ? `<div class="brief-aktion"><button class="knopf" data-baktion="kredit" data-bid="${br.id}">💶 Offene Raten bezahlen · ${fmt(offenSumme(k))}</button></div>` : `<p class="brief-aktion-info">✅ Bezahlt.</p>`; }
    if (A.typ === "befund") { const x = alleEigenenPferde().find(y => y.p.id === A.pid), b = x && befundListe(x.p).find(y => y.id === A.bid), bi = x ? spiel.boxen.findIndex(y => y.pferd === x.p) : -1;
      if (!b) return `<p class="brief-aktion-info">✅ Das hat sich erledigt.</p>`;
      const tipp = !b.diagnose && b.meldungen.find(m => m.tipp && m.von !== "du");
      return `<div class="brief-aktion">${bi >= 0 ? `<button class="knopf" data-baktion="bf-box" data-bid="${br.id}">🔍 Zum Pferd (Versorgung)</button>` : ""}${bi >= 0 && !x.p.klinik ? `<button class="knopf zweit" data-baktion="bf-ta" data-bid="${br.id}">🩺 Tierarzt rufen · ${fmt(TIERARZT_BESUCH)} + Behandlung</button>` : ""}${tipp && !(b.vermutung && b.vermutung.von === tipp.von) ? `<button class="knopf zweit" data-baktion="bf-vertrau" data-bid="${br.id}">👍 ${esc(tipp.von)} vertrauen (${KRANK[tipp.tipp].n})</button>` : ""}</div>${b.vermutung ? `<p class="brief-aktion-info">Deine Annahme: ${KRANK[b.vermutung.art].n}</p>` : ""}`; }
    if (A.typ === "azubi") { const z = (spiel.mitarbeiter || []).find(x => x.id === A.ma);
      if (A.antwort || !z || z.typ !== "azubi") return `<p class="brief-aktion-info">${A.antwort === "ja" || (z && z.typ !== "azubi") ? "✅ Übernommen." : "👋 Verabschiedet."}</p>`;
      const Z = MA_TYP[FACH[z.fach].ziel];
      return `<div class="brief-aktion"><button class="knopf" data-baktion="azubi-ja" data-bid="${br.id}">✅ Übernehmen · ${fmt(Z.gehalt)} pro Jahreszeit</button><button class="knopf zweit" data-baktion="azubi-nein" data-bid="${br.id}">👋 Gehen lassen</button></div>`; }
    if (A.typ === "urlaub") { const m = (spiel.mitarbeiter || []).find(x => x.id === A.ma), u = m && m.urlaub;
      if (!u || A.antwort || u.ok != null) return `<p class="brief-aktion-info">${(A.antwort || (u && u.ok ? "ja" : "nein")) === "ja" ? "✅ Urlaub genehmigt." : "❌ Urlaub abgelehnt."}</p>`;
      return `<div class="brief-aktion"><button class="knopf" data-baktion="urlaub-ja" data-bid="${br.id}">✅ Genehmigen</button><button class="knopf zweit" data-baktion="urlaub-nein" data-bid="${br.id}">Ablehnen</button></div>`; }
    if (A.typ === "bieten") { const a = auktionFinden(A.pferd);
      if (a && !a.vorbei && spiel.markt.jz === jzJetzt() && a.fuehrt === "du") return `<p class="brief-aktion-info">✅ Du führst wieder – dein Höchstgebot: ${fmt(a.duMax || a.gebot)}.</p>`;
      return a && !a.vorbei && spiel.markt.jz === jzJetzt() ? `<div class="brief-aktion"><button class="knopf" data-baktion="bieten" data-bid="${br.id}">🔨 Erneut bieten</button></div>` : ""; }
    return "";
  }
  function briefAktionenBinden(nachher) {
    document.querySelectorAll("[data-baktion]").forEach(b => b.onclick = ev => { ev.stopPropagation();
      const br = (spiel.post || []).find(x => x.id === b.dataset.bid); if (!br) return; const A = br.aktion;
      const hid = br.hid && br.hid !== aktivHid() && hofVon(br.hid) ? br.hid : null;
      if (hid && ["bf-box", "bf-ta"].includes(b.dataset.baktion)) hofWechseln(hid);   // zum Pferd: auf dessen Hof wechseln
      if (hid && hid !== aktivHid()) { imHof(hid, () => briefAktionAus(b, br, A, nachher)); return; }
      briefAktionAus(b, br, A, nachher);
    });
  }
  function briefAktionAus(b, br, A, nachher) {
      if (b.dataset.baktion === "du-ja" || b.dataset.baktion === "du-nein") { (spiel.duzen = spiel.duzen || {})[br.von] = b.dataset.baktion === "du-ja"; ruf(br.von, b.dataset.baktion === "du-ja" ? 5 : -5); A.antwort = b.dataset.baktion === "du-ja" ? "ja" : "nein"; speichern(); nachher(); }
      else if (b.dataset.baktion === "kauf-ja" || b.dataset.baktion === "kauf-nein") {
        const a = (spiel.angebote || []).find(y => y.id === A.pferd && y.vorschlag && y.vorschlag.id === A.vid); if (!a) { nachher(); return; }
        if (b.dataset.baktion === "kauf-ja") { A.antwort = "ja"; angebotVerkaufen(a, A.betrag); } else { A.antwort = "nein"; ruf(br.von, -5); a.vorschlag = null; a.abgelehnt = (a.abgelehnt || 0) + 1; }
        speichern(); postIconSetzen(); nachher(); }
      else if (b.dataset.baktion === "zahlen") rechnungZahlen(A.rid, nachher);
      else if (b.dataset.baktion === "kredit") kreditOffenZahlen(A.kid, nachher);
      else if (b.dataset.baktion.startsWith("bf-")) { const x = alleEigenenPferde().find(y => y.p.id === A.pid), bf = x && befundListe(x.p).find(y => y.id === A.bid), bi = x ? spiel.boxen.findIndex(y => y.pferd === x.p) : -1; if (!bf) { nachher(); return; }
        if (b.dataset.baktion === "bf-vertrau") { const t = bf.meldungen.find(m => m.tipp && m.von !== "du"); bf.vermutung = { art: t.tipp, von: t.von }; speichern(); nachher(); }
        else if (b.dataset.baktion === "bf-ta" && bi >= 0) { $("dlg").hidden = true; tierarztBesuch(x.p, spiel.boxen[bi], nachher); }
        else if (b.dataset.baktion === "bf-box" && bi >= 0) { $("dlg").hidden = true; aktBox = bi; spiel.aktBox = bi; aktenModus = "pflege"; aktenReiter = "gesundheit"; deckModus = false; ortModus = null; medModus = false; putzModus = false; scherModus = false; meldung = ""; zeigeSchirm(null); window.scrollTo(0, 0); } }
      else if (b.dataset.baktion === "azubi-ja" || b.dataset.baktion === "azubi-nein") { const z = (spiel.mitarbeiter || []).find(x => x.id === A.ma); if (!z) { nachher(); return; }
        if (b.dataset.baktion === "azubi-ja") { azubiUebernehmen(z); A.antwort = "ja"; zufrAendern(z, 10); } else { A.antwort = "nein"; z.bis = jzJetzt(); }
        speichern(); nachher(); }
      else if (b.dataset.baktion === "urlaub-ja" || b.dataset.baktion === "urlaub-nein") { const m = (spiel.mitarbeiter || []).find(x => x.id === A.ma), ja = b.dataset.baktion === "urlaub-ja";
        A.antwort = ja ? "ja" : "nein"; if (m && m.urlaub && m.urlaub.ok == null) { m.urlaub.ok = ja; zufrAendern(m, ja ? 5 : -15); } speichern(); nachher(); }
      else if (b.dataset.baktion === "bieten") { const a = auktionFinden(A.pferd); if (a) { $("dlg").hidden = true; bieten(a, nachher); } }
  }
  // Brief als Papier (Postfach und Brief-Fenster)
  // Stern: wichtige Briefe markieren (in der Liste als span im Brief-Knopf, auf dem Briefpapier als Knopf)
  const sternKnopf = (b, tag) => `<${tag} class="brief-stern ${b.stern ? "an" : ""}" data-stern="${b.id}" role="button" tabindex="0" title="${b.stern ? "Markierung entfernen" : "Als wichtig markieren"}" aria-label="${b.stern ? "Markierung entfernen" : "Als wichtig markieren"}">${b.stern ? "★" : "☆"}</${tag}>`;
  function sternBinden(root, danach) {
    root.querySelectorAll("[data-stern]").forEach(el => el.onclick = e => { e.stopPropagation(); e.preventDefault();
      const b = (spiel.post || []).find(x => x.id === el.dataset.stern); if (!b) return;
      b.stern = !b.stern; speichern(); danach(); });
  }
  function briefPapier(br) {
    const spName = (spiel.spieler && spiel.spieler.name) || "Pferdefreund";
    const alt = br.du === undefined, du = alt ? br.von !== "Tierschutzverein" : br.du;   // alte Briefe: wie damals geschrieben
    const anrede = du ? `Hallo ${esc(spName)},` : `Guten Tag ${esc(spName)},`;
    const weiblich = ["Tierarztpraxis", "Hofverwaltung", "Aufzuchtstation"].includes(br.von);
    const gruss = br.betreff === "Neuigkeit" || (alt && br.von === "Tierschutzverein") ? "" : du ? `<br><br>Viele Grüße<br>${weiblich ? "Deine" : "Dein"} ${br.von}` : `<br><br>Mit freundlichen Grüßen<br>${weiblich ? "Ihre" : "Ihr"} ${br.von}`;
    const akt = br.aktion ? (br.hid && br.hid !== aktivHid() && hofVon(br.hid) ? imHof(br.hid, () => briefAktionHTML(br)) : briefAktionHTML(br)) : "";   // Brief eines anderen Hofs: dessen Rechnungen, Pferde, Mitarbeiter
    return `<div class="brief-papier"><div class="kopf"><span>Von: <b>${esc(br.von)}</b><br>An: <b>${esc(spName)}</b>, ${esc(br.hid && hofVon(br.hid) ? hofNameVon(br.hid) : br.hofName || hofName())}</span><span>${briefDatum(br)}</span></div>
          <h3>${br.spam ? "" : sternKnopf(br, "button")}${esc(br.betreff)}</h3><p>${anrede}</p><div>${briefMitLinks(br, br.text)}${gruss}</div>${akt}</div>`;
  }
  // gelber Brief oben rechts: öffnet nur den Brief – danach ist man wieder dort, wo man war; mit Pfeilen zum nächsten Brief
  // nur: Liste von Brief-IDs (über die Benachrichtigung geöffnet → nur die beim Öffnen ungelesenen Briefe)
  function briefFenster(id, nur) {
    const liste = (spiel.post || []).filter(b => !b.spam && (!nur || nur.includes(b.id))); if (!liste.length) return;
    let i = id ? liste.findIndex(b => b.id === id) : liste.findIndex(b => !b.gelesen); if (i < 0) i = 0;
    const br = liste[i]; br.gelesen = true; speichern(); postIconSetzen();
    const neu = liste.filter(b => !b.gelesen).length;
    dialog(`<div class="brief-nav"><button class="knopf zweit" id="bfVor" ${i <= 0 ? "disabled" : ""} aria-label="Neuerer Brief">‹</button><span>${nur ? "Neuer Brief" : "Brief"} ${i + 1} von ${liste.length}${neu ? ` · ${neu} ungelesen` : ""}</span><button class="knopf zweit" id="bfNach" ${i >= liste.length - 1 ? "disabled" : ""} aria-label="Älterer Brief">›</button></div>${briefPapier(br)}`,
      [["🚫 Spam", () => { const [, typ, label] = briefTyp(br.betreff);
         dialog(`<h3>🚫 Als Spam markieren?</h3><p>Alle Briefe zum Ereignis <b>„${label}“</b> kommen dann in den Spamordner – auch künftige. Sie lösen keine Benachrichtigung mehr aus und werden nach einem Jahr gelöscht.</p>`,
           [["Als Spam markieren", () => { spamSetzen(typ, true); const rest = (spiel.post || []).filter(b => !b.spam && (!nur || nur.includes(b.id))); if (rest.length) briefFenster((rest[i] || rest[rest.length - 1]).id, nur); }], ["Abbrechen", () => briefFenster(br.id, nur), "zweit"]]); }, "zweit"],
       ["🗑️ Löschen", () => { spiel.post = spiel.post.filter(x => x !== br); speichern(); postIconSetzen(); const n = liste[i + 1] || liste[i - 1]; if (n) briefFenster(n.id, nur); }, "rot"],
       ["Schließen", null, "zweit"]], "breit");
    briefAktionenBinden(() => briefFenster(br.id, nur));
    sternBinden(document, () => briefFenster(br.id, nur));
    $("bfVor").onclick = () => briefFenster(liste[i - 1].id, nur);
    $("bfNach").onclick = () => briefFenster(liste[i + 1].id, nur);
  }
  $("postIcon").onclick = () => { menueZu(); const neu = (spiel.post || []).filter(b => !b.spam && !b.gelesen && !fremderBrief(b)).map(b => b.id); briefFenster(null, neu.length ? neu : null); };
  $("postIconRot").onclick = () => { menueZu(); const neu = ungelesenFremd().map(b => b.id); if (neu.length) briefFenster(null, neu); };
  // Boxschild im Stall antippen: zurück zur Boxenübersicht
  $("boxSchildKnopf").onclick = e => { e.stopPropagation(); zeigeBoxen(); };
  // alte Neuigkeiten-Meldungen in Briefe umwandeln
  if (spiel.meldungen && spiel.meldungen.length) { spiel.meldungen.reverse().forEach(m => brief("Hofverwaltung", "Neuigkeit", m)); delete spiel.meldungen; speichern(); }
  setInterval(postIconSetzen, 600);
  window.addEventListener("resize", postIconSetzen);
  $("mHaupt").onclick = () => { menueZu(); zeigeHaupt(); };
  $("mPost").onclick = () => { menueZu(); zeigeHof("post"); };
  titelSetzen();
  if (spiel.tempoBrief) { delete spiel.tempoBrief;
    brief("Hofverwaltung", "Neues Spieltempo", `das Spiel hat ein neues Tempo bekommen: Eine Jahreszeit dauert jetzt <b>7 Tage</b> (Standard, vorher ${spiel.tempoAlt}). Neue Spiele können zwischen 4 (schnell), 7 (Standard) und 10 Tagen (langsam) wählen.<br><br>Das Datum bleibt gleich. Pro Tag ändert sich nichts – Füttern, Misten, Gesundheit und Wohlbefinden laufen wie bisher. Weil die Jahreszeit jetzt mehr Tage hat, braucht alles, was nach Jahreszeiten geht (Tragzeit, Alter, Hufschmied, Wurmkur …), entsprechend mehr Tage.`);
    speichern(); }
  zeigeStart();
</script>
