<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a24">
<title>Pferdezucht</title>
<style>
  :root {
    --holz: #8b5a3c;
    --holz-dunkel: #5b3a24;
    --holz-hell: #b07a52;
    --stroh: #e8c874;
    --himmel: #bfe3f5;
    --gras: #7cb356;
    --text: #2b1d12;
    --karte: #fffaf0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(var(--himmel), #e4f3fb);
    color: var(--text);
    display: flex; flex-direction: column;
    min-height: 100dvh;
    user-select: none;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: var(--holz-dunkel); color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  .geld { background: rgba(255,255,255,.15); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 16px; }
  #stall { width: 100%; max-width: 480px; height: auto; display: block; }
  #pferd { cursor: pointer; }
  .schweif { transform-origin: 150px 78px; animation: wedeln 3s ease-in-out infinite; }
  @keyframes wedeln { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }
  .kopf { transform-origin: 70px 70px; animation: nicken 5s ease-in-out infinite; }
  @keyframes nicken { 0%,80%,100% { transform: rotate(0); } 88% { transform: rotate(-4deg); } }
  .auge { animation: blinzeln 4s infinite; transform-origin: 38px 41px; }
  @keyframes blinzeln { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .karte {
    width: 100%; max-width: 480px; background: var(--karte);
    border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .karte h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .werte { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
  .werte dt { color: #7a6552; }
  .werte dd { margin: 0; font-weight: 600; }
  .hinweis { color: #7a6552; font-size: .9rem; margin: 0; text-align: center; }
  .knopf {
    width: 100%; max-width: 480px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--holz); color: #fff; font-size: 1rem; font-weight: 600;
    opacity: .55;
  }
  .versteckt { display: none; }
</style>
</head>
<body>
<header>
  <h1>🐴 Mein Zuchtstall</h1>
  <span class="geld" id="geld">1.000 €</span>
</header>

<main>
  <svg id="stall" viewBox="0 0 300 230" role="img" aria-label="Stall mit einer Box und einem weißen Pferd">
    <!-- Wiese -->
    <path d="M0,212 Q150,204 300,212 V230 H0 Z" fill="var(--gras)"/>
    <!-- Dach -->
    <polygon points="10,70 150,10 290,70" fill="#a33b2b"/>
    <polygon points="10,70 150,10 290,70" fill="none" stroke="#6e241a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Wand -->
    <rect x="25" y="68" width="250" height="150" fill="var(--holz)"/>
    <g stroke="var(--holz-dunkel)" stroke-width="1.5" opacity=".5">
      <line x1="25" y1="93" x2="275" y2="93"/><line x1="25" y1="118" x2="275" y2="118"/>
      <line x1="25" y1="143" x2="275" y2="143"/><line x1="25" y1="168" x2="275" y2="168"/>
      <line x1="25" y1="193" x2="275" y2="193"/>
    </g>
    <!-- Box-Öffnung -->
    <rect x="50" y="80" width="200" height="138" fill="#3d2616"/>
    <!-- Stroh -->
    <path d="M50,190 Q80,182 110,190 T170,188 T250,190 V218 H50 Z" fill="var(--stroh)"/>
    <g stroke="#c9a34e" stroke-width="1.2">
      <line x1="65" y1="200" x2="80" y2="195"/><line x1="120" y1="205" x2="135" y2="198"/>
      <line x1="190" y1="203" x2="210" y2="199"/><line x1="230" y1="208" x2="240" y2="200"/>
    </g>
    <!-- Schild -->
    <rect x="120" y="44" width="60" height="18" rx="3" fill="var(--karte)" stroke="var(--holz-dunkel)" stroke-width="2"/>
    <text x="150" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">Box 1</text>

    <!-- Pferd (weiß) -->
    <g id="pferd" transform="translate(52,62) scale(1.0)">
      <!-- Schweif -->
      <path class="schweif" d="M150,78 C165,85 168,110 160,135 C156,120 152,100 146,85 Z" fill="#e6e1d6" stroke="#b8b0a0" stroke-width="1.5"/>
      <!-- Hinterbeine (hinten) -->
      <rect x="136" y="98" width="9" height="40" rx="3" fill="#ece8df" stroke="#b8b0a0" stroke-width="1.5"/>
      <rect x="84" y="98" width="9" height="40" rx="3" fill="#ece8df" stroke="#b8b0a0" stroke-width="1.5"/>
      <!-- Hals (hinter dem Körper) -->
      <g class="kopf">
          <path d="M76,100 C62,78 54,58 50,42 L68,36 C75,55 86,68 104,72 Z" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Mähne -->
        <path d="M66,34 C74,50 82,64 96,72" fill="none" stroke="#e0dacd" stroke-width="6" stroke-linecap="round"/>
      </g>
      <!-- Körper -->
      <ellipse cx="108" cy="86" rx="46" ry="23" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5"/>
      <!-- Vorderbeine -->
      <rect x="72" y="98" width="9" height="42" rx="3" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5"/>
      <rect x="124" y="98" width="9" height="42" rx="3" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5"/>
      <!-- Hufe -->
      <g fill="#7a6a5a">
        <rect x="71" y="136" width="11" height="5" rx="1.5"/><rect x="83" y="134" width="11" height="5" rx="1.5"/>
        <rect x="123" y="136" width="11" height="5" rx="1.5"/><rect x="135" y="134" width="11" height="5" rx="1.5"/>
      </g>
      <!-- Hals + Kopf -->
      <g class="kopf">
        <!-- Ohren -->
        <path d="M56,30 L58,18 L64,30 Z" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M62,31 L66,20 L69,33 Z" fill="#f0ece3" stroke="#b8b0a0" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Kopf -->
        <path d="M68,36 C64,28 56,26 48,30 L24,52 C19,57 22,64 29,63 L42,58 C50,55 58,50 64,44 Z" fill="#f8f6f1" stroke="#b8b0a0" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Stirnschopf -->
        <path d="M56,29 C52,34 50,38 46,40" fill="none" stroke="#e0dacd" stroke-width="4" stroke-linecap="round"/>
        <!-- Auge -->
        <ellipse class="auge" cx="45" cy="41" rx="2.6" ry="2.8" fill="#2b1d12"/>
        <!-- Nüstern -->
        <ellipse cx="27" cy="57" rx="1.6" ry="2.2" fill="#9a8f80"/>
        <path d="M24,62 Q30,62 34,60" fill="none" stroke="#b8b0a0" stroke-width="1.2"/>
      </g>
    </g>

    <!-- Boxentür (halbhoch, vorne) -->
    <g>
      <rect x="50" y="178" width="200" height="40" fill="var(--holz-hell)" stroke="var(--holz-dunkel)" stroke-width="3"/>
      <line x1="50" y1="178" x2="250" y2="218" stroke="var(--holz-dunkel)" stroke-width="3"/>
      <line x1="250" y1="178" x2="50" y2="218" stroke="var(--holz-dunkel)" stroke-width="3"/>
    </g>
    <!-- Pfosten -->
    <rect x="44" y="78" width="8" height="140" fill="var(--holz-dunkel)"/>
    <rect x="248" y="78" width="8" height="140" fill="var(--holz-dunkel)"/>
  </svg>

  <p class="hinweis" id="hinweis">Tippe auf dein Pferd</p>

  <section class="karte versteckt" id="info">
    <h2 id="name"></h2>
    <dl class="werte">
      <dt>Geschlecht</dt><dd id="geschlecht"></dd>
      <dt>Alter</dt><dd id="alter"></dd>
      <dt>Farbe</dt><dd id="farbe"></dd>
      <dt>Box</dt><dd>Box 1</dd>
    </dl>
  </section>

  <button class="knopf" disabled>+ Neue Box bauen (bald)</button>
</main>

<script>
  // Spielzustand – wird später erweitert (Gene, weitere Boxen, Turniere ...)
  const spiel = {
    geld: 1000,
    boxen: [
      { nr: 1, pferd: { name: "Schneeflocke", geschlecht: "Stute", alter: 5, farbe: "Weiß" } }
    ]
  };

  const fmt = n => n.toLocaleString("de-DE") + " €";
  document.getElementById("geld").textContent = fmt(spiel.geld);

  document.getElementById("pferd").addEventListener("click", () => {
    const p = spiel.boxen[0].pferd;
    document.getElementById("name").textContent = p.name;
    document.getElementById("geschlecht").textContent = p.geschlecht;
    document.getElementById("alter").textContent = p.alter + " Jahre";
    document.getElementById("farbe").textContent = p.farbe;
    document.getElementById("info").classList.toggle("versteckt");
    document.getElementById("hinweis").classList.add("versteckt");
  });
</script>
</body>
</html>
