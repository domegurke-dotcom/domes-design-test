<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pferdezucht</title>
<style>
  :root {
    --holz: #8b5a3c; --holz-dunkel: #5b3a24; --holz-hell: #b07a52;
    --stroh: #e8c874; --gras: #7cb356; --text: #2b1d12; --leise: #7a6552;
    --karte: #fffaf0; --akzent: #b5642f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(#bfe3f5, #e4f3fb); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: var(--holz-dunkel); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tagknopf { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; border: 0; cursor: pointer; font: inherit;
    background: #f3c64d; color: #3a2610; border-radius: 10px; padding: 5px 10px; box-shadow: 0 2px 0 #b58a1f; }
  .tagknopf b { font-size: .98rem; white-space: nowrap; }
  .tagknopf small { font-size: .68rem; font-weight: 600; opacity: .8; white-space: nowrap; }
  @media (max-width: 430px) { header h1 { font-size: 1rem; } header h1 .emoji { display: none; } }
  .tagknopf:active { transform: translateY(2px); box-shadow: none; }
  .menue { position: relative; }
  .menueknopf { width: 42px; height: 38px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
  .menueknopf span { display: block; width: 22px; height: 3px; border-radius: 2px; background: #fff; }
  .menueknopf[aria-expanded="true"] { background: rgba(255,255,255,.28); }
  .menueliste { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; min-width: 190px; background: var(--karte); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28); overflow: hidden; }
  .menueliste[hidden] { display: none; }
  .menueliste button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 16px; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; }
  .menueliste button + button { border-top: 1px solid #efe4d2; }
  .menueliste button:active, .menueliste button:hover { background: #f6ecdc; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; }
  #stall { width: 100%; max-width: 560px; display: block; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .karte { width: 100%; max-width: 520px; background: var(--karte); border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .karte h2 { margin: 0; font-size: 1.2rem; }
  .unter { color: var(--leise); margin: 2px 0 10px; font-size: .95rem; }
  .werte { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
  .werte dt { color: var(--leise); }
  .werte dd { margin: 0; font-weight: 600; }
  .text { font-size: .9rem; color: var(--leise); margin: 10px 0 0; line-height: 1.4; }
  /* Tagesablauf */
  .tagesleiste { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; background: var(--karte);
    border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .tagesleiste .tag { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
  .tagesleiste .status { flex: 1; font-size: .88rem; color: var(--leise); line-height: 1.25; }
  .tagesleiste .status b { color: var(--text); }
  .tagesleiste button { border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 700; font-size: .9rem;
    background: #3b4a7a; color: #fff; cursor: pointer; white-space: nowrap; }
  .tagesleiste button:active { transform: scale(.97); }
  #krippe, #boden, #mist { cursor: pointer; }
  #stall.tot > :not(#totText) { filter: grayscale(1) brightness(.85); }
  #stall.tot #krippenHinweis, #stall.tot #mistHinweis { display: none !important; }
  #stall.tot #krippe, #stall.tot #boden, #stall.tot #mist { cursor: default; }
  #mist { transition: opacity .6s; }
  #mist.weg { opacity: 0; pointer-events: none; }
  #mistHinweis { display: none; animation: hopsen 1.2s ease-in-out infinite; }
  #stall.mistig #mistHinweis { display: inline; }
  .funkeln { animation: funkeln .9s ease-out forwards; }
  @keyframes funkeln { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-14px) scale(1.2); } }
  #stall .heu { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .4s; }
  #stall.leer .heu { transform: scaleY(0); opacity: 0; }
  #krippenHinweis { display: none; animation: hopsen 1.2s ease-in-out infinite; }
  #stall.leer #krippenHinweis { display: inline; }
  @keyframes hopsen { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  #nacht { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(circle at 50% 40%, #2c3b6e, #0e1430); color: #fff; opacity: 0; pointer-events: none; transition: opacity .7s; }
  #nacht.an { opacity: 1; pointer-events: auto; }
  #nacht .gross { font-size: 3rem; }
  #nacht .klein { font-size: 1.2rem; font-weight: 700; }
  /* Umschalter Steckbrief / Pferdepflege */
  .modus { display: flex; background: #e4d3b4; border-radius: 12px; padding: 3px; margin-bottom: 8px; }
  .modus button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 9px; font: inherit; font-weight: 700; font-size: .92rem; color: #6b5440; cursor: pointer; }
  .modus button.an { background: var(--karte); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .liste { list-style: none; margin: 0; padding: 0; }
  .liste li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #efe4d2; font-size: .92rem; }
  .liste li:last-child { border-bottom: 0; }
  .liste .ico { font-size: 1.3rem; width: 28px; text-align: center; flex: none; }
  .liste .txt { flex: 1; line-height: 1.3; }
  .liste .txt small { display: block; color: var(--leise); font-size: .8rem; }
  .stat { flex: none; font-size: .78rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  .stat.ok { background: #e3f1dc; color: #2f6b22; }
  .stat.warn { background: #fbecd0; color: #93600f; }
  .stat.bad { background: #f8dcd6; color: #9b2c1c; }
  /* Kacheln (Ausrüstung / Platz) */
  .kacheln { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .kachel { background: #fff; border: 2px solid #e2d6c3; border-radius: 12px; padding: 8px 4px 7px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .kachel .ico { font-size: 1.9rem; line-height: 1.1; }
  .kachel b { font-size: .74rem; line-height: 1.15; word-break: normal; overflow-wrap: normal; hyphens: manual; }
  .kachel small { font-size: .66rem; color: var(--leise); line-height: 1.2; }
  .kachel.fehlt { background: #f4f0ea; border-style: dashed; }
  button.kachel { font: inherit; color: inherit; cursor: default; }
  .kachel.klickbar { cursor: pointer; border-color: var(--akzent); box-shadow: 0 2px 0 #e7c4a3; }
  .kachel.klickbar:active { transform: translateY(1px); box-shadow: none; }
  .kachel.aktuell { border-color: #7aa95c; background: #f1f8ec; }
  .kachel .mini { width: 100%; height: auto; border-radius: 8px; background: #eaf5fb; }
  .kachel.fehlt .mini { filter: grayscale(1); opacity: .45; }
  .zurueck { margin-top: 10px; border: 0; background: none; color: var(--akzent); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 0; }
  .kachel.fehlt .ico { filter: grayscale(1); opacity: .35; }
  .kachel.fehlt b, .kachel.fehlt small { color: #a99a8a; }
  /* Genetik */
  .ahn { background: #fff; border: 2px solid #e2d6c3; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.25; }
  .ahn small { color: var(--leise); font-size: .74rem; }
  .ahn b { font-size: .95rem; }
  .ahn span { font-size: .8rem; color: var(--leise); }
  .ahn.ich { border-color: var(--akzent); background: #fdf0e4; margin-bottom: 10px; }
  .stammbaum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zweig { display: flex; flex-direction: column; gap: 6px; }
  .linie { font-size: .78rem; font-weight: 700; color: var(--akzent); }
  .anteil { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: #eadfcd; }
  .anteil i { display: block; height: 100%; background: var(--akzent); }
  .anteil i.fremd { background: #6b8fb8; }
  .pole .fr { color: #4c6f97; }
  /* Enzyklopädie */
  .enz-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .enz-tabs button { border: 2px solid #e2d6c3; background: #fff; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .88rem; cursor: pointer; color: inherit; }
  .enz-tabs button.an { border-color: var(--akzent); background: #fdf0e4; font-weight: 700; }
  .enz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .enz-karte { background: #fff; border-radius: 12px; padding: 6px 6px 10px; }
  .enz-karte svg { width: 100%; display: block; border-radius: 8px; background: linear-gradient(#e3f1f9, #fff); }
  .enz-karte b { display: block; font-size: .92rem; margin: 6px 4px 2px; }
  .enz-karte p { margin: 0 4px; font-size: .8rem; color: var(--leise); line-height: 1.35; }
  /* Pferdeakte mit Aktenreitern */
  .akte { width: 100%; max-width: 560px; }
  .reiter { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
  .reiter::-webkit-scrollbar { display: none; }
  .reiter button { flex: 1 1 auto; min-width: 0; border: 0; font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer;
    padding: 9px 3px 8px; border-radius: 12px 12px 0 0; background: #e4d3b4; color: #6b5440; box-shadow: inset 0 -3px 4px rgba(0,0,0,.06); }
  .reiter button.an { background: var(--karte); color: var(--text); box-shadow: 0 -2px 6px rgba(0,0,0,.08); }
  .akte .karte { max-width: none; border-radius: 0 14px 14px 14px; min-height: 220px; }
  .akte-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .akte-kopf h2 { margin: 0; font-size: 1.2rem; }
  .akte-kopf h2 { cursor: pointer; }
  .akte-kopf .stift { font-size: .75rem; opacity: .45; }
  .akte-kopf input { font: inherit; font-size: 1.15rem; font-weight: 700; padding: 4px 8px; border: 2px solid var(--akzent); border-radius: 8px; width: 100%; max-width: 280px; background: #fff; color: var(--text); }
  .zeile-wert { margin: 10px 0; }
  .zeile-wert .kopf { display: flex; justify-content: space-between; font-size: .92rem; margin-bottom: 4px; }
  .zeile-wert .kopf b { font-weight: 700; }
  .zeile-wert .kopf span { color: var(--leise); }
  .balken { height: 10px; border-radius: 99px; background: #eadfcd; overflow: hidden; }
  .balken i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #d88b4a, var(--akzent)); }
  .skala { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #d9e7f2, #f1e7d6 50%, #f3d7c0); }
  .skala i { position: absolute; top: -3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--akzent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .pole { display: flex; justify-content: space-between; font-size: .78rem; color: var(--leise); margin-top: 4px; }
  .chips-klein { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chips-klein span { background: #fdf0e4; border: 1px solid #efd3b8; color: #8a4a1f; border-radius: 99px; padding: 3px 10px; font-size: .82rem; font-weight: 600; }
  .klasse { background: #f6efe3; border-radius: 10px; padding: 8px 12px; font-size: .9rem; margin-bottom: 6px; }
  .klasse b { color: var(--akzent); }
  .knopf { width: 100%; max-width: 520px; padding: 14px; border: 0; border-radius: 12px; background: var(--akzent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .knopf:active { transform: scale(.98); }
  .knopf.aus { background: var(--holz); opacity: .5; cursor: default; }

  /* Auswahl-Overlay */
  #auswahl { position: fixed; inset: 0; background: #f6efe3; z-index: 10; overflow-y: auto; display: none; }
  #auswahl.offen { display: block; }
  .leiste { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: var(--holz-dunkel); color: #fff; }
  .leiste h2 { margin: 0; font-size: 1.05rem; flex: 1; }
  .leiste button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 1rem; cursor: pointer; }
  .inhalt { max-width: 720px; margin: 0 auto; padding: 16px; }
  .rassen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .rasse { background: #fff; border: 2px solid transparent; border-radius: 12px; padding: 6px 6px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .rasse:hover { border-color: var(--holz-hell); }
  .rasse svg { width: 100%; display: block; }
  .rasse b { display: block; font-size: .92rem; padding: 0 4px; }
  .rasse span { display: block; font-size: .8rem; color: var(--leise); padding: 0 4px; }
  .hinweis { font-size: .85rem; color: var(--leise); margin: 0 0 12px; }
  .vorschau { position: relative; background: linear-gradient(#dff1fa, #fff 70%); border-radius: 14px; overflow: hidden; }
  .blaettern { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 56px; border: 0; border-radius: 12px;
    background: rgba(91,58,36,.75); color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 4px; }
  .blaettern.links { left: 6px; } .blaettern.rechts { right: 6px; }
  .blaettern:active { background: rgba(91,58,36,.95); }
  .vorschau svg { width: 100%; display: block; }
  .feld { margin-top: 16px; }
  .feld > label, .feld > .titel { display: block; font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid #e2d6c3; background: #fff; border-radius: 999px; padding: 5px 10px 5px 5px; font: inherit; font-size: .88rem; cursor: pointer; color: inherit; }
  .chip.an { border-color: var(--akzent); background: #fdf0e4; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); flex: none; }
  .segment { display: flex; background: #e9dfd0; border-radius: 10px; padding: 3px; }
  .segment button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font: inherit; cursor: pointer; color: inherit; }
  .segment button.an { background: #fff; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input[type=range] { width: 100%; accent-color: var(--akzent); }
  .zeile { display: flex; gap: 8px; }
  .zeile input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid #e2d6c3; background: #fff; min-width: 0; }
  .wuerfel { border: 2px solid #e2d6c3; background: #fff; border-radius: 10px; font-size: 1.2rem; padding: 0 12px; cursor: pointer; }
  .wert { float: right; font-weight: 600; color: var(--akzent); }
  .fuss { position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #f6efe3 30%); }
</style>
</head>
<body>
<header>
  <button class="tagknopf" id="tagAnzeige" title="Tag beenden"><b>☀️ Tag 1</b><small>beenden 🌙</small></button>
  <h1><span class="emoji">🐴 </span>Mein Zuchtstall</h1>
  <div class="menue">
    <button class="menueknopf" id="menueKnopf" aria-label="Menü" aria-expanded="false" aria-controls="menueListe"><span></span><span></span><span></span></button>
    <div class="menueliste" id="menueListe" role="menu" hidden>
      <button role="menuitem" id="mVollbild">⛶ Vollbild</button>
      <button role="menuitem" id="mEnzy">📖 Enzyklopädie</button>
      <button role="menuitem" id="mNeustart">↺ Neustart</button>
    </div>
  </div>
</header>

<main>
  <svg id="stall" viewBox="0 0 400 300" role="img" aria-label="Pferdebox von innen mit Paddockausgang">
    <defs>
      <filter id="hand" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="300">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="handPferd" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="300">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>

      location.replace(location.pathname + "?v=" + v.version);
    }
  }).catch(() => {});

<script src="pferd.js?v=37"></script>
<script>
  // ---------- Spielzustand ----------
  const SPEICHER = "zuchtstall-v2";
  const NAMEN = {
    Stute: ["Schneeflocke", "Luna", "Bella", "Stella", "Fee", "Amira", "Freya", "Nala", "Kira", "Zora", "Dana", "Leonie", "Paula", "Sina", "Aurora", "Jasmin", "Wilma", "Elfe"],
    Hengst: ["Donnerhall", "Sturmwind", "Apollo", "Merlin", "Farid", "Orkan", "Balou", "Rocky", "Picasso", "Zeus", "Blitz", "Gandalf", "Samir", "Titan", "Odin"],
    Wallach: ["Max", "Moritz", "Jonny", "Charly", "Fritz", "Sammy", "Benny", "Lucky", "Pepe", "Bruno", "Oskar", "Theo", "Emil"],
  };
  const zufallAus = a => a[Math.floor(Math.random() * a.length)];

  let spiel = {
    geld: 1000,
    boxen: [{ nr: 1, pferd: { id: "start", name: "Schneeflocke", rasse: "araber", farbe: "schimmel", geschlecht: "Stute", alter: 5, stockmass: 150 } }],
  };
  try { const s = JSON.parse(localStorage.getItem(SPEICHER)); if (s && s.boxen) spiel = s; } catch (e) {}
  if (!spiel.anlage) spiel.anlage = { stall: true, paddock: true, weide: false, waschplatz: false, roundpen: false, reitplatz: false, reithalle: false, gelaende: true, anhaenger: false };
  if (!spiel.ausruestung) spiel.ausruestung = { halfter: true, strick: true, putzkiste: true, sattel: false, trense: false, schabracke: false, decke: false, gamaschen: false, schere: true, medizin: true };
  if (spiel.ausruestung.medizin == null) spiel.ausruestung.medizin = true;
  if (spiel.ausruestung.schere == null) spiel.ausruestung.schere = true;
  spiel.boxen.forEach(b => { if (b.pferd && !b.pferd.werte) b.pferd.werte = erzeugeWerte(b.pferd); if (b.pferd && !b.pferd.pflege) b.pferd.pflege = erzeugePflege(b.pferd); if (b.pferd && b.pferd.maehneSeit == null) b.pferd.maehneSeit = spiel.tag || 1; if (b.krippeVoll == null) b.krippeVoll = false; if (b.mistig == null) b.mistig = true; });
  if (!spiel.tag) spiel.tag = 1;
  const speichern = () => { try { localStorage.setItem(SPEICHER, JSON.stringify(spiel)); } catch (e) {} };

  let aktenReiter = "steckbrief", aktenModus = "steckbrief", scherModus = false, medModus = false, meldung = "";
  const fmt = n => n.toLocaleString("de-DE") + " €";
  const $ = id => document.getElementById(id);

  // ---------- Stall ----------
  const STALL = { mitte: 205, boden: 278, cmZuEinheit: 0.74 };
  // Körperhaltung nach Gesundheitszustand (wird am Tagesbeginn neu gezeichnet)
  function haltungFuer(p) {
    const g = p.pflege ? p.pflege.gesundheit : 100;
    return g >= 80 ? "normal" : g >= 60 ? "leicht" : g >= 40 ? "waagerecht" : g >= 20 ? "tief" : "liegend";
  }
  const HALTUNG_TEXT = { normal: "steht aufmerksam, Kopf und Hals oben", leicht: "lässt Kopf und Hals etwas hängen", waagerecht: "trägt Kopf und Hals nur noch waagerecht", tief: "lässt den Kopf tief hängen", liegend: "liegt matt in der Box" };
  const MEDIZIN = [
    { id: "schmerz", ico: "💊", name: "Schmerz\u00admittel", kurz: "+15 Gesundheit", plus: 15, info: "Lindert Schmerzen – Gesundheit +15, einmal am Tag" },
    { id: "wunde", ico: "🧴", name: "Wund\u00adsalbe", kurz: "+3 Gesundheit", plus: 3, info: "Für kleine Schrammen und Wunden" },
    { id: "augen", ico: "👁️", name: "Augen\u00adtropfen", kurz: "+2 Gesundheit", plus: 2, info: "Gegen tränende, gereizte Augen" },
    { id: "husten", ico: "🍯", name: "Husten\u00adsaft", kurz: "+3 Gesundheit", plus: 3, info: "Kräutersaft für die Atemwege" },
    { id: "elektrolyte", ico: "🧂", name: "Elektro\u00adlyte", kurz: "+2 Gesundheit", plus: 2, info: "Mineralien nach Anstrengung" },
    { id: "wurmkur", ico: "🪱", name: "Wurmkur", kurz: "Termin erneuern", plus: 0, info: "Entwurmung – setzt den Wurmkur-Termin zurück" },
    { id: "kuehl", ico: "🧊", name: "Kühl\u00adgel", kurz: "+2 Gesundheit", plus: 2, info: "Kühlt warme, geschwollene Beine" },
    { id: "huf", ico: "🪮", name: "Huföl", kurz: "+1 Gesundheit", plus: 1, info: "Pflegt Hufhorn und Kronrand" },
  ];
  function zeigeStall() {
    const p = spiel.boxen[0].pferd;
    const z = zeichnePferd(p.rasse, p.farbe, { seed: p.id, geschlecht: p.geschlecht, maehne: p.maehne, haltung: haltungFuer(p), ohren: (p.pflege && p.pflege.gesundheit >= 45 && p.pflege.gesundheit < 65) ? "geknickt" : "" });
    const s = p.stockmass * STALL.cmZuEinheit / 100;
    const cx = (z.box.minX + z.box.maxX) / 2;
    $("pferdPlatz").innerHTML = `<g transform="translate(${(STALL.mitte - cx * s).toFixed(1)},${STALL.boden}) scale(${s.toFixed(4)})">${z.svg}</g>`;
    zeigeAkte();
  }

  // ---------- Pferdeakte ----------
  function zeigeAkte() {
    const p = spiel.boxen[0].pferd, r = rasseById(p.rasse), w = p.werte;
    const reiter = aktenModus === "steckbrief"
      ? [["steckbrief", "Daten"], ["genetik", "Genetik"], ["gang", "Gangwerk"], ["charakter", "Charakter"], ["ausbildung", "Ausbildung"]]
      : [["gesundheit", "Gesundheit"], ["ausruestung", "Ausrüstung"], ["platz", "Platz"]];
    const box = spiel.boxen[0], pf = p.pflege;
    let inhalt = "";
    if (aktenReiter === "steckbrief") {
      inhalt = `<dl class="werte">
          <dt>Name</dt><dd>${esc(p.name)}</dd>
          <dt>Rasse</dt><dd>${r.name} · ${String(w.reinrassig).replace(".", ",")} % reinrassig</dd>
          <dt>Farbe</dt><dd>${FARBEN[p.farbe].name}</dd>
          <dt>Mähne</dt><dd>${MAEHNEN.find(m => m[0] === (p.maehne || naturMaehne(p.rasse)))[1]}</dd>
          <dt>Geschlecht</dt><dd>${p.geschlecht}</dd>
          <dt>Alter</dt><dd>${p.alter} ${p.alter === 1 ? "Jahr" : "Jahre"}</dd>
          <dt>Stockmaß</dt><dd>${p.stockmass} cm</dd>
          <dt>Herkunft</dt><dd>${r.herkunft}</dd>
        </dl><p class="text">${r.text}</p>`;
    } else if (aktenReiter === "genetik") {
      if (!p.ahnen) { p.ahnen = erzeugeAhnen(p); speichern(); }
      const A = p.ahnen, rn = id => rasseById(id).name, pz = x => String(x).replace(".", ",") + " %";
      const ahn = (rolle, a, sym) => `<div class="ahn"><small>${sym} ${rolle}</small><b>${esc(a.name)}</b><span>${rn(a.rasse)} · ${pz(a.pct)}</span></div>`;
      const anteil = w.reinrassig, fremd = Math.round((100 - anteil) * 100) / 100;
      inhalt = `<div class="ahn ich"><small>Pferd</small><b>${esc(p.name)}</b><span>${r.name} · ${pz(anteil)} reinrassig</span></div>
        <div class="stammbaum">
          <div class="zweig"><div class="linie">Vaterseite</div>${ahn("Vater", A.vater, "♂")}${ahn("Vaters Vater", A.vatersvater, "♂")}</div>
          <div class="zweig"><div class="linie">Mutterseite</div>${ahn("Mutter", A.mutter, "♀")}${ahn("Mutters Vater", A.muttersvater, "♂")}</div>
        </div>
        <div class="zeile-wert" style="margin-top:14px"><div class="kopf"><b>Rassischer Anteil</b></div>
          <div class="anteil"><i style="width:${anteil}%"></i>${fremd > 0 ? `<i class="fremd" style="width:${fremd}%"></i>` : ""}</div>
          <div class="pole"><span>■ ${r.name} ${pz(anteil)}</span>${fremd > 0 ? `<span class="fr">■ ${rn(A.fremdRasse)} ${pz(fremd)}</span>` : ""}</div></div>`;
    } else if (aktenReiter === "gang") {
      const g = w.gang, pr = PROFIL[p.rasse] || {};
      const liste = [["Schritt", g.schritt], ["Trab", g.trab], ["Galopp", g.galopp]];
      if (g.toelt != null) liste.push(["Tölt", g.toelt]);
      if (g.pass != null) liste.push([pr.passName || "Pass", g.pass]);
      const zusatz = p.rasse === "isi" ? `<p class="text">${g.pass != null ? "Fünfgänger" : "Viergänger"}: ${g.pass != null ? "beherrscht Tölt und Rennpass" : "beherrscht Tölt, aber keinen Pass"}.</p>` : "";
      inhalt = `<p class="text" style="margin:0 0 4px">Zuchtnoten von 1 bis 10</p>` + liste.map(([n, v]) => `
        <div class="zeile-wert"><div class="kopf"><b>${n}</b><span>${String(v).replace(".", ",")} · ${NOTENWORT(v)}</span></div>
        <div class="balken"><i style="width:${v * 10}%"></i></div></div>`).join("") + zusatz;
    } else if (aktenReiter === "charakter") {
      const c = w.charakter;
      const woerter = CHARAKTER.map(t => c[t.key] >= 68 ? t.rechts : c[t.key] <= 32 ? t.links : null).filter(Boolean);
      inhalt = (woerter.length ? `<div class="chips-klein">${woerter.map(x => `<span>${x}</span>`).join("")}</div>` : `<p class="text" style="margin:0 0 6px">ausgeglichener Charakter</p>`) +
        CHARAKTER.map(t => `
        <div class="zeile-wert"><div class="kopf"><b>${t.titel}</b></div>
        <div class="skala"><i style="left:${c[t.key]}%"></i></div>
        <div class="pole"><span>${t.links}</span><span>${t.rechts}</span></div></div>`).join("");
    } else if (aktenReiter === "ausbildung") {
      const aw = ausbildungsWerte(p);
      inhalt = `<div class="klasse">Ausbildungsstand: <b>${ausbildungsKlasse(aw, p.alter)}</b></div>` + aw.map(x => `
        <div class="zeile-wert"><div class="kopf"><b>${x.name}</b><span>${x.wert} %</span></div>
        <div class="balken"><i style="width:${x.wert}%"></i></div></div>`).join("") +
        `<p class="text">Nach der Skala der Ausbildung: Takt → Losgelassenheit → Anlehnung → Schwung → Geraderichtung → Versammlung.</p>`;
    }
    else if (aktenReiter === "gesundheit") {
      const g = pf.gesundheit;
      const zustand = box.tot ? ["verstorben", "bad"] : g >= 85 ? ["kerngesund", "ok"] : g >= 65 ? ["gesund", "ok"] : g >= 45 ? ["angeschlagen", "warn"] : ["krank", "bad"];
      const termin = (ico, name, tagZuletzt, intervall, info) => {
        const vor = spiel.tag - tagZuletzt, rest = intervall - vor;
        const st = rest < 0 ? ["überfällig", "bad"] : rest <= 7 ? ["bald fällig", "warn"] : ["ok", "ok"];
        return `<li><span class="ico">${ico}</span><span class="txt">${name}<small>zuletzt vor ${vor} ${vor === 1 ? "Tag" : "Tagen"} · ${info}</small></span><span class="stat ${st[1]}">${st[0]}</span></li>`;
      };
      inhalt = `<div class="zeile-wert"><div class="kopf"><b>Gesundheitszustand</b><span>${g.toLocaleString("de-DE", { maximumFractionDigits: 1 })} % · ${zustand[0]}</span></div>
          <div class="balken"><i style="width:${g}%;${g < 45 ? "background:#c0503a" : ""}"></i></div>
          <p class="text" style="margin:6px 0 0">${box.tot ? `${esc(p.name)} ist verstorben. Über das Menü (☰) → Neustart oder „Pferd auswählen“ geht es weiter.` : `${esc(p.name)} ${HALTUNG_TEXT[haltungFuer(p)]}${g >= 45 && g < 65 ? " – die Ohren sind halb abgeknickt" : ""}.`}</p></div>
        <ul class="liste">
          <li><span class="ico">🌾</span><span class="txt">Fütterung heute<small>Heu in der Futterkrippe</small></span><span class="stat ${box.krippeVoll ? "ok" : "warn"}">${box.krippeVoll ? "gefüttert" : "noch nicht"}</span></li>
          <li><span class="ico">💧</span><span class="txt">Wasser<small>Selbsttränke</small></span><span class="stat ok">frisch</span></li>

          ${termin("🔨", "Hufpflege (Hufschmied)", pf.huf, 42, "alle 6–8 Wochen")}

    } else if (aktenReiter === "ausruestung") {
      const sm = p.stockmass;

      const teile = [
        ["halfter", "🐴", "Halfter", `Größe ${gr}`, grK], ["strick", "🪢", "Führ\u00adstrick", "mit Panikhaken", "Panikhaken"],
        ["putzkiste", "🧰", "Putz\u00adkiste", "Striegel, Kardätsche, Hufkratzer, Mähnenkamm", "komplett"],
        ["sattel", "🏇", "Sattel", "Kammerweite muss angepasst werden", "anpassen"], ["trense", "🔗", "Trense", `Größe ${gr}`, grK],
        ["schabracke", "🟫", "Scha\u00adbracke", sm < 125 ? "Pony" : "Warmblut / Vollblut", sm < 125 ? "Pony" : "WB/VB"],
        ["decke", "🧣", "Decke", `Abschwitzdecke, Deckengröße ${decke} cm`, `${decke} cm`], ["gamaschen", "🦵", "Gama\u00adschen", `Größe ${gr}`, grK],
        ["schere", "✂️", "Schere", "zum Mähne schneiden – antippen", "Mähne schneiden"],

      const hat = teile.filter(t => spiel.ausruestung[t[0]]).length;
      if (medModus) {
        const heute = (p.medizin && p.medizin.tag === spiel.tag) ? p.medizin.gegeben : [];
        inhalt = (meldung ? `<div class="klasse">${meldung}</div>` : "") + `<p class="text" style="margin:0 0 4px">💊 <b>Stallapotheke</b> · Gesundheit: ${p.pflege.gesundheit.toLocaleString("de-DE", { maximumFractionDigits: 1 })} %<br><small>Jedes Mittel kann einmal am Tag gegeben werden.</small></p>
          <div class="kacheln">${MEDIZIN.map(m => {
            const schon = heute.includes(m.id);
            return `<button class="kachel ${schon ? "fehlt" : "klickbar"}" data-med="${m.id}" ${schon ? "disabled" : ""} title="${m.info}">

      } else if (scherModus) {
        const jetzt = p.maehne || naturMaehne(p.rasse), ji = MAEHNEN.findIndex(m => m[0] === jetzt);

          <div class="kacheln">${MAEHNEN.map(([id, name], i) => {
            const z = zeichnePferd(p.rasse, p.farbe, { seed: p.id, geschlecht: p.geschlecht, maehne: id });
            const status = i === ji ? "aktuell" : i < ji ? "schneiden" : "zu lang";
            const moeglich = i < ji;
            return `<button class="kachel ${moeglich ? "klickbar" : i === ji ? "aktuell" : "fehlt"}" data-schnitt="${moeglich ? id : ""}" ${moeglich ? "" : "disabled"}>
              <svg class="mini" viewBox="${(z.box.minX - 6).toFixed(1)} ${(z.box.minY - 6).toFixed(1)} 110 92"><g>${z.svg}</g></svg>
              <b>${({ steh: "Steh\u00admähne", kurz: "Kurz", mittel: "Mittel", lang: "Lang", extralang: "Extra lang" })[id]}</b><small>${status}</small></button>`;
          }).join("")}</div>
          <button class="zurueck" id="scherZurueck">‹ Zurück zur Ausrüstung</button>`;
      } else

        <div class="kacheln">${teile.map(([k, ico, n, info, kurz]) => `<div class="kachel ${spiel.ausruestung[k] ? "" : "fehlt"} ${(k === "schere" || k === "medizin") && spiel.ausruestung[k] ? "klickbar" : ""}" ${k === "schere" ? 'id="scherKachel" role="button" tabindex="0"' : k === "medizin" ? 'id="medKachel" role="button" tabindex="0"' : ""} title="${n.replace(/\u00ad/g, "")}: ${info}${spiel.ausruestung[k] ? "" : " (fehlt)"}"><span class="ico">${ico}</span><b>${n}</b><small>${kurz}</small></div>`).join("")}</div>`;
    } else if (aktenReiter === "platz") {
      const wh = p.stockmass / 100, minF = Math.pow(2 * wh, 2), passt = 12.25 >= minF;
      const zahl = n => n.toFixed(1).replace(".", ",");
      const plaetze = [
        ["stall", "🏠", "Stall", "Box 1 mit Paddockausgang", "Box 1"],
        ["paddock", "🟫", "Paddock", "Sandpaddock, direkt an der Box", "Sand"],
        ["weide", "🌿", "Weide", "Grasfläche für freien Weidegang", "Weidegang"],
        ["waschplatz", "🚿", "Wasch­platz", "zum Abspritzen und Hufe waschen", "Abspritzen"],
        ["roundpen", "⭕", "Round\u00adpen", "runder Platz für Longieren und Bodenarbeit", "Longieren"],
        ["reitplatz", "🏟️", "Reit\u00adplatz", "Sandplatz 20 × 40 m für Dressur und Springen", "20 × 40 m"],
        ["reithalle", "🏛️", "Reit\u00adhalle", "überdachtes Reiten bei jedem Wetter", "überdacht"],
        ["gelaende", "🌲", "Gelände", "Wald- und Feldwege für Ausritte", "Ausritte"],
        ["anhaenger", "🚚", "Pferde­anhänger", "für Turniere und Ausflüge", "Turniere"],
      ];
      const da = plaetze.filter(x => spiel.anlage[x[0]]).length;
      inhalt = `<p class="text" style="margin:0 0 4px">${da} von ${plaetze.length} Plätzen auf deiner Anlage vorhanden</p>
        <div class="kacheln">${plaetze.map(([k, ico, n, info, kurz]) => `<div class="kachel ${spiel.anlage[k] ? "" : "fehlt"}" title="${n.replace(/\u00ad/g, "")}: ${info}${spiel.anlage[k] ? "" : " (fehlt)"}"><span class="ico">${ico}</span><b>${n}</b><small>${kurz}</small></div>`).join("")}</div>
`;
    }
    $("info").innerHTML = `
      <div class="modus" role="group" aria-label="Ansicht">
        <button data-m="steckbrief" class="${aktenModus === "steckbrief" ? "an" : ""}">📋 Steckbrief</button>
        <button data-m="pflege" class="${aktenModus === "pflege" ? "an" : ""}">🧽 Pferdepflege</button>
      </div>
      <div class="reiter" role="tablist">${reiter.map(([id, t]) => `<button role="tab" data-r="${id}" class="${aktenReiter === id ? "an" : ""}" aria-selected="${aktenReiter === id}">${t}</button>`).join("")}</div>
      <div class="karte" role="tabpanel">
        <div class="akte-kopf"><h2 id="pferdName" role="button" tabindex="0" title="Namen ändern">${esc(p.name)} <span class="stift">✏️</span></h2></div>
        ${inhalt}
      </div>`;
    $("info").querySelectorAll(".reiter button").forEach(b => b.onclick = () => { aktenReiter = b.dataset.r; scherModus = false; medModus = false; meldung = ""; zeigeAkte(); });
    const pn = $("pferdName");
    if (pn) pn.onclick = () => {
      pn.outerHTML = `<input id="nameEdit" maxlength="24" value="${esc(p.name)}" aria-label="Neuer Name">`;
      const inp = $("nameEdit"); inp.focus(); inp.select();
      const fertig = speichernJa => {
        if (speichernJa) { const n = inp.value.trim(); if (n) { p.name = n; speichern(); } }
        zeigeAkte();
      };
      inp.onkeydown = e => { if (e.key === "Enter") fertig(true); if (e.key === "Escape") fertig(false); };
      inp.onblur = () => fertig(true);
    };
    const sk = $("scherKachel"); if (sk) sk.onclick = () => { scherModus = true; meldung = ""; zeigeAkte(); };
    const mk = $("medKachel"); if (mk) mk.onclick = () => { medModus = true; meldung = ""; zeigeAkte(); };
    const mz = $("medZurueck"); if (mz) mz.onclick = () => { medModus = false; meldung = ""; zeigeAkte(); };
    $("info").querySelectorAll("[data-med]").forEach(b => b.onclick = () => {
      const m = MEDIZIN.find(x => x.id === b.dataset.med);
      if (!p.medizin || p.medizin.tag !== spiel.tag) p.medizin = { tag: spiel.tag, gegeben: [] };
      if (p.medizin.gegeben.includes(m.id)) return;
      p.medizin.gegeben.push(m.id);
      const vorher = p.pflege.gesundheit;
      p.pflege.gesundheit = Math.min(100, Math.round((vorher + m.plus) * 10) / 10);
      if (m.id === "wurmkur") p.pflege.wurm = spiel.tag;
      const diff = Math.round((p.pflege.gesundheit - vorher) * 10) / 10;
      meldung = `${m.ico} ${esc(p.name)} hat ${m.name} bekommen${diff > 0 ? ` – Gesundheit +${String(diff).replace(".", ",")}` : ""}.`;
      speichern(); zeigeAkte();
    });
    const sz = $("scherZurueck"); if (sz) sz.onclick = () => { scherModus = false; zeigeAkte(); };
    $("info").querySelectorAll("[data-schnitt]").forEach(b => { if (b.dataset.schnitt) b.onclick = () => {
      p.maehne = b.dataset.schnitt; p.maehneSeit = spiel.tag; scherModus = false;
      meldung = `✂️ Die Mähne von ${esc(p.name)} ist jetzt: <b>${MAEHNEN.find(m => m[0] === p.maehne)[1]}</b>`;
      speichern(); zeigeStall();
    }; });
    $("info").querySelectorAll(".modus button").forEach(b => b.onclick = () => {
      aktenModus = b.dataset.m;
      aktenReiter = aktenModus === "steckbrief" ? "steckbrief" : "gesundheit";
      zeigeAkte();
    });
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- Auswahl ----------
  const VB = { b: 340, h: 300, boden: 290 };
  function pferdInRahmen(rasse, farbe, cm, opt = {}, mitteX = VB.b / 2) {
    const z = zeichnePferd(rasse, farbe, opt);
    const s = cm / 100, cx = (z.box.minX + z.box.maxX) / 2;
    return `<g transform="translate(${(mitteX - cx * s).toFixed(1)},${VB.boden}) scale(${s})">${z.svg}</g>`;
  }

  function zeigeRassen() {
    const a = $("auswahl");
    a.innerHTML = `
      <div class="leiste"><h2>Rasse wählen</h2><button id="zu" aria-label="Schließen">✕</button></div>
      <div class="inhalt">
        <p class="hinweis">Alle Pferde sind im gleichen Maßstab gezeichnet – so siehst du die echten Größenunterschiede.</p>
        <div class="rassen">
          ${RASSEN.map(r => `
            <button class="rasse" data-id="${r.id}">
              <svg viewBox="0 0 ${VB.b} ${VB.h}"><line x1="0" x2="${VB.b}" y1="${VB.boden}" y2="${VB.boden}" stroke="#d8cbb6" stroke-width="2"/>${pferdInRahmen(r.id, r.farben[0], (r.h[0] + r.h[1]) / 2)}</svg>
              <b>${r.name}</b><span>${r.h[0]}–${r.h[1]} cm · ${r.herkunft}</span>
            </button>`).join("")}
        </div>
      </div>`;
    a.classList.add("offen");
    a.scrollTop = 0;
    $("zu").onclick = schliessen;
    a.querySelectorAll(".rasse").forEach(b => b.onclick = () => zeigeDetail(b.dataset.id));
  }

  let wahl = null;
  function zeigeDetail(id) {
    const r = rasseById(id);
    const g = zufallAus(["Stute", "Hengst", "Wallach"]);
    wahl = {
      id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      rasse: id, farbe: r.farben[0], geschlecht: g, name: zufallAus(NAMEN[g]),
      alter: 3 + Math.floor(Math.random() * 10),
      stockmass: Math.round(r.h[0] + Math.random() * (r.h[1] - r.h[0])),
    };
    const a = $("auswahl");
    a.innerHTML = `
      <div class="leiste"><button id="zurueck">‹ Rassen</button><h2>${r.name}</h2><button id="zu" aria-label="Schließen">✕</button></div>
      <div class="inhalt">
        <div class="vorschau"><svg id="gross" viewBox="0 0 ${VB.b} ${VB.h}"></svg>
          <button class="blaettern links" id="rasseZurueck" aria-label="Vorherige Rasse">‹</button>
          <button class="blaettern rechts" id="rasseWeiter" aria-label="Nächste Rasse">›</button></div>
        <p class="text"><b>${r.herkunft}</b> · ${r.h[0]}–${r.h[1]} cm Stockmaß<br>${r.text}</p>

        <div class="feld"><span class="titel">Fellfarbe</span>
          <div class="chips" id="farben">${r.farben.map(fid => {
            const c = FARBEN[fid];
            return `<button class="chip" data-f="${fid}"><span class="swatch" style="background:linear-gradient(135deg, ${c.body} 55%, ${c.mane} 55%)"></span>${c.name}</button>`;
          }).join("")}</div>
        </div>

        <div class="feld"><span class="titel">Geschlecht</span>
          <div class="segment" id="geschlecht">${["Stute", "Hengst", "Wallach"].map(x => `<button data-g="${x}">${x}</button>`).join("")}</div>
        </div>

        <div class="feld"><label for="groesse">Stockmaß <span class="wert" id="groesseWert"></span></label>
          <input type="range" id="groesse" min="${r.h[0]}" max="${r.h[1]}" step="1">
        </div>

        <div class="feld"><label for="alter">Alter <span class="wert" id="alterWert"></span></label>
          <input type="range" id="alter" min="1" max="25" step="1">
        </div>

        <div class="feld"><label for="name">Name</label>
          <div class="zeile"><input type="text" id="name" maxlength="24" autocomplete="off"><button class="wuerfel" id="wuerfel" aria-label="Zufallsname">🎲</button></div>
        </div>

        <div class="fuss"><button class="knopf" id="einstellen">In Box 1 stellen</button></div>
      </div>`;
    a.scrollTop = 0;
    $("zu").onclick = schliessen;
    $("zurueck").onclick = zeigeRassen;
    const ri = RASSEN.findIndex(x => x.id === id);
    $("rasseZurueck").onclick = () => zeigeDetail(RASSEN[(ri - 1 + RASSEN.length) % RASSEN.length].id);
    $("rasseWeiter").onclick = () => zeigeDetail(RASSEN[(ri + 1) % RASSEN.length].id);
    a.querySelectorAll("#farben .chip").forEach(b => b.onclick = () => { wahl.farbe = b.dataset.f; aktualisiere(); });
    a.querySelectorAll("#geschlecht button").forEach(b => b.onclick = () => {
      const alt = wahl.geschlecht; wahl.geschlecht = b.dataset.g;
      if (NAMEN[alt].includes(wahl.name)) { wahl.name = zufallAus(NAMEN[wahl.geschlecht]); $("name").value = wahl.name; }
      aktualisiere();
    });
    $("groesse").value = wahl.stockmass;
    $("groesse").oninput = e => { wahl.stockmass = +e.target.value; aktualisiere(); };
    $("alter").value = wahl.alter;
    $("alter").oninput = e => { wahl.alter = +e.target.value; aktualisiere(); };
    $("name").value = wahl.name;
    $("name").oninput = e => { wahl.name = e.target.value; };
    $("wuerfel").onclick = () => { wahl.name = zufallAus(NAMEN[wahl.geschlecht]); $("name").value = wahl.name; };
    $("einstellen").onclick = () => {
      wahl.name = (wahl.name || "").trim() || zufallAus(NAMEN[wahl.geschlecht]);
      spiel.boxen[0].pferd = { ...wahl };
      delete spiel.boxen[0].pferd.maehne;
      spiel.boxen[0].pferd.maehneSeit = spiel.tag;
      spiel.boxen[0].pferd.werte = erzeugeWerte(spiel.boxen[0].pferd);
      spiel.boxen[0].pferd.pflege = erzeugePflege(spiel.boxen[0].pferd);
      spiel.boxen[0].tot = false;
      spiel.boxen[0].pferd.ahnen = erzeugeAhnen(spiel.boxen[0].pferd);
      aktenReiter = "steckbrief";
      speichern(); zeigeStall(); zeigeTag(); schliessen();
    };
    aktualisiere();
  }

  function aktualisiere() {
    const a = $("auswahl");
    a.querySelectorAll("#farben .chip").forEach(b => b.classList.toggle("an", b.dataset.f === wahl.farbe));
    a.querySelectorAll("#geschlecht button").forEach(b => b.classList.toggle("an", b.dataset.g === wahl.geschlecht));
    $("groesseWert").textContent = wahl.stockmass + " cm";
    $("alterWert").textContent = wahl.alter + (wahl.alter === 1 ? " Jahr" : " Jahre");
    // Maßband + Pferd
    let lineal = `<line x1="0" x2="${VB.b}" y1="${VB.boden}" y2="${VB.boden}" stroke="#c9b99f" stroke-width="2"/>`;
    for (let cm = 50; cm <= 250; cm += 50) {
      const y = VB.boden - cm;
      lineal += `<line x1="0" x2="${VB.b}" y1="${y}" y2="${y}" stroke="#b9cfd9" stroke-dasharray="3 5"/><text x="4" y="${y - 3}" font-size="10" fill="#7a8f99">${cm / 100} m</text>`;
    }
    const wy = VB.boden - wahl.stockmass;
    lineal += `<line x1="30" x2="${VB.b - 8}" y1="${wy}" y2="${wy}" stroke="var(--akzent)" stroke-width="1.5"/><text x="${VB.b - 8}" y="${wy - 4}" font-size="11" text-anchor="end" font-weight="700" fill="var(--akzent)">${wahl.stockmass} cm</text>`;
    // Breite anpassen, damit auch große Pferde ganz ins Bild passen
    const z = zeichnePferd(wahl.rasse, wahl.farbe, { seed: wahl.id, geschlecht: wahl.geschlecht });
    const sc = wahl.stockmass / 100, breite = (z.box.maxX - z.box.minX) * sc;
    const vb = Math.max(VB.b, breite + 70);
    $("gross").setAttribute("viewBox", `0 0 ${vb.toFixed(0)} ${VB.h}`);
    lineal = lineal.replaceAll(`x2="${VB.b}"`, `x2="${vb.toFixed(0)}"`).replaceAll(`x2="${VB.b - 8}"`, `x2="${(vb - 8).toFixed(0)}"`).replace(`x="${VB.b - 8}"`, `x="${(vb - 8).toFixed(0)}"`);
    const mx = 40 + breite / 2 + (vb - 50 - breite) / 2;
    $("gross").innerHTML = lineal + `<g transform="translate(${(mx - (z.box.minX + z.box.maxX) / 2 * sc).toFixed(1)},${VB.boden}) scale(${sc})">${z.svg}</g>`;
  }

  function schliessen() { $("auswahl").classList.remove("offen"); $("auswahl").innerHTML = ""; }

  $("krippenHinweis").insertAdjacentHTML("afterend", `<g id="mistHinweis" pointer-events="none">
      <rect x="268" y="222" width="70" height="20" rx="10" fill="#fffaf0" stroke="#2b1d14" stroke-width="1.4"/>
      <path d="M296,241.5 l5,8 l5,-8" fill="#fffaf0" stroke="#2b1d14" stroke-width="1.4" stroke-linejoin="round"/><path d="M295.5,241 h11" stroke="#fffaf0" stroke-width="2"/>
      <text x="303" y="236" text-anchor="middle" font-size="10" font-weight="700" fill="#2b1d12" font-family="system-ui, sans-serif">Ausmisten!</text></g>`);
  function bodenPunkt(r) {
    const y = 224 + r() * 68, rand = 60 - (y - 212) * (60 / 54);
    const xmin = Math.max(8, rand + 14), xmax = Math.min(392, 400 - rand - 14);
    return [xmin + r() * (xmax - xmin), y];
  }
  function zeichneMist() {
    const box = spiel.boxen[0], stufe = Math.max(1, box.mistStufe || 1);
    let g = "";
    // je länger nicht ausgemistet, desto dunkler und schmuddeliger das Stroh
    if (stufe > 1) g += `<polygon points="0,300 0,266 60,212 340,212 400,266 400,300" fill="#5e4218" opacity="${Math.min(0.42, 0.09 * (stufe - 1)).toFixed(2)}"/>`;
    // jeder nicht gemistete Tag hinterlässt eine eigene Schicht (ältere Äpfel liegen an derselben Stelle)
    for (let d = stufe - 1; d >= 0; d--) g += mistSchicht(zufall("mist-tag-" + (spiel.tag - d)), d);
    // Fliegen, wenn es richtig schmuddelig wird
    if (stufe >= 3) {
      const r = zufall("fliegen-" + spiel.tag);
      for (let i = 0; i < Math.min(8, (stufe - 2) * 3); i++) {
        const [x, y] = bodenPunkt(r), dur = (1.2 + r() * 1.5).toFixed(1);
        g += `<circle cx="${x.toFixed(0)}" cy="${(y - 12).toFixed(0)}" r="1.3" fill="#1b1612"><animateMotion dur="${dur}s" repeatCount="indefinite" path="M0,0 c6,-6 12,2 6,6 c-6,5 -12,-2 -6,-6"/></circle>`;
      }
    }
    $("mist").innerHTML = g;
  }
  function mistSchicht(r, alter) {
    let g = "";
    const dunkler = alter > 0;
    for (let i = 0; i < 6; i++) { const [x, y] = bodenPunkt(r), s = 0.6 + (y - 212) / 90;
      g += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(18 + r() * 20) * s}" ry="${(5 + r() * 5) * s}" fill="${dunkler ? "#6e5320" : r() < .5 ? "#a57f2e" : "#8c6a2c"}" opacity="${(.35 + r() * .25).toFixed(2)}"/>`; }
    for (let i = 0; i < 45; i++) { const [x, y] = bodenPunkt(r), a = r() * Math.PI, l = 5 + r() * 8;
      g += `<path d="M${x.toFixed(1)},${y.toFixed(1)} l${(Math.cos(a) * l).toFixed(1)},${(-Math.sin(a) * l * .6).toFixed(1)}" stroke="${(dunkler ? ["#6b4c18", "#8a6420", "#a5822e", "#5a4216"] : ["#8a6420", "#c99a2c", "#f7e38c", "#7a5a1e"])[i % 4]}" stroke-width="1.2" stroke-linecap="round"/>`; }
    for (let i = 0; i < 4; i++) { const [x, y] = bodenPunkt(r), s = 0.6 + (y - 212) / 90;
      g += `<path d="M${(x - 14 * s).toFixed(1)},${y.toFixed(1)} q${(6 * s).toFixed(1)},${(-9 * s).toFixed(1)} ${(14 * s).toFixed(1)},${(-6 * s).toFixed(1)} q${(8 * s).toFixed(1)},${(-5 * s).toFixed(1)} ${(14 * s).toFixed(1)},${(6 * s).toFixed(1)} z" fill="${dunkler ? "#b58f3a" : "#d9b04a"}" stroke="#2b1d14" stroke-width="1"/>`; }
    const anzahl = 3 + Math.floor(r() * 3);
    for (let i = 0; i < anzahl; i++) {
      const [x, y] = bodenPunkt(r), s = 0.65 + (y - 212) / 80;
      const baelle = [[-5, 0], [0, -1], [5, 0.5], [-2.5, -4.5], [2.5, -4.2], [0, -8]].slice(0, 4 + Math.floor(r() * 3));
      g += `<ellipse cx="${x.toFixed(1)}" cy="${(y + 3 * s).toFixed(1)}" rx="${(11 * s).toFixed(1)}" ry="${(3 * s).toFixed(1)}" fill="#5a4015" opacity=".35"/>`;
      g += baelle.map(([dx, dy]) => `<ellipse cx="${(x + dx * s).toFixed(1)}" cy="${(y + dy * s).toFixed(1)}" rx="${(4 * s).toFixed(1)}" ry="${(3.4 * s).toFixed(1)}" fill="${dunkler ? "#4f3616" : "#6b4a22"}" stroke="#2b1d14" stroke-width=".9"/>` +
        `<ellipse cx="${(x + dx * s - 1.2 * s).toFixed(1)}" cy="${(y + dy * s - 1.2 * s).toFixed(1)}" rx="${(1.4 * s).toFixed(1)}" ry="${(0.9 * s).toFixed(1)}" fill="${dunkler ? "#6e5230" : "#9a7440"}"/>`).join("");
      g += `<path d="M${(x - 3 * s).toFixed(1)},${(y - 1 * s).toFixed(1)} l${(3 * s).toFixed(1)},${(1.5 * s).toFixed(1)}" stroke="#c99a2c" stroke-width=".8"/>`;
    }
    return g;
  }
  function funkeln() {
    let g = "";
    for (let i = 0; i < 7; i++) { const x = 90 + Math.random() * 220, y = 230 + Math.random() * 55;
      g += `<text class="funkeln" x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="12" style="animation-delay:${(i * 0.08).toFixed(2)}s">✨</text>`; }
    const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
    el.innerHTML = g; $("stall").appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
  function zeigeTag() {
    const box = spiel.boxen[0];
    $("tagAnzeige").innerHTML = `<b>☀️ Tag ${spiel.tag}</b><small>beenden 🌙</small>`;
    $("tagAnzeige").setAttribute("aria-label", `Tag ${spiel.tag} – antippen, um den Tag zu beenden`);
    $("stall").classList.toggle("leer", !box.krippeVoll);
    $("stall").classList.toggle("mistig", !!box.mistig);
    if (box.mistig) { zeichneMist(); $("mist").classList.remove("weg"); } else $("mist").classList.add("weg");
    $("stall").classList.toggle("tot", !!box.tot);
    $("totText").style.display = box.tot ? "" : "none";
    if (box.pferd.pflege) zeigeAkte();
  }
  $("krippe").addEventListener("click", () => {
    const box = spiel.boxen[0];
    if (box.tot || box.krippeVoll) return;
    box.krippeVoll = true;
    speichern(); zeigeTag();
  });
  const ausmisten = () => {
    const box = spiel.boxen[0];
    if (box.tot || !box.mistig) return;
    box.mistig = false; box.mistStufe = 0;
    speichern(); zeigeTag(); funkeln();
  };
  $("mist").addEventListener("click", ausmisten);
  $("boden").addEventListener("click", ausmisten);
  $("tagAnzeige").onclick = () => {
    const box = spiel.boxen[0], offen = [];
    if (box.tot) return;
    if (!box.krippeVoll) offen.push("die Krippe ist noch leer");
    if (box.mistig) offen.push("die Box ist noch nicht ausgemistet");
    $("nachtSymbol").textContent = "🌙"; $("nachtText").textContent = `Ende von Tag ${spiel.tag}`;
    $("nacht").classList.add("an");
    setTimeout(() => {
      spiel.tag += 1;
      spiel.boxen.forEach(b => {
        const pf = b.pferd.pflege;
        let g = pf.gesundheit;
        if (!b.krippeVoll) g -= 19;      // hungrig ins Bett: −19 Punkte
        if (b.mistig) g -= 9.5;          // Box nicht gemistet: −9,5 Punkte
        if (b.krippeVoll && !b.mistig) g += 4;
        if (spiel.tag - pf.huf > 56) g -= 2;
        g = Math.round(g * 10) / 10;
        // Rettungsnetz: wer über 1 % lag, fällt nur auf 1 %. Wer schon bei 1 % (oder weniger) war, stirbt bei 0.
        if (g <= 0) { if (pf.gesundheit > 1) g = 1; else { g = 0; b.tot = true; } }
        pf.gesundheit = Math.max(0, Math.min(100, g));
        b.mistStufe = b.mistig ? Math.min(6, (b.mistStufe || 1) + 1) : 1;
        b.krippeVoll = false; b.mistig = true;
        // Mähne wächst alle 5 Tage eine Stufe (bis „extra lang“)
        const pf2 = b.pferd, idx = MAEHNEN.findIndex(m => m[0] === (pf2.maehne || naturMaehne(pf2.rasse)));
        if (spiel.tag - (pf2.maehneSeit || spiel.tag) >= MAEHNE_WACHSTUM) {
          if (idx < MAEHNEN.length - 1) pf2.maehne = MAEHNEN[idx + 1][0];
          pf2.maehneSeit = spiel.tag;
        }
      });
      speichern(); zeigeStall(); zeigeTag();
      $("nachtSymbol").textContent = "☀️"; $("nachtText").textContent = `Tag ${spiel.tag} beginnt`;
    }, 1100);
    setTimeout(() => $("nacht").classList.remove("an"), 2300);
  };

  // ---------- Menü ----------
  const menueZu = () => { $("menueListe").hidden = true; $("menueKnopf").setAttribute("aria-expanded", "false"); };
  $("menueKnopf").onclick = e => {
    e.stopPropagation();
    const auf = $("menueListe").hidden;
    $("menueListe").hidden = !auf; $("menueKnopf").setAttribute("aria-expanded", String(auf));
  };
  document.addEventListener("click", e => { if (!e.target.closest(".menue")) menueZu(); });
  $("mVollbild").onclick = () => {
    menueZu();
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (el.requestFullscreen) el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else alert("Dein Browser unterstützt keinen Vollbildmodus. Tipp: Seite über „Zum Home-Bildschirm“ hinzufügen – dann startet das Spiel randlos.");
  };
  const vollbildText = () => { $("mVollbild").textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? "⛶ Vollbild beenden" : "⛶ Vollbild"; };
  document.addEventListener("fullscreenchange", vollbildText); document.addEventListener("webkitfullscreenchange", vollbildText);
  // ---------- Enzyklopädie ----------
  const ENZY = {
    kopf: { titel: "Kopfformen", ansicht: "kopf", rasse: "hannoveraner", farbe: "brauner", eintraege: [
      ["Hechtkopf", "Nach innen gewölbtes (konkaves) Profil, typisch für den Araber.", { profile: -2.6, muz: 0.8 }],
      ["Gerader Kopf", "Gerades Nasenprofil – bei den meisten Warmblütern.", { profile: 0 }],
      ["Ramsnase", "Leicht gewölbter Nasenrücken, z. B. beim Andalusier.", { profile: 1.1 }],
      ["Ramskopf", "Stark nach außen gewölbtes Profil, z. B. Shire oder Lipizzaner.", { profile: 2.6 }],
      ["Keilkopf", "Breite Stirn, schmal zulaufendes kleines Maul.", { hw: 1.15, muz: 0.72, profile: 0 }],
      ["Schweinskopf", "Kleine Augen, dicke Ganaschen und schweres, plumpes Maul.", { eye: 0.75, jw: 1.3, muz: 1.2, profile: 0.2 }],
    ] },
    hals: { titel: "Halsformen", ansicht: "vorn", rasse: "hannoveraner", farbe: "fuchs", eintraege: [
      ["Gerader Hals", "Ober- und Unterlinie verlaufen fast gerade.", { crest: 0.0, nAng: 50 }],
      ["Schwanenhals", "Langer, oben stark geschwungener Hals mit hohem Ansatz.", { neck: 0.72, nAng: 66, crest: 0.08 }],
      ["Hirschhals", "Eingesenkte Oberlinie, die Unterseite wölbt sich vor (Fehler).", { crest: -0.11, nAng: 60, kw: 6, nk: 0.6 }],
      ["Speckhals", "Dicker, fetter Mähnenkamm – oft bei Ponys und Hengsten.", { crest: 0.17, nk: 1 }],
      ["Kurzer Hals", "Kurz und kräftig, wirkt gedrungen.", { neck: 0.38, nk: 0.8 }],
      ["Tief angesetzter Hals", "Der Hals kommt flach aus der Brust.", { nAng: 34, crest: 0.02 }],
    ] },
    ruecken: { titel: "Rückenformen", ansicht: "ganz", rasse: "hannoveraner", farbe: "dunkelbrauner", eintraege: [
      ["Gerader Rücken", "Ideal: kräftig und leicht geschwungen.", { sag: 0 }],
      ["Senkrücken", "Der Rücken hängt durch – oft bei alten Pferden.", { sag: 16 }],
      ["Karpfenrücken", "Nach oben gewölbter, aufgekrümmter Rücken.", { sag: -12 }],
      ["Langer Rücken", "Viel Abstand zwischen Widerrist und Kruppe.", { len: 1.2 }],
      ["Kurzer Rücken", "Kompakt und tragfähig.", { len: 0.9 }],
    ] },
    kopfabz: { titel: "Kopfabzeichen", ansicht: "kopf", rasse: "hannoveraner", farbe: "fuchs", eintraege: [
      ["Flocke", "Ganz kleiner weißer Fleck auf der Stirn.", null, { kopf: "flocke" }],
      ["Stern", "Weißer Fleck auf der Stirn.", null, { kopf: "stern" }],
      ["Schnippe", "Weißer Fleck zwischen den Nüstern.", null, { kopf: "schnippe" }],
      ["Stern mit Schnippe", "Stern und Schnippe ohne Verbindung.", null, { kopf: "sternschnippe" }],
      ["Blesse", "Weißer Streifen von der Stirn bis zur Nase.", null, { kopf: "blesse" }],
      ["Breite Blesse", "Breiter Streifen über den Nasenrücken.", null, { kopf: "durchgehend" }],
      ["Laterne", "Sehr breite Blesse, die über die Augen- und Maulpartie reicht.", null, { kopf: "laterne" }],
    ] },
    beinabz: { titel: "Beinabzeichen", ansicht: "beine", rasse: "hannoveraner", farbe: "brauner", eintraege: [
      ["Weiße Krone", "Schmaler weißer Rand direkt über dem Huf.", null, { beine: "krone" }],
      ["Halbe Fessel", "Weiß bis zur Mitte der Fessel.", null, { beine: "halbefessel" }],
      ["Weiße Fessel", "Die ganze Fessel ist weiß.", null, { beine: "fessel" }],
      ["Halbstrumpf", "Weiß bis zur Mitte des Röhrbeins.", null, { beine: "halbstrumpf" }],
      ["Strumpf", "Weiß bis knapp unter Knie bzw. Sprunggelenk.", null, { beine: "strumpf" }],
      ["Hochweiß", "Weiß reicht über Knie oder Sprunggelenk hinaus.", null, { beine: "hochweiss" }],
    ] },
    farben: { titel: "Fellfarben", ansicht: "ganz", rasse: "quarter", farbe: null, eintraege: Object.entries(FARBEN).map(([id, c]) => [c.name, FARBBESCHREIBUNG[id] || "", null, null, id]) },
  };
  let enzyKat = "kopf";
  function enzyBild(kat, e) {

    const z = zeichnePferd(kat.rasse, farbe || kat.farbe, { k: kopfBild ? { fore: 0, ...(kOv || {}) } : (kOv || undefined), abzeichen: abz || undefined, seed: "enz", maehne: kopfBild ? "kurz" : undefined });
    const b = z.box, w = b.maxX - b.minX, h = -b.minY;

        <div class="enz-tabs">${Object.entries(ENZY).map(([id, k]) => `<button data-kat="${id}" class="${id === enzyKat ? "an" : ""}">${k.titel}</button>`).join("")}</div>

  $("mNeustart").onclick = () => {

    spiel.tag = 1;

      delete p.maehne; p.maehneSeit = 1;
      p.pflege = erzeugePflege(p, 1);
      b.krippeVoll = true; b.mistig = false; b.mistStufe = 0; b.tot = false;

  };

  $("waehlen").onclick = zeigeRassen;
  $("pferdPlatz").addEventListener("click", zeigeRassen);
  zeigeStall();
  zeigeTag();
</script>
